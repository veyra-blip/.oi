services:
  - type: web
    name: veyra-internal-wallet-backend
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
      - key: JWT_SECRET
      - key: REFRESH_SECRET
      - key: FRONTEND_ORIGIN
      - key: PAYSTACK_SECRET_KEY
      - key: TERMII_API_KEY
      - key: TERMII_SENDER_IDS