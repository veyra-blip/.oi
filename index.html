<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPay Simulation</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #121212; color: #e0e0e0; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-0 md:p-4">

    <div id="app" class="w-full max-w-md bg-[#181818] md:rounded-3xl shadow-2xl overflow-hidden min-h-screen md:min-h-[850px] flex flex-col relative border border-[#262626]">
        <div id="screen-container" class="flex-1 flex flex-col overflow-y-auto pb-20"></div>
        <div id="modal-container"></div>
    </div>

    <script>
        let session = localStorage.getItem('opay_session') || null;

        async function request(url, data) {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            return await res.json();
        }

        async function renderApp() {
            const container = document.getElementById('screen-container');
            document.getElementById('modal-container').innerHTML = '';

            if (!session) {
                if (window.location.hash === '#register') container.innerHTML = renderRegister();
                else container.innerHTML = renderLogin();
            } else {
                const res = await fetch(`/api/user/${session}`);
                const data = await res.json();
                if (!data.success) { session = null; localStorage.removeItem('opay_session'); renderApp(); return; }
                
                const user = data.user;
                const hash = window.location.hash;

                if (hash === '#send') container.innerHTML = renderSend(user);
                else if (hash === '#history') container.innerHTML = renderHistory(user);
                else if (hash === '#notifications') container.innerHTML = renderNotifications(user);
                else if (hash === '#all-services') container.innerHTML = renderAllServices(user);
                else if (hash === '#profile') container.innerHTML = renderProfile(user);
                else container.innerHTML = renderHome(user);
            }
        }

        window.addEventListener('hashchange', renderApp);
        window.addEventListener('load', renderApp);

        // --- SCREENS ---

        function renderLogin() {
            return `
                <div class="flex-1 flex flex-col p-6 justify-center">
                    <div class="text-center mb-8">
                        <div class="w-16 h-16 rounded-2xl bg-[#10b981] text-black font-extrabold text-3xl flex items-center justify-center mx-auto mb-3 shadow-lg">₦</div>
                        <h1 class="text-2xl font-bold text-white">Welcome to OPay</h1>
                        <p class="text-xs text-slate-400 mt-1">Internal Network Simulation</p>
                    </div>
                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <input type="text" id="log-id" placeholder="Phone Number or Email" required class="w-full bg-[#222] border border-[#333] rounded-xl px-4 py-3 text-sm text-white focus:border-[#10b981] focus:outline-none">
                        <input type="password" id="log-pw" placeholder="Password" required class="w-full bg-[#222] border border-[#333] rounded-xl px-4 py-3 text-sm text-white focus:border-[#10b981] focus:outline-none">
                        <button type="submit" class="w-full bg-[#10b981] hover:bg-[#059669] text-black font-bold py-3.5 rounded-xl transition">Sign In</button>
                    </form>
                    <button onclick="window.location.hash='#register'" class="text-xs text-[#10b981] text-center mt-6 block">Don't have an account? Register</button>
                </div>
            `;
        }

        function renderRegister() {
            return `
                <div class="flex-1 flex flex-col p-6 justify-center">
                    <h2 class="text-lg font-bold text-white mb-4">Create OPay Account</h2>
                    <form onsubmit="handleRegister(event)" class="space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="reg-fn" placeholder="First Name" required class="bg-[#222] border border-[#333] p-3 rounded-xl text-xs text-white">
                            <input type="text" id="reg-ln" placeholder="Last Name" required class="bg-[#222] border border-[#333] p-3 rounded-xl text-xs text-white">
                        </div>
                        <input type="tel" id="reg-ph" placeholder="Phone Number (Login ID)" required class="w-full bg-[#222] border border-[#333] p-3 rounded-xl text-xs text-white">
                        <input type="email" id="reg-em" placeholder="Email Address" required class="w-full bg-[#222] border border-[#333] p-3 rounded-xl text-xs text-white">
                        <input type="password" id="reg-pw" placeholder="Password" required class="w-full bg-[#222] border border-[#333] p-3 rounded-xl text-xs text-white">
                        <input type="tel" inputmode="numeric" maxLength="4" id="reg-pin" placeholder="4-digit Transaction PIN" required class="w-full bg-[#222] border border-[#333] p-3 rounded-xl text-xs text-white tracking-widest">
                        <button type="submit" class="w-full bg-[#10b981] text-black font-bold py-3.5 rounded-xl text-xs mt-2">Open Account (Get ₦500M)</button>
                    </form>
                    <button onclick="window.location.hash=''" class="text-xs text-slate-400 text-center mt-4 block">Back to Sign In</button>
                </div>
            `;
        }

        function renderHome(user) {
            return `
                <div class="flex-1 flex flex-col">
                    <!-- Top Bar -->
                    <div class="p-4 flex items-center justify-between border-b border-[#262626]">
                        <div class="flex items-center gap-3">
                            <div onclick="window.location.hash='#profile'" class="w-10 h-10 rounded-full bg-[#10b981]/20 text-[#10b981] font-bold flex items-center justify-center cursor-pointer">
                                ${user.firstname[0]}${user.lastname[0]}
                            </div>
                            <div>
                                <h3 class="text-xs text-slate-400">Hi, ${user.firstname} ${user.lastname}</h3>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 text-slate-300">
                            <i class="fa-solid fa-headset cursor-pointer"></i>
                            <i class="fa-solid fa-qrcode cursor-pointer"></i>
                            <i onclick="window.location.hash='#notifications'" class="fa-regular fa-bell cursor-pointer relative"></i>
                        </div>
                    </div>

                    <!-- Balance Card -->
                    <div class="p-4">
                        <div class="bg-[#10b981] text-black rounded-2xl p-5 shadow-lg relative">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-semibold opacity-90 flex items-center gap-1">
                                    Available Balance 
                                    <i onclick="toggleBalanceVisibility()" class="fa-solid ${user.hideBalance ? 'fa-eye-slash' : 'fa-eye'} cursor-pointer ml-1"></i>
                                </span>
                                <span onclick="window.location.hash='#history'" class="text-xs font-bold underline cursor-pointer">Transaction History</span>
                            </div>
                            <h1 class="text-3xl font-extrabold mt-2">
                                ${user.hideBalance ? '₦••••••••' : '₦' + user.balance.toLocaleString('en-NG', {minimumFractionDigits: 2})}
                            </h1>
                            <div class="flex justify-between items-center mt-4 pt-3 border-t border-black/10 text-xs font-semibold">
                                <span>Earned Today ₦0.00</span>
                                <button onclick="alert('Account No: ${user.accountNumber}\\nPhone: ${user.phone}')" class="bg-black text-[#10b981] px-3 py-1 rounded-lg">Add Money</button>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Action Grid (OPay style)[span_9](start_span)[span_9](end_span) -->
                    <div class="px-4 py-2 grid grid-cols-4 gap-3 text-center">
                        <div onclick="window.location.hash='#send'" class="bg-[#222] p-3 rounded-2xl cursor-pointer">
                            <div class="w-10 h-10 rounded-xl bg-[#10b981]/10 text-[#10b981] mx-auto flex items-center justify-center mb-1"><i class="fa-solid fa-user"></i></div>
                            <span class="text-[11px] text-slate-300">To OPay</span>
                        </div>
                        <div onclick="alert('Internal simulation mode: Transfers restricted to OPay network accounts only.')" class="bg-[#222] p-3 rounded-2xl cursor-pointer">
                            <div class="w-10 h-10 rounded-xl bg-[#10b981]/10 text-[#10b981] mx-auto flex items-center justify-center mb-1"><i class="fa-solid fa-building-columns"></i></div>
                            <span class="text-[11px] text-slate-300">To Bank</span>
                        </div>
                        <div onclick="openServiceModal('Savings')" class="bg-[#222] p-3 rounded-2xl cursor-pointer">
                            <div class="w-10 h-10 rounded-xl bg-[#10b981]/10 text-[#10b981] mx-auto flex items-center justify-center mb-1"><i class="fa-solid fa-vault"></i></div>
                            <span class="text-[11px] text-slate-300">Save</span>
                        </div>
                        <div onclick="openServiceModal('Loan')" class="bg-[#222] p-3 rounded-2xl cursor-pointer">
                            <div class="w-10 h-10 rounded-xl bg-[#10b981]/10 text-[#10b981] mx-auto flex items-center justify-center mb-1"><i class="fa-solid fa-hand-holding-dollar"></i></div>
                            <span class="text-[11px] text-slate-300">Loan</span>
                        </div>
                    </div>

                    <!-- Services Grid[span_10](start_span)[span_10](end_span) -->
                    <div class="px-4 py-3 grid grid-cols-4 gap-3 text-center">
                        <div onclick="openServiceModal('Airtime')" class="bg-[#222] p-3 rounded-2xl cursor-pointer">
                            <div class="w-9 h-9 rounded-xl bg-[#10b981]/10 text-[#10b981] mx-auto flex items-center justify-center mb-1"><i class="fa-solid fa-mobile-screen text-xs"></i></div>
                            <span class="text-[10px] text-slate-300">Airtime</span>
                        </div>
                        <div onclick="openServiceModal('Data')" class="bg-[#222] p-3 rounded-2xl cursor-pointer">
                            <div class="w-9 h-9 rounded-xl bg-[#10b981]/10 text-[#10b981] mx-auto flex items-center justify-center mb-1"><i class="fa-solid fa-wifi text-xs"></i></div>
                            <span class="text-[10px] text-slate-300">Data</span>
                        </div>
                        <div onclick="openServiceModal('Betting')" class="bg-[#222] p-3 rounded-2xl cursor-pointer">
                            <div class="w-9 h-9 rounded-xl bg-[#10b981]/10 text-[#10b981] mx-auto flex items-center justify-center mb-1"><i class="fa-solid fa-futbol text-xs"></i></div>
                            <span class="text-[10px] text-slate-300">Betting</span>
                        </div>
                        <div onclick="window.location.hash='#all-services'" class="bg-[#222] p-3 rounded-2xl cursor-pointer">
                            <div class="w-9 h-9 rounded-xl bg-[#10b981]/10 text-[#10b981] mx-auto flex items-center justify-center mb-1"><i class="fa-solid fa-grip text-xs"></i></div>
                            <span class="text-[10px] text-slate-300">More</span>
                        </div>
                    </div>

                    ${renderBottomNav('home')}
                </div>
            `;
        }

        function renderSend(user) {
            return `
                <div class="flex-1 flex flex-col p-4 space-y-4">
                    <div class="flex items-center justify-between border-b border-[#262626] pb-3">
                        <button onclick="window.location.hash=''" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-2"></i>Back</button>
                        <h2 class="text-sm font-bold text-white">Transfer to OPay Account</h2>
                        <div class="w-8"></div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Recipient Phone Number or Account No.</label>
                        <input type="tel" id="send-target" placeholder="Enter phone or 10-digit account" class="w-full bg-[#222] border border-[#333] rounded-xl px-4 py-3 text-sm text-white focus:border-[#10b981] focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Amount (₦)</label>
                        <input type="number" id="send-amount" placeholder="0.00" class="w-full bg-[#222] border border-[#333] rounded-xl px-4 py-3 text-sm text-white focus:border-[#10b981] focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Transaction PIN (4 digits)</label>
                        <input type="tel" inputmode="numeric" maxLength="4" id="send-pin" placeholder="••••" class="w-full bg-[#222] border border-[#333] rounded-xl px-4 py-3 text-sm text-white tracking-widest focus:border-[#10b981] focus:outline-none">
                    </div>

                    <button onclick="executeTransfer()" class="w-full bg-[#10b981] text-black font-bold py-3.5 rounded-xl transition mt-4">Transfer Now</button>

                    ${renderBottomNav('send')}
                </div>
            `;
        }

        function renderHistory(user) {
            return `
                <div class="flex-1 flex flex-col p-4 space-y-3">
                    <div class="flex items-center justify-between border-b border-[#262626] pb-3">
                        <button onclick="window.location.hash=''" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-2"></i>Back</button>
                        <h2 class="text-sm font-bold text-white">Transaction History</h2>
                        <div class="w-8"></div>
                    </div>
                    ${user.transactions.length === 0 ? '<p class="text-xs text-slate-500 text-center py-10">No transactions yet.</p>' :
                        user.transactions.slice().reverse().map(tx => `
                            <div class="bg-[#222] p-3.5 rounded-xl flex justify-between items-center text-xs">
                                <div>
                                    <span class="font-bold text-white block">${tx.title}</span>
                                    <span class="text-slate-400 text-[10px]">${tx.date} •${tx.details}</span>
                                </div>
                                <span class="font-bold ${tx.type === 'debit' ? 'text-rose-400' : 'text-[#10b981]'}">
                                    ${tx.type === 'debit' ? '-' : '+'}₦${tx.amount.toLocaleString()}
                                </span>
                            </div>
                        `).join('')}
                    ${renderBottomNav('history')}
                </div>
            `;
        }

        function renderNotifications(user) {
            return `
                <div class="flex-1 flex flex-col p-4 space-y-3">
                    <div class="flex items-center justify-between border-b border-[#262626] pb-3">
                        <button onclick="window.location.hash=''" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-2"></i>Back</button>
                        <h2 class="text-sm font-bold text-white">Notifications</h2>
                        <div class="w-8"></div>
                    </div>
                    ${user.notifications.slice().reverse().map(n => `
                        <div class="bg-[#222] p-3.5 rounded-xl">
                            <span class="text-xs font-bold text-white block mb-1"><i class="fa-solid fa-bell text-[#10b981] mr-1"></i> ${n.title}</span>
                            <p class="text-xs text-slate-300">${n.message}</p>
                            <span class="text-[10px] text-slate-500 mt-2 block">${n.date}</span>
                        </div>
                    `).join('')}
                    ${renderBottomNav('notifications')}
                </div>
            `;
        }

        function renderAllServices(user) {
            return `
                <div class="flex-1 flex flex-col p-4 space-y-4">
                    <div class="flex items-center justify-between border-b border-[#262626] pb-3">
                        <button onclick="window.location.hash=''" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-2"></i>Back</button>
                        <h2 class="text-sm font-bold text-white">All Services</h2>
                        <div class="w-8"></div>
                    </div>
                    <div class="grid grid-cols-4 gap-3 text-center">
                        <div onclick="openServiceModal('Electricity')" class="bg-[#222] p-3 rounded-2xl cursor-pointer"><i class="fa-solid fa-lightbulb text-[#10b981] text-lg mb-1"></i><span class="text-[10px] block text-slate-300">Electricity</span></div>
                        <div onclick="openServiceModal('TV Bill')" class="bg-[#222] p-3 rounded-2xl cursor-pointer"><i class="fa-solid fa-tv text-[#10b981] text-lg mb-1"></i><span class="text-[10px] block text-slate-300">TV Bill</span></div>
                        <div onclick="openServiceModal('Education')" class="bg-[#222] p-3 rounded-2xl cursor-pointer"><i class="fa-solid fa-graduation-cap text-[#10b981] text-lg mb-1"></i><span class="text-[10px] block text-slate-300">Education</span></div>
                        <div onclick="openServiceModal('Betting')" class="bg-[#222] p-3 rounded-2xl cursor-pointer"><i class="fa-solid fa-futbol text-[#10b981] text-lg mb-1"></i><span class="text-[10px] block text-slate-300">Betting</span></div>
                    </div>
                    ${renderBottomNav('')}
                </div>
            `;
        }

        function renderProfile(user) {
            return `
                <div class="flex-1 flex flex-col p-4 space-y-4">
                    <div class="flex items-center justify-between border-b border-[#262626] pb-3">
                        <button onclick="window.location.hash=''" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-2"></i>Back</button>
                        <h2 class="text-sm font-bold text-white">Me & Security</h2>
                        <div class="w-8"></div>
                    </div>
                    <div class="bg-[#222] p-4 rounded-2xl text-center">
                        <h3 class="font-bold text-white text-base">${user.firstname} ${user.lastname}</h3>
                        <p class="text-xs text-[#10b981] mt-1">${user.phone} • Acc: ${user.accountNumber}</p>
                    </div>
                    <button onclick="handleLogout()" class="w-full bg-rose-500/10 text-rose-400 font-bold py-3 rounded-xl text-xs">Sign Out</button>
                    ${renderBottomNav('profile')}
                </div>
            `;
        }

        function renderBottomNav(active) {
            return `
                <div class="absolute bottom-0 left-0 right-0 bg-[#181818] border-t border-[#262626] p-2 flex justify-around items-center text-xs">
                    <button onclick="window.location.hash=''" class="${active==='home'?'text-[#10b981] font-bold':'text-slate-400'}"><i class="fa-solid fa-house block mb-1"></i>Home</button>
                    <button onclick="window.location.hash='#history'" class="${active==='history'?'text-[#10b981] font-bold':'text-slate-400'}"><i class="fa-solid fa-chart-pie block mb-1"></i>Rewards</button>
                    <button onclick="window.location.hash='#notifications'" class="${active==='notifications'?'text-[#10b981] font-bold':'text-slate-400'}"><i class="fa-solid fa-envelope block mb-1"></i>Inbox</button>
                    <button onclick="window.location.hash='#profile'" class="${active==='profile'?'text-[#10b981] font-bold':'text-slate-400'}"><i class="fa-solid fa-user block mb-1"></i>Me</button>
                </div>
            `;
        }

        // --- MODALS & ACTIONS ---

        function openServiceModal(serviceName) {
            document.getElementById('modal-container').innerHTML = `
                <div class="absolute inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end justify-center p-4">
                    <div class="bg-[#1e1e1e] border border-[#333] w-full rounded-3xl p-6 space-y-4 shadow-2xl">
                        <div class="flex justify-between items-center border-b border-[#333] pb-2">
                            <h3 class="font-bold text-white text-sm">Simulate ${serviceName}</h3>
                            <button onclick="document.getElementById('modal-container').innerHTML=''" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <input type="text" id="srv-target" placeholder="Recipient / Meter / ID" class="w-full bg-[#262626] border border-[#333] p-3 rounded-xl text-sm text-white">
                        <input type="number" id="srv-amount" placeholder="Amount (₦)" class="w-full bg-[#262626] border border-[#333] p-3 rounded-xl text-sm text-white">
                        <input type="tel" inputmode="numeric" maxLength="4" id="srv-pin" placeholder="4-digit PIN" class="w-full bg-[#262626] border border-[#333] p-3 rounded-xl text-sm text-white tracking-widest">
                        <button onclick="executeService('${serviceName}')" class="w-full bg-[#10b981] text-black font-bold py-3 rounded-xl">Pay Now</button>
                    </div>
                </div>
            `;
        }

        async function executeService(serviceName) {
            const target = document.getElementById('srv-target').value;
            const amount = parseFloat(document.getElementById('srv-amount').value);
            const pin = document.getElementById('srv-pin').value;

            const res = await request('/api/service', { phone: session, serviceName, target, amount, pin });
            if (res.success) {
                alert(res.message);
                window.location.hash = '';
                renderApp();
            } else {
                alert(res.message);
            }
        }

        async function toggleBalanceVisibility() {
            // Toggle local hide state in session/db if needed
            renderApp();
        }

        async function handleRegister(e) {
            e.preventDefault();
            const data = {
                firstname: document.getElementById('reg-fn').value,
                lastname: document.getElementById('reg-ln').value,
                phone: document.getElementById('reg-ph').value,
                email: document.getElementById('reg-em').value,
                password: document.getElementById('reg-pw').value,
                pin: document.getElementById('reg-pin').value
            };
            const res = await request('/api/register', data);
            if (res.success) {
                session = res.phone;
                localStorage.setItem('opay_session', session);
                window.location.hash = '';
                renderApp();
            } else {
                alert(res.message);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const res = await request('/api/login', {
                identifier: document.getElementById('log-id').value,
                password: document.getElementById('log-pw').value
            });
            if (res.success) {
                session = res.phone;
                localStorage.setItem('opay_session', session);
                window.location.hash = '';
                renderApp();
            } else {
                alert(res.message);
            }
        }

        async function executeTransfer() {
            const recipientTarget = document.getElementById('send-target').value;
            const amount = parseFloat(document.getElementById('send-amount').value);
            const pin = document.getElementById('send-pin').value;

            const res = await request('/api/transfer', { senderPhone: session, recipientTarget, amount, pin });
            if (res.success) {
                alert(res.message);
                window.location.hash = '';
                renderApp();
            } else {
                alert(res.message);
            }
        }

        function handleLogout() {
            session = null;
            localStorage.removeItem('opay_session');
            window.location.hash = '';
            renderApp();
        }
    </script>
</body>
</html>
