<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18d39a">
<title>Veyra Wallet</title>
<style>
:root{--bg:#121313;--panel:#1c1f1e;--panel2:#242826;--mint:#18d39a;--mint2:#0e8f68;--text:#f4f7f5;--muted:#9ea8a3;--line:#343936;--danger:#e5484d;--yellow:#ffd84d;--maroon:#3a1719;--radius:20px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#080909;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{max-width:480px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:88px;position:relative}.topbar{height:64px;background:#101211;border-bottom:1px solid #292c2a;display:flex;align-items:center;justify-content:space-between;padding:0 15px;position:sticky;top:0;z-index:40}.brand{display:flex;align-items:center;gap:9px;font-weight:950}.brandmark{width:34px;height:34px;border-radius:11px;background:var(--mint);display:grid;place-items:center;color:#073628;font-weight:1000}.top-actions{display:flex;gap:7px}.iconbtn{width:38px;height:38px;border-radius:50%;background:#242725;color:#fff;display:grid;place-items:center;font-size:18px;position:relative}.badge{position:absolute;right:-1px;top:-2px;background:var(--danger);min-width:16px;height:16px;padding:0 4px;border-radius:9px;font-size:9px;display:grid;place-items:center;border:2px solid #101211}.screen{display:none;padding:16px}.screen.active{display:block}.hero{background:linear-gradient(135deg,#19d39a,#0fbe86);color:#082d21;border-radius:24px;padding:20px;position:relative;overflow:hidden}.hero.dark{background:linear-gradient(135deg,#123d30,#082d21);color:#fff}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:.05em;font-weight:900;opacity:.8}.balance{font-size:30px;font-weight:950;margin:5px 0}.muted{color:var(--muted);font-size:13px}.quick{display:flex;gap:8px;margin-top:16px}.btn{border-radius:13px;padding:12px 15px;font-weight:850;width:100%;text-align:center}.btn.primary{background:var(--mint);color:#073628}.btn.soft{background:#173d31;color:#9ce6cc}.btn.dark{background:#111312;color:#fff;border:1px solid var(--line)}.btn.yellow{background:var(--yellow);color:#201c00}.btn.danger{background:#3a1719;color:#f28b8e}.btn:disabled{opacity:.45;cursor:not-allowed}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.service-item{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:13px 5px;text-align:center;color:#fff;min-height:86px}.service-ico{width:42px;height:42px;border-radius:14px;background:#111312;color:var(--mint);display:grid;place-items:center;font-size:19px;margin:0 auto 7px}.service-item span{display:block;font-size:10.5px;font-weight:800}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:24px;font-weight:950;margin:0 0 4px}.subtitle{color:var(--muted);font-size:13px;margin:0 0 14px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;background:#171918;border:1px solid #444946;border-radius:13px;padding:13px;color:#fff;outline:none}.field input:focus,.field select:focus{border-color:var(--mint)}.v-list{background:var(--panel);border-radius:20px;overflow:hidden;margin-top:12px;border:1px solid var(--line)}.v-row{width:100%;display:flex;align-items:center;gap:12px;padding:15px;background:none;color:#fff;text-align:left;border-bottom:1px solid #373b38}.v-row:last-child{border-bottom:0}.ri{width:30px;text-align:center;font-size:19px;color:var(--mint)}.rb{flex:1}.rs{font-size:11px;color:#909792;margin-top:3px}.v-arr{font-size:21px;color:#777d79}.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;background:#111312;border-top:1px solid #292c2a;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:50}.nav button{background:none;color:#8f9793;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}.nav button.active{color:var(--mint)}.nav span{font-size:20px}.tx{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.tx:last-child{border-bottom:0}.tx-ico{width:38px;height:38px;border-radius:12px;background:#111312;color:var(--mint);display:grid;place-items:center;font-weight:900}.tx-body{flex:1;min-width:0}.tx-body b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx-body small{color:var(--muted);font-size:10px}.notice{padding:12px;border-radius:12px;background:#332b18;color:#f4d47b;font-size:12px;margin:10px 0}.notice.ok{background:#123b2f;color:#9ce6cc}.notice.error{background:var(--maroon);color:#f28b8e}.pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#173d31;color:#9ce6cc;font-size:10px;font-weight:900}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:100}.modal.open{display:flex}.modalbox{background:#202321;width:100%;max-width:480px;margin:auto;border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow:auto;border:1px solid #3b403d}.modalbox.center{border-radius:24px;max-height:90vh}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.close{width:36px;height:36px;border-radius:50%;background:#303431;color:#fff}.banklist{display:grid;gap:6px;margin-top:10px}.bank{background:#191b1a;border:1px solid #343936;border-radius:14px;padding:13px;text-align:left;color:#fff}.bank:hover{border-color:var(--mint)}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.key{height:58px;border-radius:15px;background:#2b2f2d;color:#fff;font-size:20px;font-weight:800}.pin-dots{display:flex;justify-content:center;gap:12px;margin:15px 0}.pin-dot{width:12px;height:12px;border-radius:50%;background:#555}.pin-dot.on{background:var(--mint)}.camera{background:#07130e;border-radius:17px;overflow:hidden;position:relative;min-height:250px}.camera video{width:100%;height:270px;object-fit:cover}.face-guide{position:absolute;inset:28px 24%;border:2px solid var(--mint);border-radius:45%}.avatar{width:64px;height:64px;border-radius:50%;background:#173d31;border:2px solid var(--mint);display:grid;place-items:center;overflow:hidden;font-size:24px;font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.profile-head{display:flex;gap:13px;align-items:center}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#191b1a;border:1px solid var(--line);border-radius:15px;padding:12px;text-align:center}.stat b{display:block;font-size:15px}.stat small{color:var(--muted);font-size:10px}.wealthgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.wealthitem{background:#191b1a;border:1px solid var(--line);border-radius:17px;padding:15px;min-height:96px}.wealthitem b{display:block;margin-bottom:6px}.redbadge{background:#5a171b;color:#ff9a9f;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:900}.promo{background:linear-gradient(135deg,#087f5b,#0d4c39);border-radius:20px;padding:18px;margin-top:13px}.cardvisual{border-radius:22px;background:linear-gradient(135deg,#1a5b47,#08130f);border:1px solid var(--mint);padding:20px;min-height:205px;position:relative;overflow:hidden}.chip{width:42px;height:31px;border-radius:8px;background:linear-gradient(135deg,#d6c27b,#8f7831);margin-top:25px}.cardnum{font-family:monospace;font-size:18px;letter-spacing:2px;margin:22px 0}.search{background:#171918;border:1px solid var(--line);border-radius:13px;padding:13px;color:#fff;width:100%}.empty{text-align:center;padding:25px;color:var(--muted)}.auth{min-height:100vh;background:radial-gradient(circle at 50% 15%,#0b7c51 0,#07130e 68%);display:grid;place-items:center;padding:16px}.authbox{width:min(440px,100%);background:var(--panel);border-radius:24px;padding:24px;border:1px solid var(--line)}
.appback{display:flex;align-items:center;gap:8px;background:none;color:#fff;font-weight:850;font-size:14px}.appback .backicon{width:34px;height:34px;border-radius:50%;background:#242725;display:grid;place-items:center}.stepbar{display:flex;gap:6px;margin:4px 0 16px}.stepbar i{height:4px;flex:1;border-radius:4px;background:#3b403d}.stepbar i.on{background:var(--mint)}.confirmbox{text-align:center;padding:8px 0}.confirmicon{width:66px;height:66px;border-radius:50%;background:#123b2f;color:var(--mint);display:grid;place-items:center;font-size:32px;margin:4px auto 12px}.successbox{text-align:center;padding:12px 4px 4px}.successicon{width:78px;height:78px;border-radius:50%;background:var(--mint);color:#073628;display:grid;place-items:center;font-size:42px;font-weight:950;margin:4px auto 15px}.successamount{font-size:30px;font-weight:950;margin:8px 0}.summary{background:#191b1a;border:1px solid var(--line);border-radius:16px;padding:13px;margin:12px 0}.summaryrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px}.summaryrow span:first-child{color:var(--muted)}.processing{text-align:center;padding:22px}.spinner{width:44px;height:44px;border:4px solid #315046;border-top-color:var(--mint);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}.rewardclaim{border:1px solid #4c4a27;background:linear-gradient(135deg,#292718,#191b1a);border-radius:20px;padding:18px}.rewardamount{font-size:34px;font-weight:950;color:var(--yellow)}.disablednote{opacity:.55;font-size:11px;margin-top:7px}.modal{align-items:flex-end}.modalbox{box-shadow:0 -10px 35px rgba(0,0,0,.35)}
</style>
</head>
<body><div id="root"></div>
<script>
'use strict';
const API_BASE='https://veyra-api-etnq.onrender.com',TOKEN_KEY='veyra_access_token',REFRESH_KEY='veyra_refresh_token';
const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let state={user:null,tx:[],notifications:[],savings:[],cards:[],loans:[],tier:localStorage.getItem('veyra_tier')||'BASIC',photo:localStorage.getItem('veyra_photo')||''};
const root=document.getElementById('root');
function token(){return localStorage.getItem(TOKEN_KEY)||''} function setTokens(a,r){if(a)localStorage.setItem(TOKEN_KEY,a);if(r)localStorage.setItem(REFRESH_KEY,r)} function clearTokens(){localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(REFRESH_KEY)}
async function api(path,opt={},retry=true){const headers={'Content-Type':'application/json',...(opt.headers||{})};if(token())headers.Authorization='Bearer '+token();let r;try{r=await fetch(API_BASE+path,{...opt,headers})}catch(e){throw new Error('Veyra is temporarily offline or unreachable.')}if(r.status===401&&retry&&localStorage.getItem(REFRESH_KEY)&&!/^\/api\/(transfers|services|savings|loans|security)\//.test(path)){try{const rr=await fetch(API_BASE+'/api/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refreshToken:localStorage.getItem(REFRESH_KEY)})});if(rr.ok){const d=await rr.json();setTokens(d.accessToken,null);return api(path,opt,false)}}catch{}const e=new Error('Session expired. Please sign in again.');e.code='AUTH_EXPIRED';clearTokens();authView('login',e.message);throw e}let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.message||d.code||('Request failed ('+r.status+')'));e.httpStatus=r.status;e.apiCode=d.code;throw e}return d}
function authView(mode='login',notice=''){root.innerHTML=`<div class="auth"><div class="authbox"><div class="brand"><div class="brandmark">V</div><div>Veyra<div class="subtitle" style="margin:0">Secure internal wallet</div></div></div><h2>${mode==='login'?'Welcome back':'Create your account'}</h2><p class="subtitle">${mode==='login'?'Sign in to continue.':'Create your Veyra wallet account.'}</p><div id="authmsg">${notice?`<div class="notice error">${esc(notice)}</div>`:''}</div><form id="authform">${mode==='register'?`<div class="field"><label>Full name</label><input name="name" required placeholder="John Doe"></div><div class="field"><label>Username</label><input name="username" required placeholder="johndoe"></div><div class="field"><label>Phone number</label><input name="phone" inputmode="numeric" maxlength="11" required placeholder="08012345678"></div><div class="field"><label>Email</label><input name="email" type="email" required placeholder="john@example.com"></div><div class="field"><label>NIN</label><input name="nin" inputmode="numeric" maxlength="11" required placeholder="11 digits"></div><div class="field"><label>Password</label><input name="password" type="password" required minlength="8"></div><div class="field"><label>Transaction PIN</label><input name="pin" inputmode="numeric" maxlength="4" required placeholder="4 digits"></div>`:`<div class="field"><label>Username, email or phone</label><input name="identity" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div>`}<button class="btn primary">${mode==='login'?'Sign in':'Create account'}</button></form><div style="text-align:center;margin-top:15px;font-size:13px;color:var(--muted)">${mode==='login'?`New to Veyra? <b id="toReg" style="color:var(--mint);cursor:pointer">Create account</b>`:`Already registered? <b id="toLog" style="color:var(--mint);cursor:pointer">Sign in</b>`}</div></div></div>`;document.getElementById('authform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);mode==='register'?register(f):login(f)};document.getElementById('toReg')?.addEventListener('click',()=>authView('register'));document.getElementById('toLog')?.addEventListener('click',()=>authView('login'))}
async function register(f){const parts=String(f.get('name')).trim().split(/\s+/),phone=String(f.get('phone')).trim(),nin=String(f.get('nin')).trim(),pin=String(f.get('pin')).trim();if(!/^0\d{10}$/.test(phone))return msg('Phone number must be exactly 11 digits and start with 0.');if(!/^\d{11}$/.test(nin))return msg('NIN must be exactly 11 digits.');if(!/^\d{4}$/.test(pin))return msg('Transaction PIN must be exactly 4 digits.');try{const d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({firstName:parts[0]||'User',lastName:parts.slice(1).join(' ')||'User',username:String(f.get('username')).trim().toLowerCase(),phone,email:String(f.get('email')).trim().toLowerCase(),password:f.get('password'),pin,nin})},false);setTokens(d.accessToken,d.refreshToken);await loadAppData()}catch(e){msg(e.message)}}
async function login(f){try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({identifier:String(f.get('identity')).trim(),password:f.get('password')})},false);setTokens(d.accessToken,d.refreshToken);await loadAppData()}catch(e){msg(e.message)}}
function msg(t){const x=document.getElementById('authmsg');if(x)x.innerHTML=`<div class="notice error">${esc(t)}</div>`}
async function loadAppData(){try{const [m,t,n,sv,cd,lo]=await Promise.all([api('/api/me'),api('/api/transactions'),api('/api/notifications'),api('/api/savings'),api('/api/cards'),api('/api/loans')]);state.user={...m.user,name:`${m.user.firstName} ${m.user.lastName}`,balance:Number(m.user.balance||0),showBalance:state.user?.showBalance!==false};state.tx=t.transactions||[];state.notifications=n.notifications||[];state.savings=sv.savings||[];state.cards=cd.cards||[];state.loans=lo.loans||[];renderShell();go('home',null,true)}catch(e){if(e.code==='AUTH_EXPIRED'){return}toast(e.message||'Could not refresh Veyra data.','error')}}
function renderShell(){root.innerHTML=`<div class="app"><header class="topbar"><div class="brand"><div class="brandmark">V</div>Veyra</div><div class="top-actions"><button class="iconbtn" onclick="openSearch()">⌕</button><button class="iconbtn" onclick="openNotifications()">♢<span class="badge" id="notifBadge">${state.notifications.filter(x=>!x.read).length||''}</span></button><button class="iconbtn" onclick="go('profile')">●</button></div></header><div id="screens"></div><nav class="nav"><button data-nav="home" onclick="go('home',this)"><span>⌂</span>Home</button><button data-nav="rewards" onclick="go('rewards',this)"><span>♢</span>Rewards</button><button data-nav="wealth" onclick="go('wealth',this)"><span>⌁</span>Wealth</button><button data-nav="cards" onclick="go('cards',this)"><span>▭</span>Cards</button><button data-nav="profile" onclick="go('profile',this)"><span>●</span>Me</button></nav></div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"></div>`}
let navStack=['home'],navReady=false;function go(name,btn,silent=false){const c=document.getElementById('screens');if(!c)return;if(!silent&&navStack[navStack.length-1]!==name){navStack.push(name);history.pushState({veyra:true,screen:name},'',location.href.split('#')[0]+'#'+name)}if(!navReady){history.replaceState({veyra:true,screen:name,sentinel:true},'',location.href.split('#')[0]+'#'+name);navReady=true}document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));const b=btn||document.querySelector(`[data-nav="${name}"]`);if(b)b.classList.add('active');c.innerHTML=screen(name)}window.addEventListener('popstate',()=>{const m=document.getElementById('modal');if(m?.classList.contains('open')){closeModal();history.pushState({veyra:true,screen:navStack[navStack.length-1]},'',location.href.split('#')[0]+'#'+navStack[navStack.length-1]);return}if(navStack.length>1){navStack.pop();const n=navStack[navStack.length-1];go(n,null,true);history.pushState({veyra:true,screen:n},'',location.href.split('#')[0]+'#'+n)}else{history.pushState({veyra:true,screen:'home',sentinel:true},'',location.href.split('#')[0]+'#home')}});
function screenHead(title,sub='',back='home'){return `<div class="screenhead"><button class="appback" onclick="goBack()"><span class="backicon">‹</span><span>Back</span></button><div style="flex:1;text-align:center"><b>${esc(title)}</b>${sub?`<div class="muted" style="font-size:10px">${esc(sub)}</div>`:''}</div><div style="width:70px"></div></div>`}function goBack(){if(navStack.length>1){history.back()}else{go('home')}}
function screen(name){const u=state.user||{},bal=u.showBalance?money(u.balance):'••••••••';if(name==='home')return `<div class="screen active"><div class="hero"><div class="eyebrow">Available Balance</div><div class="balance">${bal}</div><div class="muted" style="color:#164a39">Account ${esc(u.accountNumber)} · ${esc(state.tier)} Tier</div><div class="quick"><button class="btn" style="background:#fff;color:#073f29" onclick="go('send')">Transfer</button><button class="btn" style="background:#164f3a;color:#fff" onclick="serviceFlow('Airtime')">Airtime</button><button class="btn" style="background:#164f3a;color:#fff" onclick="serviceFlow('Data')">Data</button></div></div><div class="grid4"><div class="service-item" onclick="go('send')"><div class="service-ico">↗</div><span>Transfer</span></div><div class="service-item" onclick="serviceFlow('Airtime')"><div class="service-ico">☎</div><span>Airtime</span></div><div class="service-item" onclick="serviceFlow('Data')"><div class="service-ico">◉</div><span>Data</span></div><div class="service-item" onclick="serviceFlow('Betting')"><div class="service-ico">♢</div><span>Betting</span></div><div class="service-item" onclick="serviceFlow('TV')"><div class="service-ico">▣</div><span>TV Bill</span></div><div class="service-item" onclick="serviceFlow('Electricity')"><div class="service-ico">ϟ</div><span>Electricity</span></div><div class="service-item" onclick="go('loans')"><div class="service-ico">₦</div><span>Loans</span></div><div class="service-item" onclick="go('wealth')"><div class="service-ico">⌁</div><span>Wealth</span></div></div><div class="v-list"><button class="v-row" onclick="go('loans')"><div class="ri">♧</div><div class="rb"><b>My Loan</b><div class="rs">Request and manage internal credit</div></div><span class="v-arr">›</span></button><button class="v-row" onclick="go('cards')"><div class="ri">▭</div><div class="rb"><b>Virtual Cards</b><div class="rs">Manage secure online payment cards</div></div><span class="v-arr">›</span></button></div><div class="card"><div class="row"><h3>Recent transactions</h3><span onclick="go('history')" style="color:var(--mint);font-size:12px;font-weight:800;cursor:pointer">See all</span></div>${state.tx.slice(-4).reverse().map(renderTx).join('')||'<div class="empty">No transactions yet.</div>'}</div></div>`;
if(name==='send')return `<div class="screen active">${screenHead('Transfer','Send money securely.')}<div style="margin-top:10px"><p class="subtitle">Send money inside Veyra, or start an external bank transfer.</p><div class="card"><div class="row"><b>Veyra account</b><span class="pill">Instant</span></div><div class="field"><label>Account / phone / username</label><input id="recipient" placeholder="Search Veyra account" oninput="lookup(this.value)"></div><div id="lookup"></div><div class="field"><label>Amount</label><input id="amount" inputmode="decimal" type="number" min="1" placeholder="₦0.00"></div><div class="field"><label>Narration</label><input id="note" placeholder="Optional"></div><button class="btn primary" onclick="startInternalTransfer()">Continue</button></div></div><div class="card" onclick="openBankPicker()" style="cursor:pointer"><div class="row"><div><b>Other Nigerian banks</b><div class="subtitle" style="margin:3px 0 0">Select bank and verify account</div></div><span class="v-arr">›</span></div></div></div>`;
if(name==='rewards')return `<div class="screen active">${screenHead('Rewards','Invite friends and claim eligible rewards.')}<div class="hero"><div class="eyebrow">Referral potential</div><div class="balance">${state.tier==='PREMIUM'?'₦5,000,000,000':'₦700,000,000'}</div><div class="muted">${state.tier==='PREMIUM'?'Premium reward ceiling':'Basic reward ceiling'}</div></div><div class="card"><h3>Invite someone</h3><p class="subtitle">Share your referral code. Rewards are only credited when eligibility is confirmed.</p><div class="summary"><div class="summaryrow"><span>Your code</span><b>${esc(state.user?.username||'VEYRA')}</b></div></div><button class="btn yellow" onclick="copyReferral()">Copy referral code</button></div><div class="card"><h3>How rewards work</h3><div class="v-list"><div class="v-row"><div class="ri">1</div><div class="rb"><b>Share</b><div class="rs">Invite a friend.</div></div></div><div class="v-row"><div class="ri">2</div><div class="rb"><b>Friend transacts</b><div class="rs">Eligible activity must be completed.</div></div></div><div class="v-row"><div class="ri">3</div><div class="rb"><b>Receive reward</b><div class="rs">The reward appears when the backend confirms eligibility.</div></div></div></div></div><div class="rewardclaim"><div class="eyebrow">Random reward drop</div><div id="rewardDrop" style="margin-top:8px"></div><button class="btn primary" style="margin-top:12px" onclick="claimReward()">Check for reward</button><div class="disablednote">Up to 3 checks per day. This UI does not fake a wallet credit without a backend reward endpoint.</div></div></div>`;

''}>Premium · ₦40bn daily outgoing</option></select></div></div></div>`;return ''}
function renderTx(t){const credit=t.receiverId===state.user?.id;return `<div class="tx"><div class="tx-ico">${credit?'↓':'↑'}</div><div class="tx-body"><b>${credit?'From '+esc(t.sender?.firstName||'User'):'To '+esc(t.recipientName||'Recipient')}</b><small>${new Date(t.createdAt).toLocaleString()} ${t.reference?'· '+esc(t.reference):''}</small></div><div style="font-weight:900;color:${credit?'var(--mint)':'inherit'}">${credit?'+':'-'}${money(t.amount)}</div></div>`}
function openModal(html,center=false){const m=document.getElementById('modal');m.innerHTML=`<div class="modalbox ${center?'center':''}">${html}</div>`;m.classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('modal').innerHTML=''}
let lookupTimer;async function lookup(q){clearTimeout(lookupTimer);const box=document.getElementById('lookup');if(!box)return;if(q.trim().length<3){box.innerHTML='';return}lookupTimer=setTimeout(async()=>{try{const d=await api('/api/users/lookup?q='+encodeURIComponent(q.trim()));box.innerHTML=`<div class="notice ok"><b>Recipient found:</b> ${esc(d.recipient.firstName)} ${esc(d.recipient.lastName)} · @${esc(d.recipient.username)} · ${esc(d.recipient.accountNumber)}</div>`;box.dataset.id=d.recipient.id}catch{box.innerHTML='<div class="notice error">No active Veyra account found.</div>';box.dataset.id=''}},350)}
async function startInternalTransfer(){const r=document.getElementById('recipient')?.value.trim(),amount=Number(document.getElementById('amount')?.value),note=document.getElementById('note')?.value.trim(),id=document.getElementById('lookup')?.dataset.id;if(!r||!amount)return toast('Enter recipient and amount.','error');let recipientId=id;let recipient;if(!recipientId){try{const d=await api('/api/users/lookup?q='+encodeURIComponent(r));recipientId=d.recipient.id;recipient=d.recipient}catch{return toast('Recipient could not be verified.','error')}}else{try{const d=await api('/api/users/lookup?q='+encodeURIComponent(r));recipient=d.recipient}catch{return toast('Recipient could not be verified.','error')}}openTransferConfirm(recipient,amount,note)}function openTransferConfirm(recipient,amount,note){window._transfer={recipient,amount,note};openModal(`<div class="modalhead"><div><b>Step 1 of 3</b></div><button class="close" onclick="closeModal()">×</button></div><div class="stepbar"><i class="on"></i><i></i><i></i><i></i></div><div class="confirmbox"><div class="confirmicon">✓</div><h2 style="margin:0">Confirm this account</h2><p class="subtitle">Make sure the recipient details are correct before proceeding.</p></div><div class="summary"><div class="summaryrow"><span>Name</span><b>${esc(recipient.firstName)} ${esc(recipient.lastName)}</b></div><div class="summaryrow"><span>Username</span><b>@${esc(recipient.username)}</b></div><div class="summaryrow"><span>Account</span><b>${esc(recipient.accountNumber)}</b></div><div class="summaryrow"><span>Amount</span><b>${money(amount)}</b></div></div><button class="btn primary" onclick="openPaymentConfirm()">Proceed</button>`,true)}function openPaymentConfirm(){const t=window._transfer;if(!t)return;openModal(`<div class="modalhead"><div><b>Step 2 of 3</b></div><button class="close" onclick="closeModal()">×</button></div><div class="stepbar"><i class="on"></i><i class="on"></i><i></i><i></i></div><div class="confirmbox"><div class="confirmicon">₦</div><h2 style="margin:0">Confirm payment</h2><p class="subtitle">You are about to send this amount from your Veyra wallet.</p></div><div class="summary"><div class="summaryrow"><span>Recipient</span><b>${esc(t.recipient.firstName)} ${esc(t.recipient.lastName)}</b></div><div class="summaryrow"><span>Account</span><b>${esc(t.recipient.accountNumber)}</b></div><div class="summaryrow"><span>Amount</span><b>${money(t.amount)}</b></div>${t.note?`<div class="summaryrow"><span>Narration</span><b>${esc(t.note)}</b></div>`:''}</div><button class="btn primary" onclick="openPinForTransfer()">Confirm to make payment</button>`,true)}function openPinForTransfer(){const t=window._transfer;if(!t)return;openPin('Step 3 of 3 · Enter PIN',async pin=>{openProcessing('Processing transfer…');try{await api('/api/transfers/internal',{method:'POST',headers:{'Idempotency-Key':'VEYRA-'+crypto.randomUUID()},body:JSON.stringify({recipientId:t.recipient.id,amount:t.amount,narration:t.note,pin})});await loadAppData();openSuccess('Transfer successful',`₦${Number(t.amount).toLocaleString('en-NG',{minimumFractionDigits:2})} has been sent to ${t.recipient.firstName} ${t.recipient.lastName}.`,t.amount,state.user?.balance)}catch(e){openErrorLayer(e.message||'Transfer failed.')}})}
function openPin(title,done){let value='';openModal(`<div class="modalhead"><div><h2 style="margin:0">${esc(title)}</h2><div class="subtitle" style="margin:4px 0 0">Enter your 4-digit transaction PIN</div></div><button class="close" onclick="closeModal()">×</button></div><div class="pin-dots" id="dots"><i class="pin-dot"></i><i class="pin-dot"></i><i class="pin-dot"></i><i class="pin-dot"></i></div><div class="keypad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button class="key" onclick="pinKey('${k}')">${k}</button>`).join('')}</div>` ,true);window._pin={value:'',done}}
function pinKey(k){if(!window._pin)return;let p=window._pin;if(k==='⌫')p.value=p.value.slice(0,-1);else if(k==='✓'){if(p.value.length!==4)return toast('PIN must be 4 digits.','error');const d=p.done;window._pin=null;d(p.value);return}else if(p.value.length<4&&/^\d$/.test(k))p.value+=k;document.querySelectorAll('.pin-dot').forEach((x,i)=>x.classList.toggle('on',i<p.value.length))}
function openProcessing(text){openModal(`<div class="processing"><div class="spinner"></div><h2>${esc(text)}</h2><p class="subtitle">Please wait. Do not close Veyra.</p></div>`,true)}function openSuccess(title,message,amount,balance){openModal(`<div class="successbox"><div class="successicon">✓</div><h2 style="margin:0">${esc(title)}</h2><p class="subtitle">${esc(message)}</p>${amount?`<div class="successamount">${money(amount)}</div>`:''}<div class="summary"><div class="summaryrow"><span>New wallet balance</span><b>${state.user?.showBalance===false?'••••••••':money(balance||state.user?.balance||0)}</b></div><div class="summaryrow"><span>Status</span><b style="color:var(--mint)">Successful</b></div></div><button class="btn primary" onclick="closeModal()">Done</button></div>`,true)}function openErrorLayer(message){openModal(`<div class="confirmbox"><div class="confirmicon" style="background:var(--maroon);color:#f28b8e">!</div><h2 style="margin:0">Transaction not completed</h2><p class="subtitle">${esc(message)}</p><button class="btn dark" onclick="closeModal()">Try again</button></div>`,true)}
function serviceFlow(type){const configs={Airtime:{label:'Airtime',target:'Phone number',placeholder:'08012345678',kind:'AIRTIME',quick:[500,1000,2000,5000]},Data:{label:'Data',target:'Phone number',placeholder:'08012345678',kind:'DATA',quick:[500,1000,1500,3000]},Betting:{label:'Betting',target:'Customer ID',placeholder:'Enter customer ID',kind:'INTERNET',quick:[1000,2000,5000]},TV:{label:'TV Bill',target:'Smartcard number',placeholder:'Enter smartcard number',kind:'TV',quick:[2000,5000,10000]},Electricity:{label:'Electricity',target:'Meter number',placeholder:'Enter meter number',kind:'ELECTRICITY',quick:[2000,5000,10000]}}[type];if(!configs)return;openModal(`<div class="modalhead"><div><h2 style="margin:0">${configs.label}</h2><div class="subtitle" style="margin:4px 0 0">${type==='Data'?'Choose a data package and continue.':'Complete your payment details.'}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>${configs.target}</label><input id="svcTarget" inputmode="tel" placeholder="${configs.placeholder}"></div>${type==='Data'?`<div class="field"><label>Data package</label><select id="dataPack"><option value="500">1.5GB Daily · ₦500</option><option value="1000">3GB Weekly · ₦1,000</option><option value="1500">6GB Monthly · ₦1,500</option><option value="3000">12GB Monthly · ₦3,000</option><option value="5000">Unlimited-style package · ₦5,000</option></select></div>`:`<div class="field"><label>Amount</label><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:7px">${configs.quick.map(x=>`<button class="btn soft" onclick="document.getElementById('svcAmount').value=${x}">₦${x.toLocaleString()}</button>`).join('')}</div><input id="svcAmount" type="number" min="1" placeholder="Custom amount" style="margin-top:8px"></div>`}<button class="btn primary" onclick="continueService('${configs.label}','${configs.kind}')">Continue</button>` ,true)}
function continueService(type,kind){const target=document.getElementById('svcTarget')?.value.trim(),amount=Number(type==='Data'?document.getElementById('dataPack')?.value:document.getElementById('svcAmount')?.value);if(!target||!amount)return toast('Complete the details first.','error');window._service={type,kind,target,amount};openModal(`<div class="modalhead"><b>Confirm ${esc(type)}</b><button class="close" onclick="closeModal()">×</button></div><div class="stepbar"><i class="on"></i><i class="on"></i><i></i></div><div class="summary"><div class="summaryrow"><span>Service</span><b>${esc(type)}</b></div><div class="summaryrow"><span>Target</span><b>${esc(target)}</b></div><div class="summaryrow"><span>Amount</span><b>${money(amount)}</b></div></div><button class="btn primary" onclick="openServicePin()">Proceed to payment</button>`,true)}function openServicePin(){const s=window._service;if(!s)return;openPin('Enter PIN · '+s.type,async pin=>{openProcessing('Processing '+s.type+' payment…');try{await api('/api/services/payment',{method:'POST',body:JSON.stringify({type:s.kind,target:s.target,amount:s.amount,pin})});await loadAppData();openSuccess(s.type+' payment successful',`Your ${s.type.toLowerCase()} payment was completed successfully.`,s.amount,state.user?.balance)}catch(e){openErrorLayer(e.message||s.type+' payment failed.')}})}
const BANKS=['Access Bank','ALAT by Wema','Citibank Nigeria','Ecobank Nigeria','FCMB','Fidelity Bank','First Bank of Nigeria','Globus Bank','GTBank','Heritage Bank','Jaiz Bank','Keystone Bank','Kuda Bank','Moniepoint MFB','Opay','PalmPay','Parallex Bank','Polaris Bank','PremiumTrust Bank','Providus Bank','Stanbic IBTC','Sterling Bank','UBA','Union Bank','Unity Bank','Wema Bank','Zenith Bank'];
function openBankPicker(){openModal(`<div class="modalhead"><div><h2 style="margin:0">Select Bank</h2><div class="subtitle" style="margin:4px 0 0">Choose a Nigerian bank</div></div><button class="close" onclick="closeModal()">×</button></div><input class="search" id="bankSearch" placeholder="Search Bank Name" oninput="filterBanks(this.value)"><h4>Frequently Used</h4><div class="banklist" id="banklist">${BANKS.map(b=>`<button class="bank" onclick="bankChosen('${esc(b)}')">${esc(b)}</button>`).join('')}</div>` ,true)}
function filterBanks(q){const list=document.getElementById('banklist');if(!list)return;list.innerHTML=BANKS.filter(b=>b.toLowerCase().includes(q.toLowerCase())).map(b=>`<button class="bank" onclick="bankChosen('${esc(b)}')">${esc(b)}</button>`).join('')||'<div class="empty">No bank found.</div>'}
function bankChosen(bank){openModal(`<div class="modalhead"><h2 style="margin:0">${esc(bank)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>10-digit account number</label><input id="bankAcc" inputmode="numeric" maxlength="10" placeholder="0123456789"></div><button class="btn primary" onclick="verifyBank('${esc(bank)}')">Verify account</button>` ,true)}
async function verifyBank(bank){const acc=document.getElementById('bankAcc')?.value.trim();if(!/^\d{10}$/.test(acc))return toast('Account number must be 10 digits.','error');try{const d=await api('/api/users/lookup?q='+encodeURIComponent(acc));openModal(`<div class="modalhead"><h2 style="margin:0">Transfer to</h2><button class="close" onclick="closeModal()">×</button></div><div class="notice ok">Veyra account found: <b>${esc(d.recipient.firstName)} ${esc(d.recipient.lastName)}</b><br>Account ${esc(d.recipient.accountNumber)} · ${esc(bank)}</div><div class="field"><label>Amount</label><input id="bankAmt" type="number" min="1" placeholder="₦0.00"></div><button class="btn primary" onclick="internalBankRecipient('${esc(d.recipient.id)}')">Continue</button>`,true)}catch{openModal(`<div class="modalhead"><h2 style="margin:0">External bank transfer</h2><button class="close" onclick="closeModal()">×</button></div><div class="notice">${esc(bank)} account ${esc(acc)} could not be matched to a Veyra account.</div><div class="notice error">Live external bank transfer is not connected because Veyra does not currently have a NIBSS/bank-transfer provider. This screen will not falsely claim that money left the app.</div><button class="btn dark" onclick="closeModal()">Close</button>`,true)}}
function internalBankRecipient(id){const amount=Number(document.getElementById('bankAmt')?.value);if(!amount)return toast('Enter amount.','error');openPin('Confirm transfer',async pin=>{try{await api('/api/transfers/internal',{method:'POST',headers:{'Idempotency-Key':'VEYRA-'+crypto.randomUUID()},body:JSON.stringify({recipientId:id,amount,pin})});closeModal();await loadAppData();toast('Transfer successful.','ok')}catch(e){toast(e.message,'error')}})}
async function depositSavings(){const amount=Number(document.getElementById('saveAmt')?.value);if(!amount)return toast('Enter an amount.','error');let id=state.savings[0]?.id;try{if(!id){const d=await api('/api/savings',{method:'POST',body:JSON.stringify({name:'Main Savings',type:'SAFEBOX'})});id=d.savings.id}openPin('Enter PIN · Savings deposit',async pin=>{openProcessing('Processing savings deposit…');try{await api('/api/savings/'+id+'/deposit',{method:'POST',body:JSON.stringify({amount,pin})});await loadAppData();openSuccess('Savings deposit successful',`Your money was moved into savings.`,amount,state.user?.balance)}catch(e){openErrorLayer(e.message||'Savings deposit failed.')}})}catch(e){toast(e.message,'error')}}
function openSavings(type){const existing=state.savings.find(x=>String(x.type||'').toUpperCase().includes(type.replace(/\s|&/g,'').toUpperCase()))||state.savings[0];openModal(`<div class="modalhead"><div><b>${esc(type)}</b><div class="subtitle" style="margin:4px 0 0">Wealth option</div></div><button class="close" onclick="closeModal()">×</button></div><div class="summary"><div class="summaryrow"><span>Current balance</span><b>${money(existing?.balance||0)}</b></div><div class="summaryrow"><span>Product</span><b>${esc(type)}</b></div></div><p class="subtitle">Use the controls below to move money into or out of your available Veyra savings account.</p><div class="field"><label>Amount</label><input id="wealthAmt" type="number" min="1" placeholder="₦0.00"></div><div class="row"><button class="btn primary" onclick="wealthDeposit()">Deposit</button><button class="btn soft" onclick="wealthWithdraw()">Withdraw</button></div></div>`,true)}async function wealthDeposit(){const amount=Number(document.getElementById('wealthAmt')?.value);if(!amount)return toast('Enter an amount.','error');document.getElementById('saveAmt')?.setAttribute('value',String(amount));closeModal();const input=document.getElementById('saveAmt');if(input)input.value=amount;await depositSavings()}async function wealthWithdraw(){const amount=Number(document.getElementById('wealthAmt')?.value);if(!amount)return toast('Enter an amount.','error');const id=state.savings[0]?.id;if(!id)return toast('No savings account exists yet.','error');openPin('Enter PIN · Savings withdrawal',async pin=>{openProcessing('Processing savings withdrawal…');try{await api('/api/savings/'+id+'/withdraw',{method:'POST',body:JSON.stringify({amount,pin})});await loadAppData();openSuccess('Savings withdrawal successful','Money was withdrawn from savings.',amount,state.user?.balance)}catch(e){openErrorLayer(e.message||'Savings withdrawal failed.')}})}
async function createCard(){try{await api('/api/cards',{method:'POST',body:'{}'});await loadAppData();go('cards');toast('Virtual card created.','ok')}catch(e){toast(e.message,'error')}}function deleteCard(id){openModal(`<div class="modalhead"><b>Remove virtual card?</b><button class="close" onclick="closeModal()">×</button></div><p class="subtitle">This will remove the selected virtual card from your Veyra account.</p><button class="btn danger" onclick="confirmDeleteCard('${esc(id)}')">Remove card</button>`,true)}async function confirmDeleteCard(id){openProcessing('Removing card…');try{await api('/api/cards/'+id,{method:'DELETE'});await loadAppData();openSuccess('Card removed','The virtual card was removed successfully.');go('cards')}catch(e){openErrorLayer(e.message)}}
async function requestLoan(){const amount=Number(document.getElementById('loanAmt')?.value),durationMonths=Number(document.getElementById('loanDuration')?.value||12);if(!amount)return toast('Enter loan amount.','error');openModal(`<div class="modalhead"><b>Confirm loan request</b><button class="close" onclick="closeModal()">×</button></div><div class="summary"><div class="summaryrow"><span>Requested</span><b>${money(amount)}</b></div><div class="summaryrow"><span>Duration</span><b>${durationMonths} months</b></div></div><p class="notice">Approval is controlled by the Veyra backend. A request is not a guarantee of approval.</p><button class="btn primary" onclick="submitLoanRequest(${amount},${durationMonths})">Submit request</button>`,true)}async function submitLoanRequest(amount,durationMonths){openProcessing('Submitting loan request…');try{await api('/api/loans',{method:'POST',body:JSON.stringify({amount,durationMonths})});await loadAppData();openSuccess('Loan request submitted','Your request has been recorded. Approval depends on the backend.');go('loans')}catch(e){openErrorLayer(e.message||'Loan request failed.')}}function repayLoan(id,total){openModal(`<div class="modalhead"><b>Repay loan</b><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Repayment amount</label><input id="repayAmt" type="number" min="1" value="${Number(total)||0}" placeholder="₦0.00"></div><button class="btn primary" onclick="confirmLoanRepayment('${esc(id)}')">Continue</button>`,true)}function confirmLoanRepayment(id){const amount=Number(document.getElementById('repayAmt')?.value);if(!amount)return toast('Enter repayment amount.','error');openPin('Enter PIN · Loan repayment',async pin=>{openProcessing('Processing loan repayment…');try{await api('/api/loans/'+id+'/repay',{method:'POST',body:JSON.stringify({amount,pin})});await loadAppData();openSuccess('Loan repayment successful','Your repayment has been recorded.',amount,state.user?.balance);go('loans')}catch(e){openErrorLayer(e.message||'Loan repayment failed.')}})}
function openSearch(){openModal(`<div class="modalhead"><h2 style="margin:0">Search Veyra account</h2><button class="close" onclick="closeModal()">×</button></div><input class="search" id="searchQ" placeholder="Account number, phone or username"><button class="btn primary" style="margin-top:10px" onclick="searchUser()">Search</button><div id="searchResult"></div>`,true)}async function searchUser(){const q=document.getElementById('searchQ')?.value.trim();if(!q)return;try{const d=await api('/api/users/lookup?q='+encodeURIComponent(q));document.getElementById('searchResult').innerHTML=`<div class="notice ok">${esc(d.recipient.firstName)} ${esc(d.recipient.lastName)}<br>@${esc(d.recipient.username)} · ${esc(d.recipient.accountNumber)}</div>`}catch{document.getElementById('searchResult').innerHTML='<div class="notice error">No active Veyra account found.</div>'}}
function openNotifications(){openModal(`<div class="modalhead"><h2 style="margin:0">Notifications</h2><button class="close" onclick="closeModal()">×</button></div>${state.notifications.map(n=>`<div class="card" style="margin-top:8px"><b>${esc(n.title)}</b><p class="subtitle" style="margin:5px 0">${esc(n.message)}</p><small class="muted">${n.createdAt?new Date(n.createdAt).toLocaleString():''}</small></div>`).join('')||'<div class="empty">No notifications.</div>'}`,true)}
function toggleBalance(){state.user.showBalance=!state.user.showBalance;go('settings')}
function setTier(t){state.tier=t;localStorage.setItem('veyra_tier',t);go('settings');toast('Tier display updated. Backend enforcement still requires a persistent tier field.','ok')}
function profilePhoto(){openModal(`<div class="modalhead"><h2 style="margin:0">Profile photo</h2><button class="close" onclick="closeModal()">×</button></div><input id="photoInput" type="file" accept="image/*" style="width:100%;color:#fff"><button class="btn primary" style="margin-top:12px" onclick="savePhoto()">Save photo</button><button class="btn danger" style="margin-top:8px" onclick="localStorage.removeItem('veyra_photo');state.photo='';closeModal();go('profile')">Remove photo</button>`,true)}function savePhoto(){const f=document.getElementById('photoInput')?.files[0];if(!f)return toast('Choose a photo first.','error');const r=new FileReader();r.onload=()=>{state.photo=r.result;localStorage.setItem('veyra_photo',r.result);closeModal();go('profile');toast('Profile photo saved on this device.','ok')};r.readAsDataURL(f)}
async function deviceBiometric(){if(!window.PublicKeyCredential)return toast('Device biometric/WebAuthn is not available in this browser.','error');try{const ok=await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();if(!ok)return toast('No supported fingerprint/device biometric authenticator was detected.','error');const challenge=crypto.getRandomValues(new Uint8Array(32));const cred=await navigator.credentials.create({publicKey:{challenge,rp:{name:'Veyra'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:state.user?.username||'veyra-user',displayName:state.user?.name||'Veyra User'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});if(cred)toast('Device biometric enrollment completed on this device.','ok')}catch(e){toast('Biometric setup was cancelled or unavailable.','error')}}
function templateFromVideo(video){const c=document.createElement('canvas');c.width=32;c.height=32;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(video,0,0,32,32);const p=x.getImageData(0,0,32,32).data,v=[];for(let i=0;i<p.length;i+=4)v.push((.299*p[i]+.587*p[i+1]+.114*p[i+2])/255);const m=v.reduce((a,b)=>a+b,0)/v.length,s=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/v.length)||1;return v.map(z=>(z-m)/s)}
async function enrollFace(){openModal(`<div class="modalhead"><div><h2 style="margin:0">Face verification</h2><div class="subtitle" style="margin:4px 0 0">Center your face inside the guide.</div></div><button class="close" onclick="closeModal()">×</button></div><div class="camera"><video id="fcam" autoplay muted playsinline></video><div class="face-guide"></div></div><button class="btn primary" style="margin-top:12px" id="cap">Capture & save</button>`,true);let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});const v=document.getElementById('fcam');v.srcObject=stream;await v.play()}catch{closeModal();return toast('Camera access denied.','error')}document.getElementById('cap').onclick=async()=>{const template=templateFromVideo(document.getElementById('fcam'));stream.getTracks().forEach(t=>t.stop());try{await api('/api/security/face/enroll',{method:'POST',body:JSON.stringify({template})});closeModal();toast('Face template enrolled. Note: this is template storage, not full biometric recognition.','ok')}catch(e){toast(e.message,'error')}}}
async function changePin(){openModal(`<div class="modalhead"><h2 style="margin:0">Change PIN</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Current PIN</label><input id="oldPin" type="password" inputmode="numeric" maxlength="4"></div><div class="field"><label>New PIN</label><input id="newPin" type="password" inputmode="numeric" maxlength="4"></div><button class="btn primary" onclick="submitPinChange()">Update PIN</button>`,true)}async function submitPinChange(){const currentPin=document.getElementById('oldPin')?.value,newPin=document.getElementById('newPin')?.value;if(!/^\d{4}$/.test(newPin))return toast('New PIN must be 4 digits.','error');try{await api('/api/security/pin',{method:'POST',body:JSON.stringify({currentPin,newPin})});closeModal();toast('PIN updated successfully.','ok')}catch(e){toast(e.message,'error')}}
async function changePassword(){openModal(`<div class="modalhead"><h2 style="margin:0">Change password</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Current password</label><input id="oldPass" type="password"></div><div class="field"><label>New password</label><input id="newPass" type="password" minlength="8"></div><button class="btn primary" onclick="submitPasswordChange()">Update password</button>`,true)}async function submitPasswordChange(){const currentPassword=document.getElementById('oldPass')?.value,newPassword=document.getElementById('newPass')?.value;if(!newPassword||newPassword.length<8)return toast('Password must be at least 8 characters.','error');try{await api('/api/security/password',{method:'POST',body:JSON.stringify({currentPassword,newPassword})});closeModal();toast('Password updated successfully.','ok')}catch(e){toast(e.message,'error')}}
function claimReward(){const key='veyra_reward_day',today=new Date().toISOString().slice(0,10),data=JSON.parse(localStorage.getItem(key)||'{}');if(data.day!==today){data.day=today;data.count=0;data.claimed=[]}if(data.count>=3)return toast('Today’s three reward checks have already been used.','error');data.count++;const basic=[700000000,120000000,350000000,50000000],premium=[5000000000,2000000000,350000000,1000000000];const pool=state.tier==='PREMIUM'?premium:basic;const amount=pool[Math.floor(Math.random()*pool.length)];data.claimed.push(amount);localStorage.setItem(key,JSON.stringify(data));const box=document.getElementById('rewardDrop');if(box)box.innerHTML=`<div class="rewardamount">${money(amount)}</div><div class="subtitle">Reward opportunity found. ${3-data.count} checks remaining today.</div><div class="notice">This amount is an eligibility/reward display only. It is not added to wallet balance because the current backend has no reward-credit endpoint.</div>`}
function copyReferral(){navigator.clipboard?.writeText(state.user?.username||'VEYRA').then(()=>toast('Referral code copied.','ok')).catch(()=>toast('Referral code: '+(state.user?.username||'VEYRA'),'ok'))}
function toast(text,type='ok'){let x=document.getElementById('veyraToast');if(!x){x=document.createElement('div');x.id='veyraToast';document.body.appendChild(x)}x.className='notice '+(type==='error'?'error':'ok');x.textContent=text;x.style.position='fixed';x.style.left='16px';x.style.right='16px';x.style.bottom='95px';x.style.zIndex='300';x.style.margin='0';x.style.textAlign='center';clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>x.remove(),2800)}
function logout(){clearTokens();state.user=null;authView('login')}
if(token())loadAppData();else authView('login');
</script>
</body></html>
