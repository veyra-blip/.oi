<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPay - Simulated Fintech</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #121212; color: #e0e0e0; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-0 md:p-4">

    <!-- App Container -->
    <div id="app" class="w-full max-w-md bg-[#181818] md:rounded-3xl shadow-2xl overflow-hidden min-h-screen md:min-h-[850px] flex flex-col relative border border-[#262626]">
        
        <!-- Top Status Bar -->
        <div class="bg-[#10b981]/20 border-b border-[#10b981]/30 px-4 py-1.5 text-center text-[11px] font-semibold text-[#10b981] flex items-center justify-center gap-2">
            <span class="w-2 h-2 rounded-full bg-[#10b981] animate-pulse"></span>
            OPay Internal Virtual Simulation (₦500M Starting Balance)[span_12](start_span)[span_12](end_span)
        </div>

        <!-- Dynamic Screen Content Area -->
        <div id="screen-container" class="flex-1 flex flex-col overflow-y-auto pb-20"></div>

        <!-- Modal Container for Drawers & Loaders -->
        <div id="modal-container"></div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const DB_KEYS = {
            USERS: 'opay_sim_users_v4',
            SESSION: 'opay_sim_session_v4',
            PENDING_REG: 'opay_sim_pending_reg_v4'
        };

        const POPULAR_BANKS = [
            "OPay Simulation Network",
            "Moniepoint Microfinance Bank",
            "Access Bank",
            "Guaranty Trust Bank (GTB)",
            "First Bank of Nigeria",
            "United Bank for Africa (UBA)",
            "Zenith Bank",
            "Kuda Bank",
            "Fidelity Bank",
            "Polaris Bank"
        ];

        function getStoredUsers() {
            const data = localStorage.getItem(DB_KEYS.USERS);
            return data ? JSON.parse(data) : {};
        }

        function saveStoredUsers(users) {
            localStorage.setItem(DB_KEYS.USERS, JSON.stringify(users));
        }

        function getActiveUserPhone() {
            return localStorage.getItem(DB_KEYS.SESSION);
        }

        function setActiveUserPhone(phone) {
            if (phone) localStorage.setItem(DB_KEYS.SESSION, phone);
            else localStorage.removeItem(DB_KEYS.SESSION);
        }

        function generateAccountNumber() {
            return '81' + Math.floor(10000000 + Math.random() * 90000000);
        }

        function renderApp() {
            const currentUserPhone = getActiveUserPhone();
            const pendingReg = localStorage.getItem(DB_KEYS.PENDING_REG);
            const container = document.getElementById('screen-container');
            document.getElementById('modal-container').innerHTML = '';
            
            if (pendingReg) {
                container.innerHTML = renderSetupPinScreen(pendingReg);
                return;
            }

            if (!currentUserPhone) {
                if (window.location.hash === '#register') {
                    container.innerHTML = renderRegisterScreen();
                } else {
                    container.innerHTML = renderLoginScreen();
                }
            } else {
                const users = getStoredUsers();
                const user = users[currentUserPhone];
                if (!user) {
                    setActiveUserPhone(null);
                    window.location.hash = '';
                    renderApp();
                    return;
                }

                const hash = window.location.hash;
                if (hash === '#send-opay') {
                    container.innerHTML = renderSendOpayScreen(user);
                } else if (hash === '#send-bank') {
                    container.innerHTML = renderSendBankScreen(user);
                } else if (hash === '#history') {
                    container.innerHTML = renderHistoryScreen(user);
                } else if (hash === '#notifications') {
                    container.innerHTML = renderNotificationsScreen(user);
                } else if (hash === '#all-services') {
                    container.innerHTML = renderAllServicesScreen(user);
                } else if (hash === '#profile') {
                    container.innerHTML = renderProfileScreen(user);
                } else {
                    container.innerHTML = renderDashboardScreen(user);
                }
            }
        }

        window.addEventListener('hashchange', renderApp);
        window.addEventListener('load', renderApp);

        // --- SCREENS ---

        function renderLoginScreen() {
            return `
                <div class="flex-1 flex flex-col p-6 justify-center">
                    <div class="text-center mb-8">
                        <div class="w-16 h-16 rounded-2xl bg-[#10b981] text-black font-extrabold text-3xl flex items-center justify-center mx-auto mb-3 shadow-lg">₦</div>
                        <h1 class="text-2xl font-bold text-white">OPay Simulation</h1>
                        <p class="text-xs text-slate-400 mt-1">Internal Network & Virtual Funds</p>
                    </div>

                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Phone Number or Email</label>
                            <input type="text" id="login-identifier" placeholder="08012345678" required class="w-full bg-[#222] border border-[#333] rounded-xl px-4 py-3 text-sm text-white focus:border-[#10b981] focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
                            <input type="password" id="login-password" placeholder="••••••••" required class="w-full bg-[#222] border border-[#333] rounded-xl px-4 py-3 text-sm text-white focus:border-[#10b981] focus:outline-none">
                        </div>
                        <button type="submit" class="w-full bg-[#10b981] hover:bg-[#059669] text-black font-bold py-3.5 rounded-xl transition shadow-lg mt-2">
                            Sign In
                        </button>
                    </form>

                    <div class="text-center mt-6">
                        <button onclick="window.location.hash='#register'" class="text-xs text-[#10b981] font-semibold hover:underline">Create a new OPay account</button>
                    </div>
                </div>
            `;
        }

        function renderRegisterScreen() {
            return `
                <div class="flex-1 flex flex-col p-6 justify-center">
                    <div class="mb-4">
                        <button onclick="window.location.hash=''" class="text-slate-400 text-xs hover:text-white"><i class="fa-solid fa-arrow-left mr-1"></i>Back to Sign In</button>
                        <h2 class="text-lg font-bold text-white mt-2">Open OPay Account</h2>
                        <p class="text-xs text-slate-400">Independent isolated virtual wallet</p>
                    </div>

                    <form onsubmit="handleRegister(event)" class="space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-400 mb-1">First Name</label>
                                <input type="text" id="reg-firstname" required class="w-full bg-[#222] border border-[#333] p-3 rounded-xl text-xs text-white focus:border-[#10b981] focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-400 mb-1">Last Name</label>
                                <input type="text" id="reg-lastname" required class="w-full bg-[#222] border border-[#333] p-3 rounded-xl text-xs text-white focus:border-[#10b981] focus:outline-none">
                            </div>
                        </div>

                        <div>
                            <label class="block text-[10px] font-semibold text-slate-400 mb-1">Phone Number (Primary ID)</label>
                            <input type="tel" id="reg-phone" placeholder="08012345678" required class="w-full bg-[#222] border border-[#333] p-3 rounded-xl text-xs text-white focus:border-[#10b981] focus:outline-none">
                        </div>

                        <div>
                            <label class="block text-[10px] font-semibold text-slate-400 mb-1">Email Address</label>
                            <input type="email" id="reg-email" placeholder="name@example.com" required class="w-full bg-[#222] border border-[#333] p-3 rounded-xl text-xs text-white focus:border-[#10b981] focus:outline-none">
                        </div>

                        <div>
                            <label class="block text-[10px] font-semibold text-slate-400 mb-1">Password</label>
                            <input type="password" id="reg-password" required class="w-full bg-[#222] border border-[#333] p-3 rounded-xl text-xs text-white focus:border-[#10b981] focus:outline-none">
                        </div>

                        <button type="submit" class="w-full bg-[#10b981] text-black font-bold py-3.5 rounded-xl text-xs mt-3 shadow-lg">
                            Continue & Setup Security PIN
                        </button>
                    </form>
                </div>
            `;
        }

        function renderSetupPinScreen(phone) {
            return `
                <div class="flex-1 flex flex-col p-6 justify-center text-center">
                    <div class="w-16 h-16 rounded-full bg-[#10b981]/20 text-[#10b981] flex items-center justify-center mx-auto mb-4 text-2xl">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <h2 class="text-xl font-bold text-white mb-1">Create Transaction PIN</h2>
                    <p class="text-xs text-slate-400 mb-6">Set your 4-digit PIN to authorize internal transfers and bill payments.</p>
                    
                    <div class="space-y-4 max-w-xs mx-auto w-full">
                        <input type="tel" inputmode="numeric" maxlength="4" id="setup-pin" placeholder="••••" class="w-full bg-[#222] border border-[#333] p-4 rounded-xl text-center text-2xl text-white tracking-[1em] focus:border-[#10b981] focus:outline-none">
                        
                        <button onclick="finalizeRegistration('${phone}')" class="w-full bg-[#10b981] text-black font-bold py-3.5 rounded-xl text-xs shadow-lg">
                            Save PIN & Enable Fingerprint
                        </button>
                    </div>
                </div>
            `;
        }

        function renderDashboardScreen(user) {

            return `

                    <!-- Top Bar -->
                    <div class="p-4 flex items-center justify-between border-b border-[#262626]">
                        <div class="flex items-center gap-3">
                            <div onclick="window.location.hash='#profile'" class="w-10 h-10 rounded-full bg-[#10b981]/20 text-[#10b981] font-bold flex items-center justify-center cursor-pointer">
                                ${user.firstname[0]}${user.lastname[0]}
                            </div>
                            <div>
                                <h3 class="text-xs text-slate-300 font-semibold">Hi, ${user.firstname} ${user.lastname}[span_13](start_span)[span_13](end_span)</h3>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 text-slate-300 text-sm">
                            <i class="fa-solid fa-headset cursor-pointer" title="Support"></i>
                            <i class="fa-solid fa-qrcode cursor-pointer" title="Scan QR"></i>
                            <i onclick="window.location.hash='#notifications'" class="fa-regular fa-bell cursor-pointer relative" title="Notifications">

                    <!-- Balance Card -->
                    <div class="p-4">

                                    Available Balance[span_14](start_span)[span_14](end_span)

                            </div>
                            <h1 class="text-3xl font-extrabold mt-2">
                                ${hideBal ? '₦••••••••' : '₦' + user.balance.toLocaleString('en-NG', {minimumFractionDigits: 2})}
                            </h1>
                            <div class="flex justify-between items-center mt-4 pt-3 border-t border-black/10 text-xs font-semibold">
                                <span>Earned Today ₦0.09[span_16](start_span)[span_16](end_span)</span>
                                <button onclick="alert('Account Number: ${user.accountNumber}\\nPhone Number: ${user.phone}\\nShare either number to receive internal transfers.')" class="bg-black text-[#10b981] px-3 py-1 rounded-lg">Add Money[span_17](start_span)[span_17](end_span)</button>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Actions Grid (To OPay & To Bank)[span_18](start_span)[span_18](end_span) -->
                    <div class="px-4 py-2 grid grid-cols-4 gap-3 text-center">
                        <div onclick="window.location.hash='#send-opay'" class="bg-[#222] p-3 rounded-2xl cursor-pointer hover:bg-[#2a2a2a] transition">
                            <div class="w-10 h-10 rounded-xl bg-[#10b981]/10 text-[#10b981] mx-auto flex items-center justify-center mb-1"><i class="fa-solid fa-user"></i></div>
                            <span class="text-[11px] text-slate-300">To OPay[span_19](start_span)[span_19](end_span)</span>
                        </div>
                        <div onclick="window.location.hash='#send-bank'" class="bg-[#222] p-3 rounded-2xl cursor-pointer hover:bg-[#2a2a2a] transition">
                            <div class="w-10 h-10 rounded-xl bg-[#10b981]/10 text-[#10b981] mx-auto flex items-center justify-center mb-1"><i class="fa-solid fa-building-columns"></i></div>
                            <span class="text-[11px] text-slate-300">To Bank[span_20](start_span)[span_20](end_span)</span>
                        </div>
                        <div onclick="openServiceModal('Savings')" class="bg-[#222] p-3 rounded-2xl cursor-pointer hover:bg-[#2a2a2a] transition">
                            <div class="w-10 h-10 rounded-xl bg-[#10b981]/10 text-[#10b981] mx-auto flex items-center justify-center mb-1"><i class="fa-solid fa-vault"></i></div>
                            <span class="text-[11px] text-slate-300">Save[span_21](start_span)[span_21](end_span)</span>
                        </div>
                        <div onclick="openServiceModal('Loan')" class="bg-[#222] p-3 rounded-2xl cursor-pointer hover:bg-[#2a2a2a] transition">
                            <div class="w-10 h-10 rounded-xl bg-[#10b981]/10 text-[#10b981] mx-auto flex items-center justify-center mb-1"><i class="fa-solid fa-hand-holding-dollar"></i></div>
                            <span class="text-[11px] text-slate-300">Loan[span_22](start_span)[span_22](end_span)</span>
                        </div>
                    </div>

                    <!-- Services Grid[span_23](start_span)[span_23](end_span) -->
                    <div class="px-4 py-3 grid grid-cols-4 gap-3 text-center">
                        <div onclick="openServiceModal('Airtime')" class="bg-[#222] p-3 rounded-2xl cursor-pointer hover:bg-[#2a2a2a] transition">
                            <div class="w-9 h-9 rounded-xl bg-[#10b981]/10 text-[#10b981] mx-auto flex items-center justify-center mb-1"><i class="fa-solid fa-mobile-screen text-xs"></i></div>
                            <span class="text-[10px] text-slate-300">Airtime[span_24](start_span)[span_24](end_span)</span>
                        </div>
                        <div onclick="openServiceModal('Data')" class="bg-[#222] p-3 rounded-2xl cursor-pointer hover:bg-[#2a2a2a] transition">
                            <div class="w-9 h-9 rounded-xl bg-[#10b981]/10 text-[#10b981] mx-auto flex items-center justify-center mb-1"><i class="fa-solid fa-wifi text-xs"></i></div>
                            <span class="text-[10px] text-slate-300">Data[span_25](start_span)[span_25](end_span)</span>
                        </div>
                        <div onclick="openServiceModal('Betting')" class="bg-[#222] p-3 rounded-2xl cursor-pointer hover:bg-[#2a2a2a] transition">
                            <div class="w-9 h-9 rounded-xl bg-[#10b981]/10 text-[#10b981] mx-auto flex items-center justify-center mb-1"><i class="fa-solid fa-futbol text-xs"></i></div>
                            <span class="text-[10px] text-slate-300">Betting[span_26](start_span)[span_26](end_span)</span>
                        </div>
                        <div onclick="window.location.hash='#all-services'" class="bg-[#222] p-3 rounded-2xl cursor-pointer hover:bg-[#2a2a2a] transition">
                            <div class="w-9 h-9 rounded-xl bg-[#10b981]/10 text-[#10b981] mx-auto flex items-center justify-center mb-1"><i class="fa-solid fa-grip text-xs"></i></div>
                            <span class="text-[10px] text-slate-300">More[span_27](start_span)[span_27](end_span)</span>
                        </div>
                    </div>

                    ${renderBottomNav('home')}
                </div>
            `;
        }

        // --- "TO OPAY" TRANSFER SCREEN ---
        function renderSendOpayScreen(user) {
            return `
                <div class="flex-1 flex flex-col p-4 space-y-4">
                    <div class="flex items-center justify-between border-b border-[#262626] pb-3">
                        <button onclick="window.location.hash=''" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-2"></i>Back</button>
                        <h2 class="text-sm font-bold text-white">Transfer to OPay Account</h2>
                        <div class="w-8"></div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Recipient Phone Number or Account No.</label>
                        <input type="tel" id="send-target" oninput="lookupOpayRecipientName()" placeholder="Enter phone or 10-digit account" class="w-full bg-[#222] border border-[#333] rounded-xl px-4 py-3 text-sm text-white focus:border-[#10b981] focus:outline-none">
                    </div>

                    <div id="recipient-name-box" class="hidden bg-[#222]/80 border border-[#10b981]/40 rounded-xl p-3 text-xs flex items-center justify-between">
                        <span class="text-slate-400">Account Name:</span>
                        <span id="resolved-name" class="font-bold text-[#10b981]"></span>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Amount (₦)</label>
                        <input type="number" id="send-amount" placeholder="0.00" class="w-full bg-[#222] border border-[#333] rounded-xl px-4 py-3 text-sm text-white focus:border-[#10b981] focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Description / Narration (Optional)</label>
                        <input type="text" id="send-note" placeholder="What's this for?" class="w-full bg-[#222] border border-[#333] rounded-xl px-4 py-3 text-sm text-white focus:border-[#10b981] focus:outline-none">
                    </div>

                    <button onclick="initiateOpayTransferFlow()" class="w-full bg-[#10b981] text-black font-bold py-3.5 rounded-xl transition mt-2">Next</button>

                    ${renderBottomNav('send')}

            `;
        }

        // --- "TO BANK" TRANSFER SCREEN (Exact UI matching screenshot)[span_28](start_span)[span_28](end_span)[span_29](start_span)[span_29](end_span) ---
        function renderSendBankScreen(user) {
            return `
                <div class="flex-1 flex flex-col p-4 space-y-4">
                    <div class="flex items-center justify-between border-b border-[#262626] pb-3">
                        <button onclick="window.location.hash=''" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-2"></i>Back</button>
                        <h2 class="text-sm font-bold text-white">Transfer to Bank Account[span_30](start_span)[span_30](end_span)[span_31](start_span)[span_31](end_span)</h2>
                        <span onclick="window.location.hash='#history'" class="text-xs text-[#10b981] cursor-pointer">History[span_32](start_span)[span_32](end_span)[span_33](start_span)[span_33](end_span)</span>

                    <!-- Recents & Favorites[span_44](start_span)[span_44](end_span)[span_45](start_span)[span_45](end_span) -->

        // --- AMOUNT & REMARK SCREEN FOR BANK TRANSFERS (Matching Screenshot)[span_54](start_span)[span_54](end_span) ---
        function proceedToBankAmountScreen() {
            const accNum = document.getElementById('bank-account-num').value.trim();
            const bankName = document.getElementById('bank-select-dropdown').value;

            if (accNum.length !== 10 || !bankName) {
                alert('Please enter a valid 10-digit account number and select a bank.');
                return;
            }

            const container = document.getElementById('screen-container');
            container.innerHTML = `
                <div class="flex-1 flex flex-col p-4 space-y-4">

        // --- 3-STAGE LOADING ANIMATION & EXECUTION ---
        function executeBankTransfer(amount, accNum, bankName) {
            const pin = document.getElementById('final-auth-pin').value;
            const senderPhone = getActiveUserPhone();
            let users = getStoredUsers();
            let sender = users[senderPhone];

            if (pin !== sender.pin) {
                alert('Incorrect Transaction PIN.');
                return;
            }

            if (amount > sender.balance) {
                alert('Insufficient balance!');
                return;
            }

            // Run 3-stage loading animation
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="absolute inset-0 bg-black/95 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-center space-y-4">
                    <div class="w-16 h-16 rounded-full border-4 border-[#10b981]/20 border-t-[#10b981] animate-spin flex items-center justify-center"></div>

                    <p class="text-xs text-slate-400">Connecting to secure banking gateway</p>

                        <div class="w-16 h-16 rounded-full border-4 border-[#10b981]/20 border-t-[#10b981] animate-spin flex items-center justify-center"></div>

                    </div>
                `;

                    // Update Balances & Ledger
                    const txnId = 'OPY' + Math.floor(100000 + Math.random() * 900000);
                    const dateStr = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

                    sender.balance -= amount;
                    sender.transactions.push({
                        id: txnId,
                        title: `Transfer to ${bankName.toUpperCase()}`,
                        type: 'debit',
                        amount,
                        details: `Acc: ${accNum}`,
                        date: dateStr
                    });
                    sender.notifications.push({
                        title: 'Transfer Successful',
                        message: `Successfully transferred ₦${amount.toLocaleString()} to ${accNum} (${bankName}).`,
                        date: dateStr,
                        read: false
                    });

                    saveStoredUsers(users);

                    modal.innerHTML = `

        function lookupOpayRecipientName() {
            const target = document.getElementById('send-target').value.trim();
            const nameBox = document.getElementById('recipient-name-box');
            const nameLabel = document.getElementById('resolved-name');

            if (target.length < 5) {
                nameBox.classList.add('hidden');
                return;
            }

            const users = getStoredUsers();
            let foundName = null;

            for (let p in users) {
                let u = users[p];
                if (u.phone === target || u.accountNumber === target) {
                    foundName = `${u.firstname} ${u.lastname} (${u.accountNumber})`;
                    break;
                }
            }

            if (foundName) {
                nameLabel.innerText = foundName;
                nameBox.classList.remove('hidden');
            } else {
                nameLabel.innerText = 'Searching OPay network...';
                nameBox.classList.remove('hidden');
            }
        }

        function initiateOpayTransferFlow() {
            const target = document.getElementById('send-target').value.trim();
            const amount = parseFloat(document.getElementById('send-amount').value);

            if (!target || isNaN(amount) || amount <= 0) {
                alert('Please enter a valid recipient and amount.');
                return;
            }

            const users = getStoredUsers();
            const senderPhone = getActiveUserPhone();
            const sender = users[senderPhone];

            if (amount > sender.balance) {
                alert('Insufficient balance!');
                return;
            }

            let recipientPhone = null;
            let recipientName = '';
            for (let p in users) {
                let u = users[p];
                if (u.phone === target || u.accountNumber === target) {
                    recipientPhone = p;
                    recipientName = `${u.firstname} ${u.lastname}`;
                    break;
                }
            }

            if (!recipientPhone) {
                alert('Recipient account or phone number not found in OPay network.');
                return;
            }

            if (recipientPhone === senderPhone) {
                alert('You cannot transfer money to yourself.');
                return;
            }

            showPaymentAuthorizationModal(amount, users[recipientPhone].accountNumber, 'OPay Network');
        }

                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Recipient / Target / Meter ID</label>
                            <input type="text" id="srv-target" placeholder="Enter target details" class="w-full bg-[#262626] border border-[#333] p-3 rounded-xl text-sm text-white focus:outline-none focus:border-[#10b981]">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Amount (₦)</label>
                            <input type="number" id="srv-amount" placeholder="1000" class="w-full bg-[#262626] border border-[#333] p-3 rounded-xl text-sm text-white focus:outline-none focus:border-[#10b981]">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Transaction PIN (4 digits)</label>
                            <input type="tel" inputmode="numeric" maxlength="4" id="srv-pin" placeholder="••••" class="w-full bg-[#262626] border border-[#333] p-3 rounded-xl text-sm text-white tracking-widest focus:outline-none focus:border-[#10b981]">
                        </div>
                        <button onclick="executeService('${serviceName}')" class="w-full bg-[#10b981] text-black font-bold py-3.5 rounded-xl transition mt-2">Pay ${serviceName}</button>
                    </div>
                </div>
            `;
        }

        function executeService(serviceName) {
            const target = document.getElementById('srv-target').value.trim();
            const amount = parseFloat(document.getElementById('srv-amount').value);
            const pin = document.getElementById('srv-pin').value;

            const phone = getActiveUserPhone();
            let users = getStoredUsers();
            let user = users[phone];

            if (!target || isNaN(amount) || amount <= 0 || !pin) {
                alert('Please fill out all fields correctly.');
                return;
            }

            if (pin !== user.pin) {
                alert('Incorrect Transaction PIN.');
                return;
            }

            if (amount > user.balance) {
                alert('Insufficient virtual balance!');
                return;
            }

            const dateStr = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            user.balance -= amount;
            user.transactions.push({
                id: 'SRV' + Math.floor(100000 + Math.random() * 900000),
                title: `${serviceName} Payment`,
                type: 'debit',
                amount,
                details: `Target: ${target}`,
                date: dateStr
            });
            user.notifications.push({
                title: `${serviceName} Successful`,
                message: `Successfully paid ₦${amount.toLocaleString()} for ${serviceName} to (${target}).`,
                date: dateStr,
                read: false
            });

            saveStoredUsers(users);
            document.getElementById('modal-container').innerHTML = '';
            alert(`${serviceName} payment of ₦${amount.toLocaleString()} successful!`);
            renderApp();
        }

        function toggleBalanceVisibility() {
            let phone = getActiveUserPhone();
            let users = getStoredUsers();
            users[phone].hideBalance = !users[phone].hideBalance;
            saveStoredUsers(users);
            renderApp();
        }

        function changePin() {
            const newPin = prompt('Enter new 4-digit Transaction PIN:');
            if (newPin && newPin.length === 4) {
                let users = getStoredUsers();
                let phone = getActiveUserPhone();
                users[phone].pin = newPin;
                saveStoredUsers(users);
                alert('Transaction PIN updated successfully!');
            } else if (newPin) {
                alert('PIN must be exactly 4 digits.');
            }
        }

        function markNotificationsRead() {
            let users = getStoredUsers();
            let phone = getActiveUserPhone();
            users[phone].notifications.forEach(n => n.read = true);
            saveStoredUsers(users);
            renderApp();
        }

        function handleRegister(e) {
            e.preventDefault();
            const firstname = document.getElementById('reg-firstname').value.trim();
            const lastname = document.getElementById('reg-lastname').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;

            let users = getStoredUsers();
            if (users[phone]) {
                alert('An account with this phone number already exists.');
                return;
            }

            const tempData = { firstname, lastname, phone, email, password };
            localStorage.setItem(DB_KEYS.PENDING_REG, JSON.stringify(tempData));
            renderApp();
        }

        function finalizeRegistration(tempPhoneJSON) {
            const pin = document.getElementById('setup-pin').value.trim();
            if (pin.length !== 4) {
                alert('Transaction PIN must be exactly 4 digits.');
                return;
            }

            const tempData = JSON.parse(localStorage.getItem(DB_KEYS.PENDING_REG));
            localStorage.removeItem(DB_KEYS.PENDING_REG);

            let users = getStoredUsers();
            const accountNumber = generateAccountNumber();
            const dateStr = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

            users[tempData.phone] = {
                ...tempData,
                pin,
                accountNumber,
                balance: 500000000,
                hideBalance: false,
                transactions: [],
                notifications: [{
                    title: 'Welcome Bonus Credited',
                    message: 'Your account has been successfully created. Your starting virtual balance of ₦500,000,000 is now active and ready for simulation.',
                    date: dateStr,
                    read: false
                }]
            };

            saveStoredUsers(users);
            setActiveUserPhone(tempData.phone);
            alert('Account created successfully with ₦500,000,000 starting balance!');
            window.location.hash = '';
            renderApp();
        }

        function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-identifier').value.trim();
            const password = document.getElementById('login-password').value;

            let users = getStoredUsers();
            let foundPhone = null;

            for (let phone in users) {
                let u = users[phone];
                if (u.phone === identifier || u.email === identifier) {
                    if (u.password === password) {
                        foundPhone = phone;
                        break;
                    }
                }
            }

            if (!foundPhone) {
                alert('Invalid phone/email or password.');
                return;
            }

            setActiveUserPhone(foundPhone);
            window.location.hash = '';
            renderApp();
        }

        function handleLogout() {
            setActiveUserPhone(null);
            window.location.hash = '';
            renderApp();
        }
    </script>
</body>
</html>
