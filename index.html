<body>

<script>
'use strict';
const KEY='internal_wallet_opay_style_v4';
const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>window.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const now=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{users:[],session:null};
function seed(){
  if(db.users.length)return;
  const a={id:uid(),name:'Scott Mormen',username:'admin',email:'admin@wallet.local',phone:'08000000000',nin:'',password:'admin1234',pin:'1234',account:'0100000001',balance:500000000,savings:0,loan:0,tx:[],notifications:[],beneficiaries:[],lockedUntil:0,pinFails:0,showBalance:true,role:'admin',createdAt:now(),photo:'',inviteCode:'0100000001',referrer:null,referralEarned:0,referralCount:0,virtualCard:null,settings:{}};
  const b={id:uid(),name:'Test User',username:'testuser',email:'test@wallet.local',phone:'09133817222',nin:'',password:'test1234',pin:'1234',account:'4547654484',balance:500000000,savings:0,loan:0,tx:[],notifications:[],beneficiaries:[],lockedUntil:0,pinFails:0,showBalance:true,role:'user',createdAt:now(),photo:'',inviteCode:'4547654484',referrer:'0100000001',referralEarned:0,referralCount:0,virtualCard:null,settings:{}};
  db.users=[a,b]; save();
}
seed();
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),2500)}
function openSheet(html){const m=document.getElementById('modal');m.innerHTML='<div class="sheet modal-wide">'+html+'</div>';m.classList.add('open')}
function closeSheet(){const m=document.getElementById('modal');m.classList.remove('open');m.innerHTML=''}
function userName(u){return (u?.name||'User').replace(/\s+/g,' ').trim()}
function shortName(u){return userName(u).split(' ')[0]}
function avatar(u,cls='opay-avatar'){return u?.photo?`<div class="${cls}"><img src="${u.photo}" alt="Profile"></div>`:`<div class="${cls}"><span class="ph">👤</span></div>`}
function txHtml(t){return `<div class="tx"><div class="txicon">${t.kind==='credit'?'↓':'↑'}</div><div class="txbody"><b>${esc(t.title)}</b><span class="small">${new Date(t.date).toLocaleString()}</span></div><div class="txamount ${t.kind==='credit'?'credit':'debit'}">${t.kind==='credit'?'+':'-'}${money(t.amount)}</div></div>`}
function nav(active){return `<nav class="nav">${[['home','⌂','Home'],['rewards','◇','Rewards'],['wealth','⌁','Wealth'],['cards','▭','Cards'],['me','●','Me']].map(x=>`<button class="${active===x[0]?'active':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}</nav>`}

function sendBank(){shell('home',`<div class="opay-header"><button class="back" onclick="home()">‹</button><h1>Transfer to Bank Account</h1><button class="ib" style="margin-left:auto" onclick="history()">◷</button></div><div class="wealth-banner" style="margin-top:0"><b>🎫 Free transfers for the day: 2</b><div class="small">Bank lookup is simulated in this standalone HTML. Real account-name lookup requires a connected banking verification API.</div></div><div class="panel"><div class="formrow"><label class="label">Recipient Account</label><input id="bankAccount" class="input number-field" inputmode="numeric" maxlength="10" placeholder="Enter 10 digits Account Number" oninput="bankLookup()"></div><div class="formrow"><label class="label">Select Bank</label><select id="bankSelect" class="select" onchange="bankLookup()"><option value="">Select Bank</option>${bankNames().map(b=>`<option>${b}</option>`).join('')}</select></div><div id="bankResult"></div><div class="formrow"><label class="label">Amount</label><input id="bankAmount" class="input" type="number" min="1" placeholder="₦0.00"></div><div class="formrow"><label class="label">Description</label><input id="bankNote" class="input" placeholder="Optional"></div><button id="bankNext" class="primary wide" disabled onclick="bankContinue()">Next</button></div><div class="panel"><h3 style="margin-top:0">Bank Transfer Success Rate Monitor</h3><p class="small">Monitor is simulated and does not connect to real banks.</p></div><div class="panel"><div class="rowbetween"><h3 style="margin:0">Recents</h3><button class="pill" onclick="beneficiaries()">Favourites</button></div>${(me().beneficiaries||[]).length?(me().beneficiaries.slice(0,3).map(b=>`<button class="opay-row" onclick="prefillBank('${b.account}')"><div class="bank-logo">M</div><div class="rbody"><div class="rtitle">${esc(b.name)}</div><div class="rsub">${esc(b.account)} · ${esc(b.bank||'BANK')}</div></div><span class="arr">›</span></button>`).join('')):'<div class="empt function bankLookup(){const a=document.getElementById('bankAccount')?.value.replace(/\D/g,'')||'',sel=document.getElementById('bankSelect');if(a.length!==10){document.getElementById('bankResult').innerHTML='';document.getElementById('bankNext').disabled=true;return}let bank=sel.value;if(!bank){bank=bankAuto(a);sel.value=bank}const name=fakePerson(a,bank);document.getElementById('bankResult').innerHTML=`<div class="lookup-card"><div class="recipient-preview"><div class="rp">${esc(name.charAt(0))}</div><div><b>${esc(name)}</b><div class="small">${esc(a)}</div><div class="verified">✓ Account name found · ${esc(bank)}</div></div></div></div>`;document.getElementById('bankNext').disabled=false}

function sendInternal(){const u=me();shell('home',`<div class="opay-header"><button class="back" onclick="home()">‹</button><h1>Send to Internal Wallet</h1></div><div class="panel"><div class="formrow"><label class="label">Recipient account / username</label><input id="intRec" class="input" placeholder="01... or username" oninput="internalLookup()"></div><div id="intResult"></div><div class="formrow"><label class="label">Amount</label><input id="intAmt" class="input" type="number" min="1" placeholder="₦0.00"></div><button class="primary wide" onclick="internalContinue()">Continue</button></div>`)}

function openPin(done){const u=me();if(Date.now()<u.lockedUntil)return toast('Transaction PIN is locked for 15 minutes.');let val='';openSheet(`<div class="sheet-head"><h2>Confirm transaction</h2><button class="close" onclick="closeSheet()">×</button></div><div class="confirm"><div class="small">Enter your 4-digit transaction PIN</div><div id="pinDots" class="pinbox"><span></span><span></span><span></span><span></span></div></div><div class="keypad">${[1,2,3,4,5,6,7,8,9,'','0','⌫'].map(k=>`<button class="key" ${k===''?'disabled':''} onclick="pinKey('${k}')">${k}</button>`).join('')}</div><button class="secondary wide" style="margin-top:10px" onclick="closeSheet()">Cancel</button>`);window.__pin={val,done};window.pinKey=k=>{const p=window.__pin;if(k==='⌫')p.val=p.val.slice(0,-1);else if(k!==' '&&k!=='')p.val+=k;if(p.val.length>4)p.val=p.val.slice(0,4);document.querySelectorAll('#pinDots span').forEach((d,i)=>d.classList.toggle('on',i<p.val.length));if(p.val.length===4){const u=me();if(p.val!==u.pin){u.pinFails++;if(u.pinFails>=5){u.lockedUntil=Date.now()+15*60*1000;u.pinFails=0;toast('Too many incorrect PIN attempts. Locked for 15 minutes.')}else toast('Incorrect transaction PIN.');save();p.val='';document.querySelectorAll('#pinDots span').forEach(d=>d.classList.remove('on'));return}u.pinFails=0;save();closeSheet();p.done()}}}

function recordCredit(u,title,a,meta={}){u.tx=u.tx||[];u.tx.push({id:uid(),date:now(),title,amount:a,kind:'credit',...meta})}

function showNotifications(){const u=me();u.notifications.forEach(n=>n.read=true);save();openSheet(`<div class="sheet-head"><h2>Notifications</h2><button class="close" onclick="closeSheet()">×</button></div>${u.notifications.length?u.notifications.slice().reverse().map(n=>`<div class="tx"><div class="txicon">♢</div><div class="txbody"><b>${esc(n.title)}</b><span class="small">${esc(n.body)} · ${new Date(n.date).toLocaleString()}</span></div></div>`).join(''):'<div class="empty">No notifications.</div>'}`)}
function searchUsers(){openSheet(`<div class="sheet-head"><h2>Search wallet</h2><button class="close" onclick="closeSheet()">×</button></div><div class="searchbar"><input id="userq" class="input" placeholder="Username or account number"><button class="primary" onclick="doUserSearch()">Search</button></div><div id="userres" style="margin-top:12px"></div>`)}
function doUserSearch(){const q=document.getElementById('userq').value.trim().toLowerCase().replace(/^@/,'');const a=db.users.filter(u=>u.username.toLowerCase().includes(q)||u.account.includes(q));document.getElementById('userres').innerHTML=a.length?a.map(u=>`<div class="tx">${avatar(u)}<div class="txbody"><b>@${esc(u.username)}</b><span class="small">${esc(userName(u))} · ${esc(u.account)}</span></div><button class="go" onclick="useRecipient('${esc(u.account)}')">Send</button></div>`).join(''):'<div class="empty">No wallet account found.</div>'}
function useRecipient(a){closeSheet();sendInternal();setTimeout(()=>{document.getElementById('intRec').value=a;internalLookup()},80)}
function beneficiaries(){const u=me();shell('home',`<div class="opay-header"><button class="back" onclick="home()">‹</button><h1>Favourites</h1></div><div class="panel"><button class="primary" onclick="addBeneficiary()">+ Add beneficiary</button>${(u.beneficiaries||[]).length?u.beneficiaries.map((b,i)=>`<div class="tx"><div class="bank-logo">M</div><div class="txbody"><b>${esc(b.name)}</b><span class="small">${esc(b.account)} · ${esc(b.bank||'BANK')}</span></div><button class="pill" onclick="removeBeneficiary(${i})">Remove</button></div>`).join(''):'<div class="empty">No saved beneficiaries.</div>'}</div>`)}
function addBeneficiary(){openSheet(`<div class="sheet-head"><h2>Add beneficiary</h2><button class="close" onclick="closeSheet()">×</button></div><input id="bn" class="input" placeholder="Name"><input id="ba" class="input" style="margin-top:10px" maxlength="10" placeholder="10 digit account"><select id="bb" class="select" style="margin-top:10px">${bankNames().map(x=>`<option>${x}</option>`).join('')}</select><button class="primary wide" style="margin-top:10px" onclick="saveBeneficiary()">Save</button>`)}
function saveBeneficiary(){const n=document.getElementById('bn').value.trim(),a=document.getElementById('ba').value.trim(),b=document.getElementById('bb').value,r=me();if(!n||!/^\d{10}$/.test(a))return toast('Enter a name and 10 digit account.');r.beneficiaries.push({name:n,account:a,bank:b});save();closeSheet();beneficiaries()}
function removeBeneficiary(i){me().beneficiaries.splice(i,1);save();beneficiaries()}
function savings(){wealth()}
function loans(){const u=me();shell('home',`<div class="opay-header"><button class="back" onclick="home()">‹</button><h1>My Loan</h1></div><div class="panel"><div class="small">Outstanding loan</div><div style="font-size:30px;font-weight:900">${money(u.loan)}</div><div class="formrow"><label class="label">Loan amount</label><input id="loanAmount" class="input" type="number" min="1000" placeholder="₦1,000 or more"></div><button class="primary wide" onclick="requestLoan()">Request loan</button>${u.loan?'<button class="secondary wide" style="margin-top:9px" onclick="repayLoan()">Repay loan</button>':''}<p class="notice-test">Loan approval is simulated and does not create a real credit facility.</p></div>`)}
function requestLoan(){const u=me(),a=Number(document.getElementById('loanAmount').value);if(a<1000)return toast('Minimum loan is ₦1,000.');u.loan+=a;u.balance+=a;recordCredit(u,'Loan disbursement',a);addNotif(u,'Loan approved',`${money(a)} added to your wallet`);save();toast('Loan approved.');loans()}
function repayLoan(){const u=me();openSheet(`<div class="sheet-head"><h2>Repay loan</h2><button class="close" onclick="closeSheet()">×</button></div><input id="repayAmount" class="input" type="number" max="${Math.min(u.loan,u.balance)}" value="${Math.min(u.loan,u.balance)}"><button class="primary wide" style="margin-top:10px" onclick="doRepay()">Continue</button>`)}
function doRepay(){const u=me(),a=Number(document.getElementById('repayAmount').value);if(!a||a<=0||a>u.balance||a>u.loan)return toast('Invalid repayment amount.');openPin(()=>{u.balance-=a;u.loan-=a;recordDebit(u,'Loan repayment',a);save();closeSheet();toast('Loan repayment completed.');loans()})}
function recordLoan(){ }
function copyAccount(){copyText(me().account)}
function faceGate(done){openSheet(`<div class="sheet-head"><h2>Face verification</h2><button class="close" onclick="closeSheet()">×</button></div><p class="small">Camera presence check for protected transactions.</p><div class="camera"><video id="faceVideo" autoplay muted playsinline></video><div class="scan"></div></div><button id="faceBtn" class="primary wide" style="margin-top:12px">Verify face</button>`);let stream=null;navigator.mediaDevices?.getUserMedia?.({video:true}).then(s=>{stream=s;document.getElementById('faceVideo').srcObject=s}).catch(()=>{});document.getElementById('faceBtn').onclick=()=>{stream?.getTracks().forEach(t=>t.stop());closeSheet();done()}}
function logout(){db.session=null;save();auth()}
function profileImage(){profile()}
if(!db.session)auth();else home();

</script>
</body>
</html>
