<style>
:root{--green:#00b96b;--green2:#00d982;--dark:#07130e;--bg:#f5f7f6;--card:#fff;--text:#101814;--muted:#718078;--line:#e6ece8;--danger:#e5484d;--amber:#d88b00;--shadow:0 14px 40px rgba(8,28,18,.08);--radius:20px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px}.brandmark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--green),#087c50);display:grid;place-items:center;color:#fff;font-weight:1000}.top-actions{display:flex;gap:9px;align-items:center}.iconbtn{width:42px;height:42px;border-radius:13px;background:#f1f5f2;color:#23332b}.badge{position:absolute;background:var(--danger);color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:9px;display:grid;place-items:center;margin:-48px 0 0 25px;border:2px solid #fff}.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 72px)}.side{background:#fff;border-right:1px solid var(--line);padding:20px 13px;position:sticky;top:72px;height:calc(100vh - 72px)}.navbtn{width:100%;padding:13px 14px;margin:3px 0;background:transparent;border-radius:14px;text-align:left;color:#5c6b63;font-weight:700}.navbtn.active,.navbtn:hover{background:#e9faf2;color:#078c55}.main{padding:25px;max-width:1450px;width:100%;margin:auto}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(135deg,#061d13,#0a5b3d);color:#fff;border-radius:27px;padding:28px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(0,217,130,.13);right:-100px;top:-110px}.hero-row{display:flex;justify-content:space-between;gap:20px;align-items:center;position:relative;z-index:1}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:#94e8c1;font-weight:900}.balance{font-size:39px;font-weight:950;letter-spacing:-1px;margin:7px 0}.muted{color:var(--muted)}.hero .muted{color:#b8d2c6}.quick{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border-radius:13px;padding:12px 16px;font-weight:850}.btn.primary{background:var(--green);color:#fff}.btn.light{background:#fff;color:#073f29}.btn.soft{background:#edf7f2;color:#087a4d}.btn.danger{background:#ffecee;color:#bd2c35}.btn.outline{background:transparent;border:1px solid var(--line);color:var(--text)}.grid{display:grid;gap:17px}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}.section{margin-top:23px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 8px 25px rgba(8,28,18,.035)}.card h3{margin:0 0 7px}.service{min-height:120px;display:flex;flex-direction:column;justify-content:space-between}.service-icon{width:44px;height:44px;border-radius:14px;background:#eafaf2;display:grid;place-items:center;color:#078c55;font-weight:950;font-size:19px}.service:hover{transform:translateY(-2px);box-shadow:var(--shadow);transition:.2s}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:24px;margin:0 0 6px}.subtitle{color:var(--muted);margin:0 0 18px}.list{display:flex;flex-direction:column}.tx{padding:14px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.tx:last-child{border-bottom:0}.txicon{width:42px;height:42px;border-radius:13px;background:#eef6f1;display:grid;place-items:center;font-weight:900}.txbody{flex:1;min-width:0}.txbody strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.amount{font-weight:900}.credit{color:#078c55}.debit{color:#c43a42}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef5f1;color:#547066;font-size:11px;font-weight:800}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #dbe5df;background:#fff;border-radius:13px;padding:13px 14px;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:#61d9a5;box-shadow:0 0 0 4px #e6faf1}.actions{display:flex;gap:9px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:rgba(2,12,8,.57);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.open{display:flex}.modalbox{background:#fff;width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:24px;padding:23px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:#f1f4f2;border-radius:10px;width:36px;height:36px}.auth{min-height:100vh;background:radial-gradient(circle at 80% 20%,#0b7c51 0,#07130e 42%,#030907 100%);display:grid;place-items:center;padding:18px}.authbox{width:min(520px,100%);background:#fff;border-radius:28px;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.35)}.authbrand{display:flex;align-items:center;gap:12px;margin-bottom:20px}.authbrand .brandmark{width:45px;height:45px}.authbox h1{margin:0 0 6px}.switch{text-align:center;color:var(--muted);margin-top:15px}.link{color:#008a52;font-weight:850;cursor:pointer}.notice{padding:12px 14px;border-radius:13px;background:#eef8f3;color:#17603f;font-size:13px;margin:12px 0}.error{background:#fff0f1;color:#b82e36}.search{display:flex;gap:9px;margin-bottom:15px}.search input{flex:1}.camera{background:#07130e;border-radius:18px;min-height:250px;overflow:hidden;position:relative}.camera video{width:100%;height:300px;object-fit:cover}.camera .scan{position:absolute;inset:25px;border:2px solid #55f0aa;border-radius:45%;box-shadow:0 0 0 999px rgba(0,0,0,.3)}.stat{font-size:25px;font-weight:950}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}.mobile-nav{display:none}.empty{text-align:center;padding:40px 15px;color:var(--muted)}.footer-note{text-align:center;color:#84918b;font-size:12px;padding:30px}.danger-text{color:var(--danger)}.lookup-card{margin-top:8px;padding:13px 14px;border:1px solid #bfead5;background:#f0fbf6;border-radius:14px;display:flex;flex-direction:column;gap:5px}.lookup-card b{font-size:15px}.lookup-card .tag{width:max-content}.profile-card{display:flex;align-items:center;gap:16px}.avatar{width:64px;height:64px;border-radius:50%;background:#e8faf1;color:#078c55;display:grid;place-items:center;font-size:25px;font-weight:950}
@media(max-width:1000px){.grid4{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.side{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:50;justify-content:space-around;padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.mobile-nav button{background:none;color:#6a7870;font-size:10px;font-weight:800}.mobile-nav button.active{color:#008b55}.mobile-nav span{display:block;font-size:20px;margin-bottom:2px}.main{padding:17px;padding-bottom:90px}.hero-row{display:block}.topbar{padding:0 13px}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.grid4,.grid3,.grid2{grid-template-columns:1fr 1fr}.balance{font-size:31px}.hero{padding:20px}.card{padding:16px}.grid3 .card:last-child{grid-column:span 2}.top-actions .hide-mobile{display:none}.title{font-size:21px}.service{min-height:105px}.quick .btn{flex:1}.authbox{padding:21px}.table th:nth-child(3),.table td:nth-child(3){display:none}}
</style>

<body>
<div id="root"></div>
<script>
'use strict';

/*
  VEYRA shared-wallet frontend
  IMPORTANT: set API_BASE to the public URL where backend/src/server.ts is deployed.
  Example: https://your-veyra-api.example.com
*/
const API_BASE = (window.VEYRA_API_BASE || localStorage.getItem('veyra_api_base') || 'http://localhost:4000').replace(/\/$/,'');
const TOKEN_KEY='veyra_access_token';
const REFRESH_KEY='veyra_refresh_token';
const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const now=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let state={user:null,tx:[],notifications:[]};
let lookupTimer=null;

function token(){return localStorage.getItem(TOKEN_KEY)||''}
function setTokens(access,refresh){if(access)localStorage.setItem(TOKEN_KEY,access);if(refresh)localStorage.setItem(REFRESH_KEY,refresh)}
function clearTokens(){localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(REFRESH_KEY)}
function apiUrl(path){return API_BASE+path}
async function api(path,options={},retry=true){
  const headers={'Content-Type':'application/json',...(options.headers||{})};
  if(token())headers.Authorization='Bearer '+token();
  let r;
  try{r=await fetch(apiUrl(path),{...options,headers})}
  catch(e){throw new Error('Cannot reach Veyra server. Check API_BASE and make sure the backend is running.')}
  if(r.status===401&&retry&&localStorage.getItem(REFRESH_KEY)){
    const rr=await fetch(apiUrl('/api/auth/refresh'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refreshToken:localStorage.getItem(REFRESH_KEY)})});
    if(rr.ok){const d=await rr.json();setTokens(d.accessToken,null);return api(path,options,false)}
    clearTokens();state={user:null,tx:[],notifications:[]};authView('login');throw new Error('Session expired. Please sign in again.')
  }
  let data={};try{data=await r.json()}catch{}
  if(!r.ok)throw new Error(data.message||data.code||('Request failed ('+r.status+')'));
  return data;
}

const root=document.getElementById('root');
function authView(mode='login',notice=''){
  root.innerHTML=`<div class="auth"><div class="authbox"><div class="authbrand"><div class="brandmark">V</div><div><b>Veyra</b><div class="muted">Secure internal payments</div></div></div><h1>${mode==='login'?'Welcome back':'Create your account'}</h1><p class="muted">${mode==='login'?'Sign in to continue.':'Set up your personal wallet account.'}</p><div id="authmsg">${notice?`<div class="notice error">${esc(notice)}</div>`:''}</div><form id="authform">${mode==='register'?`<div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Username</label><input name="username" pattern="[A-Za-z0-9_]{3,30}" required></div><div class="field"><label>Phone / transaction number</label><input name="phone" inputmode="tel" placeholder="08012345678" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>NIN</label><input name="nin" inputmode="numeric" minlength="11" maxlength="11"></div><div class="field"><label>Password</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>Transaction PIN</label><input name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div>`:`<div class="field"><label>Email or phone</label><input name="identity" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div>`}<button class="btn primary" style="width:100%">${mode==='login'?'Sign in':'Create account'}</button></form><div class="switch">${mode==='login'?`New here? <span class="link" id="reg">Create account</span><br><span class="link" id="forgot">Forgot password?</span>`:`Already have an account? <span class="link" id="login">Sign in</span>`}</div><div class="notice" style="margin-top:18px">Veyra transfers are internal simulated wallet transfers. No real bank money is moved.</div></div></div>`;
  document.getElementById('authform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(mode==='register')register(f);else login(f)};
  document.getElementById(mode==='login'?'reg':'login')?.addEventListener('click',()=>authView(mode==='login'?'register':'login'));
  document.getElementById('forgot')?.addEventListener('click',forgot);
}
function msg(t,err=false){const x=document.getElementById('authmsg');if(x)x.innerHTML=`<div class="notice ${err?'error':''}">${esc(t)}</div>`}
function splitName(name){const p=String(name||'').trim().split(/\s+/);return {firstName:p.shift()||'User',lastName:p.join(' ')||'User'}}
async function register(f){
  const name=String(f.get('name')).trim(), n=splitName(name);
  try{
    const d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({firstName:n.firstName,lastName:n.lastName,username:String(f.get('username')).trim().toLowerCase(),phone:String(f.get('phone')).trim(),email:String(f.get('email')).trim().toLowerCase(),password:String(f.get('password')),pin:String(f.get('pin'))})},false);
    setTokens(d.accessToken,d.refreshToken);await loadState();app();
  }catch(e){msg(e.message,true)}
}
async function login(f){
  try{
    const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({identifier:String(f.get('identity')).trim(),password:String(f.get('password'))})},false);
    setTokens(d.accessToken,d.refreshToken);await loadState();app();
  }catch(e){msg(e.message,true)}
}
function forgot(){alert('Password reset requires a real OTP/reset endpoint on the Veyra backend. It is not faked in this shared-transfer build.')}
async function loadState(){
  const [m,t,n]=await Promise.all([api('/api/me'),api('/api/transactions'),api('/api/notifications')]);
  const u=m.user;
  state.user={...u,name:`${u.firstName} ${u.lastName}`,account:u.accountNumber,balance:Number(u.balance),showBalance:true,savings:0,loan:0,notifications:n.notifications||[],tx:normalizeTx(t.transactions||[]),beneficiaries:[],role:'user'};
  state.tx=state.user.tx;state.notifications=state.user.notifications;
}
function normalizeTx(rows){return rows.map(t=>{const credit=t.receiverId===state.user?.id;return {id:t.id,date:t.createdAt,title:credit?`Transfer from ${t.sender?.firstName||'User'} ${t.sender?.lastName||''}`:`Transfer to ${t.recipientName||'User'}`,amount:Number(t.amount),kind:credit?'credit':'debit',recipient:t.recipientAccount,note:t.narration,reference:t.reference,status:t.status}})}
function current(){return state.user}
async function app(){try{await loadState();renderShell();go('home')}catch(e){clearTokens();authView('login',e.message)}}
function renderShell(){const u=current();root.innerHTML=`<div class="app"><header class="topbar"><div class="brand"><div class="brandmark">V</div>Veyra</div><div class="top-actions"><button class="iconbtn" id="searchBtn">⌕</button><button class="iconbtn" id="notifBtn" style="position:relative">♢<span class="badge" id="nb">${state.notifications.filter(n=>!n.read).length||''}</span></button><button class="iconbtn" id="profileBtn">◉</button></div></header><div class="layout"><aside class="side">${navHtml()}<div style="position:absolute;bottom:20px;left:13px;right:13px"><button class="navbtn" id="logout">⇥ Sign out</button></div></aside><main class="main"><div id="pages"></div><div class="footer-note">Veyra · Internal transactions only</div></main></div><nav class="mobile-nav">${[['home','⌂','Home'],['send','↗','Send'],['history','◷','History'],['services','▦','Services'],['profile','◉','Profile']].map(x=>`<button data-nav="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav></div><div id="modal" class="modal"></div>`;
 document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));document.getElementById('logout').onclick=logout;document.getElementById('searchBtn').onclick=searchModal;document.getElementById('notifBtn').onclick=notifications;document.getElementById('profileBtn').onclick=()=>go('profile')}
function navHtml(){return [['home','⌂','Home'],['send','↗','Send money'],['history','◷','Transactions'],['services','▦','Services'],['savings','▣','Savings'],['cards','▤','Cards'],['loans','₦','Loans'],['beneficiaries','♙','Beneficiaries'],['profile','◉','Profile'],['settings','⚙','Settings']].map(x=>`<button class="navbtn" data-nav="${x[0]}">${x[1]} &nbsp; ${x[2]}</button>`).join('')}
function go(page){const pages=document.getElementById('pages');if(!pages)return;pages.innerHTML=pageHtml(page);const el=document.getElementById('page-'+page);el?.classList.add('active');document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));bindPage(page);window.scrollTo({top:0,behavior:'smooth'})}
function pageHtml(page){const u=current();if(page==='home')return homeHtml(u);if(page==='send')return sendHtml(u);if(page==='history')return historyHtml(u);if(page==='services')return servicesHtml();if(page==='savings')return savingsHtml(u);if(page==='cards')return cardsHtml(u);if(page==='loans')return loansHtml(u);if(page==='beneficiaries')return beneficiariesHtml(u);if(page==='profile')return profileHtml(u);if(page==='settings')return settingsHtml(u);return ''}
function homeHtml(u){const balance=u.showBalance?money(u.balance):'••••••••';const tx=state.tx.slice().reverse().slice(0,6);return `<section class="page active" id="page-home"><div class="hero"><div class="hero-row"><div><div class="eyebrow">Available balance</div><div class="balance" id="dashBalance">${balance}</div><div class="muted">Account ${esc(u.account)}</div><div class="quick"><button class="btn light" onclick="go('send')">Send money</button><button class="btn" style="background:#164f3a;color:#fff" onclick="serviceModal('Airtime')">Buy airtime</button><button class="btn" style="background:#164f3a;color:#fff" onclick="serviceModal('Data')">Buy data</button></div></div><button class="btn" style="background:rgba(255,255,255,.12);color:#fff" onclick="toggleBalance()">${u.showBalance?'Hide':'Show'} balance</button></div></div><div class="section"><div class="row"><div><h2 class="title">Quick services</h2><p class="subtitle">Everything you need in one place.</p></div><button class="btn soft" onclick="go('services')">View all</button></div><div class="grid grid4">${[['Airtime','☎'],['Data','◉'],['Electricity','ϟ'],['TV Bill','▣'],['Education','▤'],['Betting','♢'],['Savings','▣'],['Loans','₦']].map(s=>`<div class="card service" onclick="${['Savings','Loans'].includes(s[0])?`go('${s[0].toLowerCase()}')`:`serviceModal('${s[0]}')`}"><div class="service-icon">${s[1]}</div><div><b>${s[0]}</b><div class="muted" style="font-size:12px">Open service</div></div></div>`).join('')}</div></div><div class="section grid grid2"><div class="card"><div class="row"><h3>Recent transactions</h3><button class="btn soft" onclick="go('history')">See all</button></div>${tx.length?tx.map(txHtml).join(''):'<div class="empty">No transactions yet.</div>'}</div><div class="card"><h3>Your account</h3><div class="row" style="margin:14px 0"><span class="muted">Username</span><b>@${esc(u.username)}</b></div><div class="row" style="margin:14px 0"><span class="muted">Full name</span><b>${esc(u.name)}</b></div><div class="row" style="margin:14px 0"><span class="muted">Balance</span><b>${money(u.balance)}</b></div><div class="row"><span class="muted">Account</span><span class="tag">${esc(u.account)}</span></div></div></div></section>`}
function sendHtml(u){return `<section class="page active" id="page-send"><h1 class="title">Send money</h1><p class="subtitle">Send money to another Veyra user using the recipient's account number.</p><div class="grid grid2"><div class="card"><form id="sendForm"><div class="field"><label>Recipient account number</label><input id="recipientInput" name="recipient" inputmode="numeric" maxlength="10" required placeholder="Enter account number"><div id="recipientLookup" class="lookup"></div></div><div class="field"><label>Amount</label><input name="amount" type="number" min="1" step="0.01" required placeholder="₦0.00"></div><div class="field"><label>Description</label><input name="note" maxlength="140" placeholder="What is this for?"></div><button class="btn primary" id="sendBtn">Continue</button></form></div><div class="card"><h3>How it works</h3><p class="muted">Enter a Veyra account number. Veyra checks the shared database and displays the registered person's name before you continue.</p><span class="tag">Shared database</span> <span class="tag">PIN protected</span><div id="transferStatus" class="notice" style="margin-top:14px">The receiver gets the money in their Veyra wallet immediately after a successful transfer.</div></div></div></section>`}
function historyHtml(u){return `<section class="page active" id="page-history"><h1 class="title">Transactions</h1><p class="subtitle">Search and review your wallet activity.</p><div class="card"><div class="search"><input id="txSearch" placeholder="Search transaction, recipient or description"><select id="txFilter"><option value="all">All</option><option value="credit">Money in</option><option value="debit">Money out</option></select></div><div id="txList"></div></div></section>`}
function servicesHtml(){return `<section class="page active" id="page-services"><h1 class="title">All services</h1><p class="subtitle">Internal wallet services.</p><div class="grid grid3">${[['Airtime','☎'],['Data','◉'],['Electricity','ϟ'],['TV Bill','▣'],['Education','▤'],['Betting','♢']].map(s=>`<div class="card service" onclick="serviceModal('${s[0]}')"><div class="service-icon">${s[1]}</div><b>${s[0]}</b><div class="muted">Open service</div></div>`).join('')}<div class="card service" onclick="go('savings')"><div class="service-icon">▣</div><b>Savings</b><div class="muted">Save from your wallet</div></div><div class="card service" onclick="go('loans')"><div class="service-icon">₦</div><b>Loans</b><div class="muted">Internal loan simulation</div></div></div></section>`}
function savingsHtml(u){return `<section class="page active" id="page-savings"><h1 class="title">Savings</h1><p class="subtitle">Move money between your available wallet balance and savings.</p><div class="card"><div class="row"><div><div class="muted">Savings balance</div><div class="balance">${money(u.savings)}</div></div><span class="tag">Internal</span></div><div class="field"><label>Amount</label><input id="saveAmount" type="number" min="1" placeholder="₦0.00"></div><div class="quick"><button class="btn primary" onclick="saveMoney('deposit')">Save money</button><button class="btn soft" onclick="saveMoney('withdraw')">Withdraw</button></div></div></section>`}
function cardsHtml(u){return `<section class="page active" id="page-cards"><h1 class="title">Virtual Cards</h1><p class="subtitle">Internal card simulation.</p><div class="card">${u.card?`<div class="virtual-card"><b>VEYRA</b><div>${esc(u.card.number)}</div><small>Virtual Card</small></div><button class="btn soft" onclick="deleteCard()">Remove card</button>`:`<p class="muted">No virtual card yet.</p><button class="btn primary" onclick="createCard()">Create virtual card</button>`}</div></section>`}
function loansHtml(u){return `<section class="page active" id="page-loans"><h1 class="title">Loan Center</h1><p class="subtitle">Internal loan simulation.</p><div class="card"><div class="muted">Outstanding loan</div><div class="balance">${money(u.loan)}</div><div class="field"><label>Loan amount</label><input id="loanAmount" type="number" min="1000" placeholder="₦1,000 or more"></div><button class="btn primary" onclick="requestLoan()">Request loan</button>${u.loan?`<button class="btn soft" onclick="repayLoan()">Repay loan</button>`:''}</div></section>`}
function beneficiariesHtml(u){return `<section class="page active" id="page-beneficiaries"><h1 class="title">Beneficiaries</h1><p class="subtitle">Saved internal recipients are stored locally in this UI until the beneficiary API is added.</p><div class="card"><button class="btn primary" onclick="addBeneficiary()">+ Add beneficiary</button>${(u.beneficiaries||[]).length?(u.beneficiaries.map((b,i)=>`<div class="tx"><div class="txicon">♙</div><div class="txbody"><b>${esc(b.name)}</b><span class="muted">${esc(b.account)}</span></div><button class="btn soft" onclick="removeBeneficiary(${i})">Remove</button></div>`).join('')):'<div class="empty">No saved beneficiaries.</div>'}</div></section>`}
function profileHtml(u){return `<section class="page active" id="page-profile"><h1 class="title">Profile</h1><p class="subtitle">Your Veyra account information.</p><div class="card profile-card"><div class="avatar">${esc((u.firstName||u.name||'U')[0])}</div><div><b>@${esc(u.username)}</b><div class="muted">${esc(u.name)}</div><div class="muted">Account ${esc(u.account)}</div></div></div><div class="card"><div class="row"><span class="muted">Email</span><b>${esc(u.email)}</b></div><div class="row"><span class="muted">Phone</span><b>${esc(u.phone)}</b></div><div class="row"><span class="muted">Account number</span><b>${esc(u.account)}</b></div></div></section>`}
function settingsHtml(u){return `<section class="page active" id="page-settings"><h1 class="title">Settings</h1><p class="subtitle">Security and wallet preferences.</p><div class="card"><button class="navbtn" onclick="changePassword()">🔒 Change password</button><button class="navbtn" onclick="changePin()">⌘ Change transaction PIN</button><button class="navbtn" onclick="toggleBalance()">◉ Toggle balance visibility</button><button class="navbtn" onclick="configureApi()">⚙ API connection</button><button class="navbtn" onclick="logout()">⇥ Sign out</button></div></section>`}
function txHtml(t){return `<div class="tx"><div class="txicon">${t.kind==='credit'?'↓':'↑'}</div><div class="txbody"><strong>${esc(t.title)}</strong><span class="muted">${new Date(t.date).toLocaleString()}${t.reference?' · '+esc(t.reference):''}</span></div><div class="txamount ${t.kind==='credit'?'credit':'debit'}">${t.kind==='credit'?'+':'-'}${money(t.amount)}</div></div>`}
function bindPage(page){const u=current();if(page==='history'){const render=()=>{const q=(document.getElementById('txSearch')?.value||'').toLowerCase(),f=document.getElementById('txFilter')?.value||'all';const a=state.tx.slice().reverse().filter(t=>(f==='all'||t.kind===f)&&JSON.stringify(t).toLowerCase().includes(q));document.getElementById('txList').innerHTML=a.length?a.map(txHtml).join(''):'<div class="empty">No matching transactions.</div>'};document.getElementById('txSearch').oninput=render;document.getElementById('txFilter').onchange=render;render()}
 if(page==='send'){const input=document.getElementById('recipientInput');input.oninput=()=>{clearTimeout(lookupTimer);lookupTimer=setTimeout(()=>lookupRecipient(input.value.trim()),350)};document.getElementById('sendForm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);beginTransfer(String(d.get('recipient')).trim(),Number(d.get('amount')),String(d.get('note')||''))}}
}
async function lookupRecipient(q){const box=document.getElementById('recipientLookup');if(!box)return;if(q.length<3){box.innerHTML='';return}box.innerHTML='<div class="muted">Checking shared Veyra accounts…</div>';try{const d=await api('/api/users/lookup?q='+encodeURIComponent(q));const r=d.recipient;box.innerHTML=`<div class="lookup-card"><b>${esc(r.firstName+' '+r.lastName)}</b><span class="muted">Account ${esc(r.accountNumber)} · @${esc(r.username)}</span><span class="tag">✓ Veyra account found</span></div>`;box.dataset.recipientId=r.id;box.dataset.name=r.firstName+' '+r.lastName}catch(e){box.dataset.recipientId='';box.innerHTML='<div class="notice error">No active Veyra account found for that account number.</div>'}}
function openModal(html){const m=document.getElementById('modal');m.innerHTML=`<div class="modalbox">${html}</div>`;m.classList.add('open')}
function closeModal(){document.getElementById('modal')?.classList.remove('open')}
async function searchModal(){openModal(`<div class="modalhead"><h2>Find a Veyra user</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Account number, phone or username</label><input id="userSearch" placeholder="01… / phone / username"></div><button class="btn primary" onclick="findUser()">Search</button><div id="searchResult" style="margin-top:15px"></div>`)}
async function findUser(){const q=document.getElementById('userSearch').value.trim(),out=document.getElementById('searchResult');out.innerHTML='<div class="muted">Searching shared database…</div>';try{const d=await api('/api/users/lookup?q='+encodeURIComponent(q));const u=d.recipient;out.innerHTML=`<div class="card"><b>@${esc(u.username)}</b><p class="muted">${esc(u.firstName+' '+u.lastName)} · ${esc(u.accountNumber)}</p><button class="btn primary" onclick="closeModal();go('send');setTimeout(()=>{const x=document.getElementById('recipientInput');x.value='${esc(u.accountNumber)}';lookupRecipient('${esc(u.accountNumber)}')},50)">Send money</button></div>`}catch(e){out.innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
async function notifications(){try{await api('/api/notifications/read-all',{method:'POST'});await loadState()}catch{}const ns=state.notifications;openModal(`<div class="modalhead"><h2>Notifications</h2><button class="close" onclick="closeModal()">×</button></div>${ns.length?ns.slice().reverse().map(n=>`<div class="tx"><div class="txicon">♢</div><div class="txbody"><strong>${esc(n.title)}</strong><span class="muted">${esc(n.message)} · ${new Date(n.createdAt).toLocaleString()}</span></div></div>`).join(''):'<div class="empty">No notifications.</div>'}`);document.getElementById('nb').textContent=''}
function toggleBalance(){const u=current();u.showBalance=!u.showBalance;go('home')}
function isNight(){const h=new Date().getHours();return h>=0&&h<5}
async function faceVerify(){openModal(`<div class="modalhead"><h2>NightGuard face check</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">This is only a camera-presence check in this HTML. It is not biometric identity matching.</p><div class="camera"><video id="faceVideo" autoplay muted playsinline></video><div class="scan"></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="verifyFaceBtn">Continue</button><button class="btn outline" onclick="closeModal()">Cancel</button></div><p id="faceMsg" class="muted"></p>`);let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:true});document.getElementById('faceVideo').srcObject=stream}catch(e){document.getElementById('faceMsg').textContent='Camera permission unavailable.';return false}return await new Promise(resolve=>{document.getElementById('verifyFaceBtn').onclick=()=>{stream?.getTracks().forEach(t=>t.stop());closeModal();resolve(true)}})}
async function beginTransfer(recipient,amount,note){
  if(!recipient||!Number.isFinite(amount)||amount<=0)return alert('Enter a valid recipient and amount.');
  const box=document.getElementById('recipientLookup');let recipientId=box?.dataset.recipientId;
  if(!recipientId){try{const d=await api('/api/users/lookup?q='+encodeURIComponent(recipient));recipientId=d.recipient.id}catch(e){return alert('Recipient account was not found in the shared Veyra database.')}}
  if(amount>current().balance)return alert('Insufficient balance.');
  if(isNight()){const ok=await faceVerify();if(!ok)return}
  const pin=prompt('Enter your 4-digit transaction PIN');if(pin===null)return;if(!/^\d{4}$/.test(pin))return alert('PIN must be exactly 4 digits.');
  try{
    const d=await api('/api/transfers/internal',{method:'POST',headers:{'Idempotency-Key':uid()},body:JSON.stringify({recipientId,amount,narration:note||undefined,pin})});
    await loadState();alert(`Transfer successful.\n${money(amount)} sent.\nThe recipient's Veyra wallet has been credited.`);go('home');
  }catch(e){alert(e.message)}
}
function serviceModal(type){const labels={Airtime:'Phone number',Data:'Phone number',Electricity:'Meter number','TV Bill':'Smartcard number',Education:'Student/reference number',Betting:'Customer ID'};openModal(`<div class="modalhead"><h2>${type}</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>${labels[type]}</label><input id="serviceTarget" required></div><div class="field"><label>Amount</label><input id="serviceAmount" type="number" min="100" required></div><button class="btn primary" onclick="payService('${type}')">Pay now</button><p class="muted" style="font-size:12px;margin-top:12px">This service is still simulated locally in this build.</p>`)}
function payService(type){alert(type+' service is not connected to the shared backend yet. The shared money-transfer system is connected.')}
function saveMoney(mode){alert('Savings backend integration is the next module. The wallet transfer system is already shared.')}
function createCard(){const u=current();u.card={number:'5399 '+Math.floor(1000+Math.random()*8999)+' '+Math.floor(1000+Math.random()*8999)+' '+Math.floor(1000+Math.random()*8999)};go('cards')}
function deleteCard(){if(confirm('Remove this card?')){current().card=null;go('cards')}}
function requestLoan(){alert('Loan backend integration is not connected in this transfer build.')}
function repayLoan(){alert('Loan backend integration is not connected in this transfer build.')}
function addBeneficiary(){alert('Beneficiary storage is not yet connected to the backend. You can still transfer by account number.')}
function removeBeneficiary(i){current().beneficiaries.splice(i,1);go('beneficiaries')}
function changePassword(){alert('Password-change endpoint needs to be added to the backend before this action can be enabled securely.')}
function changePin(){alert('PIN-change endpoint needs to be added to the backend before this action can be enabled securely.')}
function configureApi(){const v=prompt('Veyra API URL',API_BASE);if(v){localStorage.setItem('veyra_api_base',v.replace(/\/$/,''));alert('API URL saved. Reload the page to reconnect.')}}
async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch{}clearTokens();state={user:null,tx:[],notifications:[]};authView('login')}

document.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
if(token())app();else authView('login');
</script>
</body>
</html>
