<html lang="en">

<style>
:root{--g:#18d39a;--g2:#10c88e;--bg:#171817;--panel:#242625;--panel2:#2b2d2c;--soft:#323433;--text:#f4f7f5;--muted:#a7aeaa;--line:#393c3a;--danger:#ff5d68;--gold:#f1c75b;--radius:20px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.top{height:76px;background:#101312;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900}.logo{width:39px;height:39px;border-radius:12px;background:var(--g);color:#0c3326;display:grid;place-items:center;font-weight:1000}.topicons{display:flex;gap:8px}.ib{width:42px;height:42px;border-radius:14px;background:#202422;color:#eef3ef;font-size:19px;position:relative}.dot{position:absolute;width:9px;height:9px;border-radius:50%;background:#ef5360;right:4px;top:3px;border:2px solid #101312}.body{max-width:760px;margin:0 auto;padding:18px 18px 100px}.page{display:none}.page.active{display:block}.greet{display:flex;align-items:center;gap:11px;margin:4px 0 17px}.avatar{width:43px;height:43px;border-radius:50%;background:linear-gradient(135deg,#bd745d,#343a39);display:grid;place-items:center;font-size:21px}.greet b{font-size:16px}.balance-card{background:linear-gradient(135deg,#19d39a,#12c88f);color:#082d21;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.16)}.balance-main{padding:18px 20px 14px}.available{font-size:14px;display:flex;align-items:center;gap:6px}.balance{font-size:28px;font-weight:950;margin-top:13px}.earned{margin-top:13px;font-size:13px}.historybar{background:#10372b;color:#e8fff6;padding:15px 19px;display:flex;justify-content:space-between;align-items:center}.quick4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#242725;padding:16px;border-radius:20px;margin-top:14px}.quick{background:transparent;color:var(--text);text-align:center}.qicon{width:56px;height:56px;margin:auto;background:#141615;border-radius:15px;display:grid;place-items:center;color:var(--g);font-size:25px}.quick small{display:block;margin-top:8px;color:#e5e9e7;font-weight:650}.notice{margin-top:14px;background:#242725;border-radius:20px;padding:16px;display:flex;align-items:center;gap:12px}.notice .ni{width:48px;height:48px;border-radius:50%;background:#59472b;display:grid;place-items:center;font-size:22px}.notice-body{flex:1}.notice-body b{display:block;margin-bottom:5px}.go{background:var(--g);color:#073628;padding:11px 18px;border-radius:22px;font-weight:900}.services{background:#242725;border-radius:20px;padding:16px;margin-top:14px}.service-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px 8px}.svc{text-align:center;color:#e8ecea;background:transparent}.svc-icon{width:52px;height:52px;margin:auto;border-radius:50%;background:#111312;display:grid;place-items:center;font-size:22px}.svc span{display:block;font-size:12px;margin-top:7px}.promo{margin-top:14px;border-radius:20px;background:linear-gradient(100deg,#083c2d,#0f3b2f 60%,#574c15);padding:17px;min-height:135px;display:flex;align-items:center;justify-content:space-between;gap:15px}.promo h3{margin:0 0 8px}.promo p{margin:0;color:#b8d5ca;font-size:12px}.promo .gift{font-size:48px}.ball{margin-top:14px;background:#2b2d2c;border-radius:20px;padding:17px}.ball b{font-size:14px}.nav{position:fixed;bottom:0;left:0;right:0;background:#111312;border-top:1px solid #272a28;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:50}.nav button{background:none;color:#8f9793;font-size:11px}.nav button.active{color:var(--g)}.nav i{display:block;font-style:normal;font-size:22px;margin-bottom:2px}.title{font-size:27px;margin:10px 0 4px}.sub{color:var(--muted);margin:0 0 20px}.panel{background:#242725;border-radius:20px;padding:17px;margin-top:14px}.formrow{margin:13px 0}.label{font-size:12px;font-weight:850;display:block;margin-bottom:7px}.input,.select,.textarea{width:100%;padding:14px;border:1px solid #444846;border-radius:15px;background:#191b1a;color:#fff;outline:0}.input:focus,.select:focus,.textarea:focus{border-color:var(--g)}.primary{background:var(--g);color:#073629;padding:14px 18px;border-radius:14px;font-weight:950}.secondary{background:#333735;color:#fff;padding:14px 18px;border-radius:14px;font-weight:850}.wide{width:100%}.send-security{background:#242725;border-radius:20px;padding:18px}.send-layout{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}.tag{display:inline-block;background:#173d31;color:#9ce6cc;padding:7px 10px;border-radius:99px;font-size:11px;font-weight:800;margin:5px 4px 0 0}.tx{display:flex;align-items:center;gap:11px;padding:14px 0;border-bottom:1px solid #3a3d3b}.tx:last-child{border-bottom:0}.txicon{width:42px;height:42px;border-radius:13px;background:#303432;display:grid;place-items:center}.txbody{flex:1;min-width:0}.txbody b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txamount{font-weight:900}.credit{color:var(--g)}.debit{color:#ff7980}.data-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.carrier{flex:1;display:flex;align-items:center;gap:8px}.carrier-dot{width:32px;height:32px;border-radius:50%;background:#ffcf00;color:#111;display:grid;place-items:center;font-size:10px;font-weight:1000}.data-tabs{display:flex;gap:28px;overflow:auto;border-bottom:1px solid #3b3e3c;margin:0 -2px}.data-tab{padding:14px 0 12px;color:#9ca39f;background:none;white-space:nowrap}.data-tab.active{color:var(--g);border-bottom:3px solid var(--g)}.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.plan{background:#191b1a;border-radius:15px;min-height:175px;padding:16px 8px 11px;text-align:center;display:flex;flex-direction:column}.plan b{font-size:18px}.plan .dur{color:#aeb5b1;font-size:12px;margin-top:8px}.plan .price{margin-top:7px;font-size:13px}.cash{color:var(--g);font-size:12px;margin-top:auto}.plan .extra{background:#493816;color:#f5c95b;font-size:10px;margin:9px -8px -11px;padding:5px;border-radius:0 0 15px 15px}.service-list{display:grid;gap:10px}.service-item{background:#242725;border-radius:18px;padding:15px;display:flex;align-items:center;gap:13px}.si{width:44px;height:44px;border-radius:13px;background:#111312;display:grid;place-items:center;color:var(--g);font-size:21px}.service-item .arrow{margin-left:auto;color:#b7beb9}.profile-card{display:flex;align-items:center;gap:14px}.profile-card .avatar{width:58px;height:58px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:flex-end;justify-content:center;z-index:100}.modal.open{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:#292b2a;border-radius:25px 25px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sheet h2{margin:0}.close{width:38px;height:38px;border-radius:12px;background:#3a3c3b;color:#fff;font-size:20px}.confirm{background:#303331;border-radius:18px;padding:15px;margin:12px 0}.pinbox{display:flex;justify-content:center;gap:10px;margin:20px 0}.pinbox span{width:15px;height:15px;border-radius:50%;background:#555}.pinbox span.on{background:var(--g)}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.key{height:58px;border-radius:15px;background:#353837;color:#fff;font-size:20px}.camera{height:330px;border-radius:20px;overflow:hidden;background:#0b0d0c;position:relative}.camera video{width:100%;height:100%;object-fit:cover}.scan{position:absolute;inset:35px;border:2px solid var(--g);border-radius:45%;box-shadow:0 0 0 999px rgba(0,0,0,.32)}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(15px);background:#fff;color:#151817;padding:13px 17px;border-radius:14px;box-shadow:0 15px 40px rgba(0,0,0,.3);z-index:200;opacity:0;pointer-events:none;transition:.22s;max-width:90%;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.empty{text-align:center;color:#9ca39f;padding:35px 10px}.searchbar{display:flex;gap:8px}.searchbar .input{flex:1}.pill{padding:8px 10px;border-radius:99px;background:#343735;color:#cbd0cd;font-size:11px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rowbetween{display:flex;justify-content:space-between;align-items:center;gap:10px}.small{font-size:12px;color:var(--muted)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(min-width:761px){.nav{max-width:760px;left:50%;transform:translateX(-50%);border-radius:18px 18px 0 0}.top{padding:0 calc((100vw - 760px)/2 + 18px)}}
@media(max-width:600px){.body{padding-left:14px;padding-right:14px}.send-layout{grid-template-columns:1fr}.plan-grid{grid-template-columns:repeat(3,1fr)}.plan{min-height:175px}.quick4{gap:4px}.qicon{width:52px;height:52px}.service-grid{gap:13px 4px}.promo{min-height:120px}.title{font-size:24px}}
@media(max-width:390px){.plan-grid{grid-template-columns:repeat(2,1fr)}.top{padding:0 11px}.brand{font-size:18px}.balance{font-size:25px}}
</style>

<body>
<div id="root"></div><div id="modal" class="modal"></div><div id="toast" class="toast"></div>
<script>
'use strict';
const KEY='internal_wallet_opay_style_v4';
const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>window.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const now=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{users:[],session:null};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function me(){return db.users.find(x=>x.id===db.session)||null}
function addNotif(u,title,body){u.notifications=u.notifications||[];u.notifications.push({id:uid(),title,body,date:now(),read:false})}
function seed(){if(db.users.length)return;const a={id:uid(),name:'Scott Mormen',username:'admin',email:'admin@wallet.local',phone:'08000000000',nin:'',password:'admin1234',pin:'1234',account:'0100000001',balance:500000000,savings:0,loan:0,tx:[],notifications:[],beneficiaries:[],lockedUntil:0,pinFails:0,showBalance:true,role:'admin',createdAt:now()};const b={id:uid(),name:'Test User',username:'testuser',email:'test@wallet.local',phone:'09133817222',nin:'',password:'test1234',pin:'1234',account:'4547654484',balance:500000000,savings:0,loan:0,tx:[],notifications:[],beneficiaries:[],lockedUntil:0,pinFails:0,showBalance:true,role:'user',createdAt:now()};db.users=[a,b];save()}
seed();
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),2400)}
function openSheet(html){const m=document.getElementById('modal');m.innerHTML='<div class="sheet">'+html+'</div>';m.classList.add('open')}
function closeSheet(){const m=document.getElementById('modal');m.classList.remove('open');m.innerHTML=''}
function shell(active,content){const u=me();document.getElementById('root').innerHTML=`<div class="app"><header class="top"><div class="brand"><div class="logo">IW</div>Internal Wallet</div><div class="topicons"><button class="ib" onclick="searchUsers()">⌕</button><button class="ib" onclick="showNotifications()">♢${(u.notifications||[]).some(n=>!n.read)?'<span class="dot"></span>':''}</button><button class="ib" onclick="go('profile')">◉</button></div></header><main class="body">${content}</main><nav class="nav">${[['home','⌂','Home'],['send','↗','Send'],['history','◷','History'],['services','▦','Services'],['profile','◉','Profile']].map(x=>`<button class="${active===x[0]?'active':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}</nav></div>`}
function home(){const u=me();const unread=(u.notifications||[]).filter(n=>!n.read).length;const recent=(u.tx||[]).slice(-3).reverse();shell('home',`<div class="greet"><div class="avatar">🧑🏽</div><div><b>Hi, ${esc(u.name.split(' ')[0].toLowerCase())} ${esc(u.name.split(' ').slice(1).join(' ').toLowerCase())}</b><div class="small">${esc(u.account)}</div></div></div><section class="balance-card"><div class="balance-main"><div class="available">🛡 Available <button onclick="toggleBalance()" style="background:none;color:inherit">${u.showBalance?'◉':'◌'}</button></div><div class="balance">${u.showBalance?money(u.balance):'₦••••••••'}</div><div class="earned">Earned Today <b>+₦${(u.tx||[]).filter(t=>new Date(t.date).toDateString()===new Date().toDateString()&&t.kind==='credit').reduce((s,t)=>s+Number(t.amount),0).toFixed(2)}</b></div></div><button class="historybar" style="width:100%;border:0" onclick="go('history')"><span>▣ &nbsp; Transaction History</span><span>View All ›</span></button></section><div class="panel" style="margin-top:14px"><div class="rowbetween"><span class="small">Business Service - Today's Sales</span><b class="credit">₦0.00</b><span>›</span></div></div><section class="quick4"><button class="quick" onclick="go('send')"><div class="qicon">●</div><small>To OPay</small></button><button class="quick" onclick="go('send')"><div class="qicon">▥</div><small>To Bank</small></button><button class="quick" onclick="go('savings')"><div class="qicon">▣</div><small>Save</small></button><button class="quick" onclick="go('loans')"><div class="qicon">♧</div><small>Loan</small></button></section><div class="notice"><div class="ni">🪪</div><div class="notice-body"><b>Keep your account information updated</b><span class="small">Click to view more details</span></div><button class="go" onclick="go('profile')">Go</button></div><section class="services"><div class="service-grid">${[['▥','Airtime','service','Airtime'],['▤','Data','data','Data'],['⚽','Betting','service','Betting'],['▣','TV','service','TV Bill'],['▦','Fixed','service','Electricity'],['♧','Loan Center','loans',''],['♢','Invitation','profile',''],['⋮','More','services','']].map(s=>`<button class="svc" onclick="${s[2]==='data'?"go('data')":s[2]==='service'?`serviceSheet('${s[3]}')`:`go('${s[2]}')`}"><div class="svc-icon">${s[0]}</div><span>${s[1]}</span></button>`).join('')}</div></section><section class="promo"><div><h3>🎁 Smart Picks for You</h3><p>Start a target and keep your plans moving.</p></div><button class="go" onclick="go('savings')">Go</button><div class="gift">🎁</div></section><section class="ball"><b>⚽ Awoof Wey No Dey Run Belle!!!</b><div class="small" style="margin-top:7px">Get 10% Off when you deposit ₦300 only</div></section>${recent.length?`<section class="panel"><div class="rowbetween"><h3 style="margin:0">Recent activity</h3><button class="pill" onclick="go('history')">View all</button></div>${recent.map(txHtml).join('')}</section>`:''}`)}
function txHtml(t){return `<div class="tx"><div class="txicon">${t.kind==='credit'?'↓':'↑'}</div><div class="txbody"><b>${esc(t.title)}</b><span class="small">${new Date(t.date).toLocaleString()}</span></div><div class="txamount ${t.kind==='credit'?'credit':'debit'}">${t.kind==='credit'?'+':'-'}${money(t.amount)}</div></div>`}
function go(p){if(!me()){auth();return}({home,send,data,history,services,profile,savings,loans,beneficiaries}[p]||home)()}
function auth(mode='login'){document.getElementById('root').innerHTML=`<div style="min-height:100vh;background:#111512;display:grid;place-items:center;padding:18px"><div class="panel" style="width:min(480px,100%);padding:24px"><div class="brand"><div class="logo">IW</div>Internal Wallet</div><h1 style="margin:22px 0 6px">${mode==='login'?'Welcome back':'Create account'}</h1><p class="sub">${mode==='login'?'Sign in to continue.':'Create a separate internal wallet account.'}</p><form id="authForm">${mode==='register'?'<div class="formrow"><label class="label">Full name</label><input class="input" name="name" required></div><div class="formrow"><label class="label">Username</label><input class="input" name="username" required></div><div class="formrow"><label class="label">Phone / transaction number</label><input class="input" name="phone" required></div><div class="formrow"><label class="label">Email</label><input class="input" name="email" type="email" required></div><div class="formrow"><label class="label">NIN</label><input class="input" name="nin" inputmode="numeric" maxlength="11"></div>':''}<div class="formrow"><label class="label">${mode==='login'?'Email, phone or username':'Password'}</label><input class="input" name="identity" type="${mode==='login'?'text':'password'}" required></div>${mode==='login'?'<div class="formrow"><label class="label">Password</label><input class="input" name="password" type="password" required></div>':'<div class="formrow"><label class="label">Password</label><input class="input" name="password" type="password" minlength="6" required></div><div class="formrow"><label class="label">4-digit transaction PIN</label><input class="input" name="pin" inputmode="numeric" maxlength="4" required></div>'}<button class="primary wide" type="submit">${mode==='login'?'Sign in':'Create account'}</button></form><p class="small" style="text-align:center;margin-top:15px">${mode==='login'?`New here? <button style="background:none;color:var(--g);font-weight:900" onclick="auth('register')">Create account</button>`:`Already have an account? <button style="background:none;color:var(--g);font-weight:900" onclick="auth('login')">Sign in</button>`}</p></div></div>`;document.getElementById('authForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(mode==='login'){const id=String(f.get('identity')).trim().toLowerCase();const u=db.users.find(x=>x.username.toLowerCase()===id||x.email.toLowerCase()===id||x.phone===id);if(!u||u.password!==f.get('password'))return toast('Incorrect login details.');db.session=u.id;save();home()}else{const username=String(f.get('username')).trim().toLowerCase();if(db.users.some(x=>x.username===username||x.email===f.get('email')||x.phone===f.get('phone')))return toast('Account already exists.');const u={id:uid(),name:f.get('name'),username,email:f.get('email'),phone:f.get('phone'),nin:f.get('nin'),password:f.get('password'),pin:String(f.get('pin')),account:'01'+Math.floor(100000000+Math.random()*899999999),balance:500000000,savings:0,loan:0,tx:[],notifications:[],beneficiaries:[],lockedUntil:0,pinFails:0,showBalance:true,role:'user',createdAt:now()};db.users.push(u);db.session=u.id;save();home()}}}
function send(){shell('send',`<h1 class="title">Send money</h1><p class="sub">Transfer internal funds to another wallet account.</p><div class="send-layout"><form class="panel" id="sendForm"><div class="formrow"><label class="label">Recipient account number or username</label><input class="input" name="recipient" placeholder="01... or username" required></div><div class="formrow"><label class="label">Amount</label><input class="input" name="amount" type="number" min="1" placeholder="₦0.00" required></div><div class="formrow"><label class="label">Description</label><input class="input" name="note" placeholder="What is this for?"></div><button class="primary wide" type="submit">Continue</button></form><div class="send-security"><h2 style="margin-top:0">Security</h2><p style="color:var(--muted);line-height:1.5">Transfers are protected by your transaction PIN. Transactions during the protected night window can request face verification.</p><span class="tag">PIN protected</span><span class="tag">NightGuard</span></div></div>`);document.getElementById('sendForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);beginTransfer(String(f.get('recipient')).trim(),Number(f.get('amount')),String(f.get('note')||''))}}
function beginTransfer(rec,amount,note){const s=me();const r=db.users.find(x=>x.account===rec||x.username===rec.replace(/^@/,'').toLowerCase());if(!r)return toast('Recipient not found. Try the account number or username shown in Search.');if(r.id===s.id)return toast('You cannot transfer to yourself.');if(!Number.isFinite(amount)||amount<=0)return toast('Enter a valid amount.');if(amount>s.balance)return toast('Insufficient balance.');openPin(()=>{const hour=new Date().getHours();if(hour<5){faceGate(()=>performTransfer(r,amount,note))}else performTransfer(r,amount,note)})}
function openPin(done){const u=me();if(Date.now()<u.lockedUntil)return toast('Transaction PIN is locked for a short period.');let val='';openSheet(`<div class="sheet-head"><h2>Confirm transaction</h2><button class="close" onclick="closeSheet()">×</button></div><div class="confirm"><div class="small">Enter your 4-digit transaction PIN</div><b style="font-size:18px">${money(0)}</b><div id="pinDots" class="pinbox"><span></span><span></span><span></span><span></span></div></div><div class="keypad">${[1,2,3,4,5,6,7,8,9,'','0','⌫'].map(k=>`<button class="key" ${k===''?'disabled':''} onclick="pinKey('${k}')">${k}</button>`).join('')}</div><button class="secondary wide" style="margin-top:10px" onclick="closeSheet()">Cancel</button>`);window.__pin={val,done};window.pinKey=k=>{const p=window.__pin;if(k==='⌫')p.val=p.val.slice(0,-1);else if(k!==' '&&k!=='')p.val+=k;if(p.val.length>4)p.val=p.val.slice(0,4);document.querySelectorAll('#pinDots span').forEach((d,i)=>d.classList.toggle('on',i<p.val.length));if(p.val.length===4){const u=me();if(p.val!==u.pin){u.pinFails++;if(u.pinFails>=5){u.lockedUntil=Date.now()+15*60*1000;u.pinFails=0;toast('Too many incorrect PIN attempts. Locked for 15 minutes.')}else toast('Incorrect transaction PIN.');save();p.val='';document.querySelectorAll('#pinDots span').forEach(d=>d.classList.remove('on'));return}u.pinFails=0;save();closeSheet();p.done()}}}
function faceGate(done){openSheet(`<div class="sheet-head"><h2>Face verification</h2><button class="close" onclick="closeSheet()">×</button></div><p class="small">NightGuard is active. Position your face inside the guide and tap Verify.</p><div class="camera"><video id="faceVideo" autoplay muted playsinline></video><div class="scan"></div></div><button id="faceBtn" class="primary wide" style="margin-top:12px">Verify face</button><button class="secondary wide" style="margin-top:8px" onclick="closeSheet()">Cancel</button>`);let stream=null;navigator.mediaDevices?.getUserMedia?.({video:true}).then(s=>{stream=s;document.getElementById('faceVideo').srcObject=s}).catch(()=>toast('Camera permission is unavailable.'));document.getElementById('faceBtn').onclick=()=>{stream?.getTracks().forEach(t=>t.stop());closeSheet();toast('Face verification completed.');setTimeout(done,350)}}
function performTransfer(r,amount,note){const s=me();s.balance-=amount;r.balance+=amount;const t={id:uid(),date:now(),title:'Transfer to @'+r.username,amount,kind:'debit',recipient:r.account,note};s.tx.push(t);r.tx.push({id:uid(),date:now(),title:'Transfer from @'+s.username,amount,kind:'credit',sender:s.account,note});addNotif(s,'Transfer completed',`${money(amount)} sent to @${r.username}`);addNotif(r,'Money received',`${money(amount)} received from @${s.username}`);save();toast('Transfer successful.');setTimeout(home,500)}
function data(){shell('services',`<div class="panel"><div class="data-head"><div class="carrier"><div class="carrier-dot">MTN</div><b>0913 3817 222</b></div><button class="pill">⌄</button></div><div class="data-tabs" id="dataTabs">${['HOT','Extra Night','Daily','Weekly','Monthly','Broadband'].map((x,i)=>`<button class="data-tab ${i===0?'active':''}" onclick="dataTab('${x}',this)">${x}</button>`).join('')}</div><div id="plans"></div></div><div class="panel"><h3 style="margin-top:0">Mobile Data Service</h3>${[['USSD enquiry','Check phone balance and more','⌁'],['Data history','View previous internal data orders','◷'],['Saved numbers','Manage data recipients','♙']].map(x=>`<button class="service-item" style="width:100%;border:0;color:#fff" onclick="toast('${x[0]} opened')"><div class="si">${x[2]}</div><div style="text-align:left"><b>${x[0]}</b><div class="small">${x[1]}</div></div><span class="arrow">›</span></button>`).join('')}</div>`);renderPlans('HOT')}
const plans={HOT:[['1GB','1 Day',500,'5','1GB + 1.5mins'],['2.5GB','1 Day',750,'7.5',''],['110MB','1 Day',100,'1',''],['500MB','1 Day',350,'3.5',''],['2.5GB','2 Days',900,'9',''],['500MB','7 Days',500,'5',''],['1GB','7 Days',800,'8',''],['3.5GB','7 Days',1500,'15',''],['2GB','30 Days',1500,'15',''],['7GB','30 Days',3500,'35','Extra Night Data']], 'Extra Night':[['250MB','1 Night',100,'1',''],['1GB','7 Nights',300,'3',''],['2.5GB','7 Nights',600,'6','']],Daily:[['1GB','1 Day',500,'5',''],['2GB','1 Day',750,'7.5','']],Weekly:[['1GB','7 Days',800,'8',''],['3.5GB','7 Days',1500,'15',''],['7GB','7 Days',2500,'25','']],Monthly:[['2GB','30 Days',1500,'15',''],['7GB','30 Days',3500,'35',''],['10GB','30 Days',5000,'50','']],Broadband:[['10GB','30 Days',5000,'50',''],['25GB','30 Days',8000,'80','']]};
function dataTab(x,el){document.querySelectorAll('.data-tab').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderPlans(x)}
function renderPlans(cat){document.getElementById('plans').innerHTML='<div class="plan-grid">'+plans[cat].map(p=>`<button class="plan" onclick="buyData('${p[0]}','${p[1]}',${p[2]})"><b>${p[0]}</b><span class="dur">${p[1]}</span><span class="price">₦${p[2].toLocaleString()}</span><span class="cash">+₦${p[3]} Cashback</span>${p[4]?`<span class="extra">${p[4]} ●</span>`:''}</button>`).join('')+'</div>'}
function buyData(bundle,duration,amount){const u=me();if(amount>u.balance)return toast('Insufficient balance.');openPin(()=>{u.balance-=amount;u.tx.push({id:uid(),date:now(),title:'Data '+bundle,amount,kind:'debit',note:duration+' · 0913 3817 222'});addNotif(u,'Data purchase',`${bundle} ${duration} purchased`);save();toast(`${bundle} data purchase completed.`);setTimeout(data,500)})}
function history(){const u=me();shell('history',`<h1 class="title">Transaction History</h1><p class="sub">Your internal wallet activity.</p><div class="searchbar"><input id="txq" class="input" placeholder="Search transactions"><select id="txf" class="select" style="max-width:120px"><option value="all">All</option><option value="credit">Money in</option><option value="debit">Money out</option></select></div><div class="panel" id="txlist"></div>`);const render=()=>{const q=document.getElementById('txq').value.toLowerCase(),f=document.getElementById('txf').value;const a=(u.tx||[]).slice().reverse().filter(t=>(f==='all'||t.kind===f)&&JSON.stringify(t).toLowerCase().includes(q));document.getElementById('txlist').innerHTML=a.length?a.map(txHtml).join(''):'<div class="empty">No matching transactions.</div>'};txq.oninput=render;txf.onchange=render;render()}
function services(){shell('services',`<h1 class="title">All services</h1><p class="sub">Pay for supported services from your internal balance.</p><div class="service-list">${[['Airtime','Buy airtime for an internal phone number','▥'],['Data','Choose a data plan','▤'],['Betting','Record an internal betting payment','⚽'],['TV Bill','Record a TV bill payment','▣'],['Electricity','Record an electricity payment','▦'],['Education','Record an education payment','🎓'],['Savings','Move money into savings','▣'],['Loans','Request or repay an internal loan','♧'],['Beneficiaries','Manage saved internal recipients','♙']].map(x=>`<button class="service-item" onclick="${x[0]==='Data'?"go('data')":x[0]==='Savings'?"go('savings')":x[0]==='Loans'?"go('loans')":x[0]==='Beneficiaries'?"go('beneficiaries')":`serviceSheet('${x[0]}')`}"><div class="si">${x[2]}</div><div style="text-align:left"><b>${x[0]}</b><div class="small">${x[1]}</div></div><span class="arrow">›</span></button>`).join('')}</div>`)}
function serviceSheet(type){const labels={Airtime:'Phone number',Betting:'Customer ID','TV Bill':'Smartcard number',Electricity:'Meter number',Education:'Student/reference number'};openSheet(`<div class="sheet-head"><h2>${esc(type)}</h2><button class="close" onclick="closeSheet()">×</button></div><div class="formrow"><label class="label">${labels[type]||'Reference'}</label><input id="serviceTarget" class="input" required></div><div class="formrow"><label class="label">Amount</label><input id="serviceAmount" class="input" type="number" min="100" required></div><div class="formrow"><label class="label">Provider</label><select id="serviceProvider" class="select"><option>Default provider</option><option>Provider A</option><option>Provider B</option></select></div><button class="primary wide" onclick="payService('${esc(type)}')">Pay now</button><p class="small" style="margin-top:10px">This records an internal service payment only.</p>`)}
function payService(type){const u=me(),a=Number(document.getElementById('serviceAmount').value),target=document.getElementById('serviceTarget').value.trim();if(!target||a<=0||a>u.balance)return toast('Enter a valid amount and target.');openPin(()=>{u.balance-=a;u.tx.push({id:uid(),date:now(),title:type+' payment',amount:a,kind:'debit',note:target});addNotif(u,'Payment completed',`${money(a)} paid for ${type}`);save();closeSheet();toast(type+' payment completed.');setTimeout(home,500)})}
function savings(){const u=me();shell('services',`<h1 class="title">Savings</h1><p class="sub">Set money aside inside your wallet.</p><div class="panel"><div class="small">Saved balance</div><div class="stat">${money(u.savings)}</div><div class="formrow"><label class="label">Amount</label><input id="saveAmount" class="input" type="number" min="1"></div><div class="two"><button class="primary" onclick="saveMoney('deposit')">Save money</button><button class="secondary" onclick="saveMoney('withdraw')">Withdraw</button></div></div>`)}
function saveMoney(mode){const u=me(),a=Number(document.getElementById('saveAmount').value);if(a<=0)return toast('Enter an amount.');if(mode==='deposit'){if(a>u.balance)return toast('Insufficient balance.');u.balance-=a;u.savings+=a;u.tx.push({id:uid(),date:now(),title:'Savings deposit',amount:a,kind:'debit'})}else{if(a>u.savings)return toast('Insufficient savings.');u.savings-=a;u.balance+=a;u.tx.push({id:uid(),date:now(),title:'Savings withdrawal',amount:a,kind:'credit'})}save();toast('Savings updated.');savings()}
function loans(){const u=me();shell('services',`<h1 class="title">Loan Center</h1><p class="sub">Internal loan simulation.</p><div class="panel"><div class="small">Outstanding loan</div><div class="stat">${money(u.loan)}</div><div class="formrow"><label class="label">Loan amount</label><input id="loanAmount" class="input" type="number" min="1000" placeholder="₦1,000 or more"></div><button class="primary wide" onclick="requestLoan()">Request loan</button>${u.loan?'<button class="secondary wide" style="margin-top:9px" onclick="repayLoan()">Repay loan</button>':''}</div>`)}
function requestLoan(){const u=me(),a=Number(document.getElementById('loanAmount').value);if(a<1000)return toast('Minimum loan is ₦1,000.');u.loan+=a;u.balance+=a;u.tx.push({id:uid(),date:now(),title:'Loan disbursement',amount:a,kind:'credit'});addNotif(u,'Loan approved',`${money(a)} added to your wallet`);save();toast('Loan approved.');loans()}
function repayLoan(){const u=me();openSheet(`<div class="sheet-head"><h2>Repay loan</h2><button class="close" onclick="closeSheet()">×</button></div><div class="formrow"><label class="label">Amount</label><input id="repayAmount" class="input" type="number" max="${Math.min(u.loan,u.balance)}" value="${Math.min(u.loan,u.balance)}"></div><button class="primary wide" onclick="doRepay()">Continue</button>`)}
function doRepay(){const u=me(),a=Number(document.getElementById('repayAmount').value);if(!a||a<=0||a>u.balance||a>u.loan)return toast('Invalid repayment amount.');openPin(()=>{u.balance-=a;u.loan-=a;u.tx.push({id:uid(),date:now(),title:'Loan repayment',amount:a,kind:'debit'});save();closeSheet();toast('Loan repayment completed.');loans()})}
function beneficiaries(){const u=me();shell('profile',`<h1 class="title">Beneficiaries</h1><p class="sub">Saved internal wallet recipients.</p><div class="panel"><button class="primary" onclick="addBeneficiary()">+ Add beneficiary</button>${(u.beneficiaries||[]).length?(u.beneficiaries.map((b,i)=>`<div class="tx"><div class="txicon">♙</div><div class="txbody"><b>${esc(b.name)}</b><span class="small">${esc(b.account)}</span></div><button class="pill" onclick="removeBeneficiary(${i})">Remove</button></div>`).join('')):'<div class="empty">No saved beneficiaries.</div>'}</div>`)}
function addBeneficiary(){openSheet(`<div class="sheet-head"><h2>Add beneficiary</h2><button class="close" onclick="closeSheet()">×</button></div><div class="formrow"><label class="label">Name</label><input id="bn" class="input"></div><div class="formrow"><label class="label">Account number</label><input id="ba" class="input"></div><button class="primary wide" onclick="saveBeneficiary()">Save beneficiary</button>`)}
function saveBeneficiary(){const n=document.getElementById('bn').value.trim(),a=document.getElementById('ba').value.trim(),r=db.users.find(x=>x.account===a);if(!n||!r)return toast('Enter a valid internal wallet account.');me().beneficiaries.push({name:n,account:a});save();closeSheet();toast('Beneficiary saved.');beneficiaries()}
function removeBeneficiary(i){me().beneficiaries.splice(i,1);save();beneficiaries()}
function profile(){const u=me();shell('profile',`<h1 class="title">Profile</h1><p class="sub">Manage your wallet account and security.</p><div class="panel profile-card"><div class="avatar">🧑🏽</div><div><b>@${esc(u.username)}</b><div class="small">${esc(u.name)} · ${esc(u.account)}</div></div></div><div class="panel"><div class="rowbetween"><span>Email</span><b>${esc(u.email)}</b></div><div class="rowbetween" style="margin-top:14px"><span>Phone</span><b>${esc(u.phone)}</b></div><div class="rowbetween" style="margin-top:14px"><span>Saved</span><b>${money(u.savings)}</b></div><div class="rowbetween" style="margin-top:14px"><span>Loan</span><b>${money(u.loan)}</b></div></div><div class="service-list"><button class="service-item" onclick="changePassword()"><div class="si">🔒</div><div style="text-align:left"><b>Change password</b><div class="small">Update your sign-in password</div></div><span class="arrow">›</span></button><button class="service-item" onclick="changePin()"><div class="si">⌘</div><div style="text-align:left"><b>Change transaction PIN</b><div class="small">Update your 4-digit PIN</div></div><span class="arrow">›</span></button><button class="service-item" onclick="beneficiaries()"><div class="si">♙</div><div style="text-align:left"><b>Beneficiaries</b><div class="small">Manage saved recipients</div></div><span class="arrow">›</span></button><button class="service-item" onclick="logout()"><div class="si">↪</div><div style="text-align:left"><b>Sign out</b><div class="small">End this session</div></div><span class="arrow">›</span></button></div>`)}
function changePassword(){openSheet(`<div class="sheet-head"><h2>Change password</h2><button class="close" onclick="closeSheet()">×</button></div><div class="formrow"><label class="label">Current password</label><input id="oldpw" class="input" type="password"></div><div class="formrow"><label class="label">New password</label><input id="newpw" class="input" type="password"></div><button class="primary wide" onclick="savePassword()">Save password</button>`)}
function savePassword(){const u=me();if(document.getElementById('oldpw').value!==u.password)return toast('Current password is incorrect.');const p=document.getElementById('newpw').value;if(p.length<6)return toast('New password must be at least 6 characters.');u.password=p;save();closeSheet();toast('Password changed.')}
function changePin(){openSheet(`<div class="sheet-head"><h2>Change transaction PIN</h2><button class="close" onclick="closeSheet()">×</button></div><div class="formrow"><label class="label">Current PIN</label><input id="oldpin" class="input" inputmode="numeric" maxlength="4"></div><div class="formrow"><label class="label">New 4-digit PIN</label><input id="newpin" class="input" inputmode="numeric" maxlength="4"></div><button class="primary wide" onclick="savePin()">Save PIN</button>`)}
function savePin(){const u=me();if(document.getElementById('oldpin').value!==u.pin)return toast('Current PIN is incorrect.');const p=document.getElementById('newpin').value;if(!/^\d{4}$/.test(p))return toast('PIN must be exactly 4 digits.');u.pin=p;save();closeSheet();toast('Transaction PIN changed.')}
function toggleBalance(){const u=me();u.showBalance=!u.showBalance;save();home()}
function showNotifications(){const u=me();u.notifications.forEach(n=>n.read=true);save();openSheet(`<div class="sheet-head"><h2>Notifications</h2><button class="close" onclick="closeSheet()">×</button></div>${u.notifications.length?u.notifications.slice().reverse().map(n=>`<div class="tx"><div class="txicon">♢</div><div class="txbody"><b>${esc(n.title)}</b><span class="small">${esc(n.body)} · ${new Date(n.date).toLocaleString()}</span></div></div>`).join(''):'<div class="empty">No notifications.</div>'}`)}
function searchUsers(){openSheet(`<div class="sheet-head"><h2>Search wallet</h2><button class="close" onclick="closeSheet()">×</button></div><div class="searchbar"><input id="userq" class="input" placeholder="Username or account number"><button class="primary" onclick="doUserSearch()">Search</button></div><div id="userres" style="margin-top:12px"></div>`)}
function doUserSearch(){const q=document.getElementById('userq').value.trim().toLowerCase().replace(/^@/,'');const a=db.users.filter(u=>u.username.toLowerCase().includes(q)||u.account.includes(q));document.getElementById('userres').innerHTML=a.length?a.map(u=>`<div class="tx"><div class="avatar" style="width:42px;height:42px">🧑🏽</div><div class="txbody"><b>@${esc(u.username)}</b><span class="small">${esc(u.name)} · ${esc(u.account)}</span></div><button class="go" onclick="useRecipient('${u.account}')">Send</button></div>`).join(''):'<div class="empty">No wallet account found.</div>'}
function useRecipient(a){closeSheet();go('send');setTimeout(()=>{const x=document.querySelector('[name=recipient]');if(x)x.value=a},100)}
function logout(){db.session=null;save();auth()}
if(!db.session)auth();else home();
</script>
</body>
</html>
