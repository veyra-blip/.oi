<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121212"><title>VEYRA Bank</title>
<style>
:root{--bg:#121212;--card:#1a1a1a;--card2:#202020;--mint:#00c897;--mint2:#00a982;--yellow:#ffd700;--red:#ef4444;--muted:#9ca3af;--text:#fff;--line:#2b2b2b;--shadow:0 18px 50px #0008}*{box-sizing:border-box}body{margin:0;background:#080808;color:var(--text);font-family:Inter,Roboto,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:84px}.top{padding:18px 18px 10px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:900;letter-spacing:.5px}.mint{color:var(--mint)}.iconbtn{width:42px;height:42px;border:1px solid var(--line);background:var(--card);color:#fff;border-radius:50%;font-size:20px}.page{padding:8px 16px 20px}.h1{font-size:25px;margin:8px 0 4px}.muted{color:var(--muted);font-size:13px}.balance{background:linear-gradient(145deg,#00c897,#00a982);border-radius:24px;padding:20px;margin:10px 0 16px;box-shadow:0 16px 35px #00c89722}.balance .label{font-size:13px;opacity:.85}.balance .amount{font-size:30px;font-weight:900;margin:6px 0}.balance .sub{font-size:12px;opacity:.85}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.action{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:12px 5px;color:#fff;text-align:center}.action b{display:block;font-size:12px;margin-top:6px}.ico{font-size:21px;color:var(--mint)}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.section h3{margin:0;font-size:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:95px}.tile h4{margin:9px 0 4px}.row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row .rbody{flex:1}.row b{display:block}.arr{color:#777;font-size:22px}.btn{border:0;border-radius:14px;padding:13px 16px;width:100%;font-weight:800}.primary{background:var(--mint);color:#00150f}.secondary{background:#2a2a2a;color:#fff}.danger{background:#351719;color:#ffb4b4;border:1px solid #5d2529}.yellow{background:var(--yellow);color:#151000}.field{margin:11px 0}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.field input,.field select{width:100%;padding:13px 14px;background:#222;border:1px solid #333;color:#fff;border-radius:13px;outline:none}.field input:focus{border-color:var(--mint)}.notice{padding:12px;border-radius:14px;background:#14261f;border:1px solid #1e5949;color:#baf8e8;font-size:12px;margin:10px 0}.error{background:#2c1012;border-color:#5b1e22;color:#ffb5b8}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#171717ee;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 5px max(8px,env(safe-area-inset-bottom));z-index:20}.nav{background:none;border:0;color:#777;font-size:10px}.nav span{display:block;font-size:20px;margin-bottom:2px}.nav.active{color:var(--mint)}.modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:min(520px,100%);margin:auto 0 0;background:#181818;border:1px solid #333;border-radius:24px 24px 0 0;padding:18px;max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{font-size:18px;margin:0}.close{border:0;background:#292929;color:#fff;border-radius:50%;width:38px;height:38px}.banklist{max-height:55vh;overflow:auto}.bank{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid #2b2b2b}.banklogo{width:38px;height:38px;border-radius:50%;background:#272727;display:grid;place-items:center;color:var(--mint);font-weight:900}.search{position:sticky;top:0;background:#181818;padding-bottom:10px}.profile{display:flex;gap:14px;align-items:center}.avatar{width:64px;height:64px;border-radius:50%;background:#26352f;display:grid;place-items:center;font-size:25px;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.badge{display:inline-block;background:#29312f;color:var(--mint);border:1px solid #34564d;border-radius:20px;padding:4px 8px;font-size:10px}.promo{background:#243e34;border-radius:20px;padding:17px;position:relative;overflow:hidden}.promo .cta{margin-top:12px;width:auto;padding:10px 18px}.spinner{width:46px;height:46px;border:4px solid #3b3b3b;border-top-color:var(--mint);border-radius:50%;animation:spin 1s linear infinite;margin:16px auto}@keyframes spin{to{transform:rotate(360deg)}}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.keypad button{height:58px;background:#252525;border:1px solid #333;color:#fff;border-radius:14px;font-size:20px}.tx{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #292929}.tx .txi{width:38px;height:38px;border-radius:50%;background:#24352f;display:grid;place-items:center;color:var(--mint)}.credit{color:var(--mint)}.debit{color:#ff8585}.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0,#063c2d,#121212 45%)}.auth{width:min(450px,100%)}.auth .logo{font-size:34px;margin-bottom:3px}.authcard{background:#1a1a1a;border:1px solid #2b2b2b;border-radius:26px;padding:20px;margin-top:18px}.smallbtn{background:none;border:0;color:var(--mint);padding:4px}.hidden{display:none!important}.level{height:8px;background:#303030;border-radius:10px;overflow:hidden}.level>i{display:block;height:100%;background:var(--mint)}
</style></head><body><div id="root"></div><div id="modal" class="modal"></div>
<script>
const API='https://veyra-api-etnq.onrender.com';let token=localStorage.getItem('veyra_token')||'';let me=null;let state={transactions:[],notifications:[],savings:[],cards:[],loans:[]};let selectedBank='';
const banks=['Veyra Bank','Access Bank','ALAT by Wema','Carbon','Citibank Nigeria','Ecobank Nigeria','FCMB','Fidelity Bank','First Bank of Nigeria','Globus Bank','GTBank','Heritage Bank','Jaiz Bank','Keystone Bank','Kuda Bank','Lotus Bank','Moniepoint MFB','Opay','PalmPay','Parallex Bank','Polaris Bank','Premium Trust Bank','Providus Bank','Stanbic IBTC','Sterling Bank','SunTrust Bank','TAJBank','Titan Trust Bank','UBA','Union Bank','Unity Bank','Wema Bank','Zenith Bank'];
function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function money(n){return '₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2})}function id(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}
async function api(path,opt={}){const headers={'Content-Type':'application/json',...(opt.headers||{})};if(token)headers.Authorization='Bearer '+token;let r;try{r=await fetch(API+path,{...opt,headers})}catch(e){throw Error('Cannot reach Veyra server. Check your internet connection or backend deployment.')}let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||d.error||d.code||'Request failed');return d}
function openSheet(html){document.getElementById('modal').innerHTML='<div class="sheet">'+html+'</div>';document.getElementById('modal').classList.add('open')}function closeSheet(){document.getElementById('modal').classList.remove('open')}
function initials(){return ((me?.firstName||'V')+' '+(me?.lastName||'B')).split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function tier(){let t=localStorage.getItem('veyra_tier')||'Basic';return t==='Premium'?{name:t,max:Infinity,daily:40000000000,percent:100}:t==='Verified'?{name:t,max:2000000000,daily:500000000,percent:65}:{name:'Basic',max:500000000,daily:50000000,percent:30}}
function render(){if(!token){renderLogin();return}if(!me){renderLoading();return}renderHome()}
function renderLoading(){document.getElementById('root').innerHTML='<div class="login"><div class="auth"><div class="logo mint">VEYRA</div><div class="muted">Loading your secure wallet…</div></div></div>'}
function renderLogin(){document.getElementById('root').innerHTML=`<div class="login"><div class="auth"><div class="logo mint">VEYRA</div><div class="muted">Your private internal digital bank</div><div class="authcard" id="authbox"><h2>Welcome back</h2><div class="field"><label>Email, phone or username</label><input id="identifier"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn primary" onclick="login()">Log in</button><button class="smallbtn" onclick="showRegister()">Create account</button><button class="smallbtn" onclick="forgot()">Forgot password?</button></div></div></div>`}
function showRegister(){document.getElementById('authbox').innerHTML=`<h2>Create your VEYRA account</h2><div class="field"><label>First name</label><input id="rf"></div><div class="field"><label>Last name</label><input id="rl"></div><div class="field"><label>Username</label><input id="ru"></div><div class="field"><label>Phone number</label><input id="rp" placeholder="08012345678" inputmode="numeric"></div><div class="field"><label>Email</label><input id="re" type="email"></div><div class="field"><label>NIN</label><input id="rn" maxlength="11" inputmode="numeric"></div><div class="field"><label>Password</label><input id="rpass" type="password"></div><div class="field"><label>Transaction PIN</label><input id="rpin" maxlength="4" inputmode="numeric" type="password"></div><div id="regerr"></div><button class="btn primary" onclick="register()">Create & open wallet</button><button class="smallbtn" onclick="renderLogin()">Back to login</button>`}
async function register(){let body={firstName:rf.value.trim(),lastName:rl.value.trim(),username:ru.value.trim(),phone:rp.value.trim(),email:re.value.trim(),nin:rn.value.trim(),password:rpass.value,pin:rpin.value};try{let d=await api('/api/auth/register',{method:'POST',body:JSON.stringify(body)});token=d.token||d.accessToken||'';if(!token){let l=await api('/api/auth/login',{method:'POST',body:JSON.stringify({identifier:body.email,password:body.password})});token=l.token||l.accessToken||''}localStorage.setItem('veyra_token',token);await boot();alert('Account created successfully. Your wallet is ready.')}catch(e){document.getElementById('regerr').innerHTML='<div class="notice error">Check the submitted information.<br>'+esc(e.message)+'</div>'}}
async function login(){try{let d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({identifier:identifier.value.trim(),password:password.value})});token=d.token||d.accessToken;localStorage.setItem('veyra_token',token);await boot()}catch(e){alert(e.message)}}
async function forgot(){openSheet(`<div class="modalhead"><h2>Recover account</h2><button class="close" onclick="closeSheet()">×</button></div><p class="muted">For security, account recovery should use the Veyra backend's recovery flow. Face verification can be used only where your deployed backend exposes it.</p><div class="field"><label>Phone or email</label><input id="fp"></div><button class="btn primary" onclick="alert('Recovery request recorded. Connect the production recovery endpoint to complete password reset.');closeSheet()">Continue</button>`)}
async function boot(){try{let d=await api('/api/me');me=d.user||d.me||d;await loadState();render()}catch(e){localStorage.removeItem('veyra_token');token='';renderLogin();alert(e.message)}}
async function loadState(){try{let [t,n]=await Promise.all([api('/api/transactions'),api('/api/notifications')]);state.transactions=t.transactions||t||[];state.notifications=n.notifications||n||[]}catch{}try{let s=await api('/api/savings');state.savings=s.savings||[]}catch{}try{let c=await api('/api/cards');state.cards=c.cards||[]}catch{}try{let l=await api('/api/loans');state.loans=l.loans||[]}catch{}}
function shell(active,content){document.getElementById('root').innerHTML=`<div class="app"><div class="top"><div class="logo mint">VEYRA</div><div style="display:flex;gap:8px"><button class="iconbtn" onclick="notifications()">♢</button><button class="iconbtn" onclick="page('profile')">${initials()}</button></div></div><main class="page">${content}</main><nav class="bottom">${[['home','⌂','Home'],['rewards','★','Rewards'],['wealth','◈','Wealth'],['cards','▣','Cards'],['profile','●','Me']].map(x=>`<button class="nav ${active===x[0]?'active':''}" onclick="page('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav></div>`}
function renderHome(){let bal=Number(me.wallet?.balance??me.balance??500000000),ti=tier();shell('home',`<h1 class="h1">Good day, ${esc(me.firstName||'User')} 👋</h1><div class="muted">Your VEYRA account</div><div class="balance"><div class="label">Total Balance <button class="smallbtn" onclick="togglePrivacy()">${localStorage.getItem('veyra_hide')==='1'?'Show':'Hide'}</button></div><div class="amount">${localStorage.getItem('veyra_hide')==='1'?'₦ ••••••••':money(bal)}</div><div class="sub">Account ${esc(me.accountNumber||'01XXXXXXXX')}</div><div class="sub" style="margin-top:8px">${ti.name} · Daily transfer ${ti.daily===Infinity?'Unlimited':money(ti.daily)}</div></div><div class="actions">${[['↗','Send','transfer'],['₦','Airtime','airtime'],['▣','Data','data'],['♢','Betting','betting'],['▤','More','services']].map(x=>`<button class="action" onclick="${x[2]==='services'?"page('services')":"quick('"+x[2]+"')"}"><span class="ico">${x[0]}</span><b>${x[1]}</b></button>`).join('')}</div><div class="section"><h3>Quick services</h3><button class="smallbtn" onclick="page('services')">See more</button></div><div class="grid"><div class="tile" onclick="page('loans')"><span class="ico">₦</span><h4>Loans</h4><span class="muted">Borrow from VEYRA</span></div><div class="tile" onclick="page('wealth')"><span class="ico">◈</span><h4>Wealth</h4><span class="muted">Save and grow</span></div><div class="tile" onclick="page('upgrade')"><span class="ico">↑</span><h4>Upgrade</h4><span class="muted">Increase limits</span></div><div class="tile" onclick="page('atm')"><span class="ico">▣</span><h4>Visual ATM</h4><span class="muted">ATM experience</span></div></div><div class="section"><h3>Recent transactions</h3><button class="smallbtn" onclick="page('transactions')">See all</button></div><div class="card">${state.transactions.slice(-4).reverse().map(tx=>txHtml(tx)).join('')||'<div class="muted">No transactions yet.</div>'}</div>`)}
function togglePrivacy(){localStorage.setItem('veyra_hide',localStorage.getItem('veyra_hide')==='1'?'0':'1');renderHome()}
function txHtml(t){let amount=Number(t.amount||0),credit=(t.kind==='credit'||t.type==='CREDIT'||t.type==='INTERNAL_TRANSFER'&&t.receiverId===me.id);return `<div class="tx"><div class="txi">${credit?'↓':'↑'}</div><div style="flex:1"><b>${esc(t.title||t.narration||t.reference||'Transaction')}</b><div class="muted">${esc(t.reference||'')} ${t.createdAt?'· '+new Date(t.createdAt).toLocaleString():''}</div></div><b class="${credit?'credit':'debit'}">${credit?'+':'-'}${money(amount)}</b></div>`}
function page(p){if(p==='home')return renderHome();if(p==='transfer')return transferPage();if(p==='transactions')return transactionsPage();if(p==='services')return servicesPage();if(p==='savings')return savingsPage();if(p==='wealth')return wealthPage();if(p==='cards')return cardsPage();if(p==='profile')return profilePage();if(p==='rewards')return rewardsPage();if(p==='loans')return loansPage();if(p==='upgrade')return upgradePage();if(p==='settings')return settingsPage();if(p==='atm')return atmPage();if(['tv','electricity','education','betting'].includes(p))return genericServicePage(p);}
function transferPage(){shell('home',`<h1 class="h1">Transfer</h1><div class="muted">Send money to a VEYRA account or search any supported Nigerian bank.</div><div class="card" style="margin-top:15px"><div class="section"><h3>To VEYRA account</h3><span class="badge">Instant</span></div><div class="field"><label>Search for VEYRA account</label><input id="vacct" placeholder="Account number / phone / username" oninput="lookupVeyra(this.value)"></div><div id="vresult"></div></div><div class="card"><div class="section"><h3>Other banks</h3><span class="badge">Bank search</span></div><button class="btn secondary" onclick="bankPicker()">Select bank</button><div class="muted" style="margin:9px 0">Selected: ${esc(selectedBank||'None')}</div><div class="field"><label>Account number</label><input id="bacct" maxlength="10" inputmode="numeric"></div><button class="btn secondary" onclick="bankEnquiry()">Search account</button><div id="bresult"></div></div>`)}
let lookupTimer;function lookupVeyra(q){clearTimeout(lookupTimer);let out=document.getElementById('vresult');if(q.trim().length<3){out.innerHTML='';return}out.innerHTML='<div class="notice">Searching Veyra shared database…</div>';lookupTimer=setTimeout(async()=>{try{let d=await api('/api/users/lookup?q='+encodeURIComponent(q));let u=d.recipient;out.innerHTML=`<div class="notice"><b>${esc(u.firstName+' '+u.lastName)}</b><br><span class="muted">@${esc(u.username)} · ${esc(u.accountNumber)} · VEYRA Bank</span><button class="btn primary" style="margin-top:10px" onclick="confirmTransfer('${esc(u.id)}','${esc(u.firstName+' '+u.lastName)}','Veyra Bank','${esc(u.accountNumber)}')">Continue</button></div>`}catch(e){out.innerHTML='<div class="notice error">No active Veyra account found.</div>'}},350)}
function bankPicker(){openSheet(`<div class="modalhead"><h2>Select Bank</h2><button class="close" onclick="closeSheet()">×</button></div><div class="field search"><input id="bankq" placeholder="Search Bank Name" oninput="filterBanks()"></div><div class="banklist" id="banks">${banks.map(b=>bankRow(b)).join('')}</div>`)}function bankRow(b){return `<button class="bank" style="width:100%;background:none;border:0;color:#fff;text-align:left" onclick="selectBank('${esc(b)}')"><span class="banklogo">${esc(b[0])}</span><span>${esc(b)}</span></button>`}function filterBanks(){let q=bankq.value.toLowerCase();banksEl().innerHTML=banks.filter(b=>b.toLowerCase().includes(q)).map(bankRow).join('')||'<div class="muted">No bank found.</div>'}function banksEl(){return document.getElementById('banks')}function selectBank(b){selectedBank=b;closeSheet();transferPage()}
async function bankEnquiry(){let a=document.getElementById('bacct').value.trim();if(!selectedBank||a.length!==10)return alert('Select a bank and enter a 10-digit account number.');let out=document.getElementById('bresult');out.innerHTML='<div class="notice">Checking account…</div>';try{let d=await api('/api/users/lookup?q='+encodeURIComponent(a));let u=d.recipient;out.innerHTML=`<div class="notice"><b>${esc(u.firstName+' '+u.lastName)}</b><br><span class="muted">${esc(selectedBank)} · ${esc(u.accountNumber)}</span><button class="btn primary" style="margin-top:10px" onclick="confirmTransfer('${esc(u.id)}','${esc(u.firstName+' '+u.lastName)}','${esc(selectedBank)}','${esc(u.accountNumber)}')">Continue transfer</button></div>`}catch(e){let name=fakeName(selectedBank,a);out.innerHTML=`<div class="notice"><b>${esc(name)}</b><br><span class="muted">${esc(selectedBank)} · ${esc(a)}</span><br><span class="badge">Simulated name enquiry</span><div class="muted" style="margin-top:8px">This account is not a Veyra user, so no real bank transfer can be credited by this HTML/backend.</div></div>`}}
function fakeName(bank,a){let first=['Chinedu','Adaeze','Emeka','Ngozi','Ifeanyi','Amaka','Daniel','Peace','David','Blessing'],last=['Okafor','Eze','Nwosu','Obi','Agu','Umeh','Opara','Ibrahim'];let n=0;for(let c of (bank+a))n=(n+c.charCodeAt(0))%999;return first[n%first.length]+' '+last[Math.floor(n/7)%last.length]}
function confirmTransfer(recipientId,name,bank,acct){openSheet(`<div class="modalhead"><h2>Transfer to</h2><button class="close" onclick="closeSheet()">×</button></div><div class="spinner"></div><div style="text-align:center"><h3>${esc(name)}</h3><div class="muted">${esc(bank)} · ${esc(acct)}</div></div><div class="field"><label>Amount</label><input id="tam" type="number" min="1" inputmode="decimal"></div><div class="field"><label>Narration</label><input id="tnote" placeholder="Optional"></div><div class="grid"><button class="btn secondary" onclick="closeSheet()">Recheck</button><button class="btn primary" onclick="doTransfer('${esc(recipientId)}','${esc(name)}','${esc(bank)}')">Confirm</button></div>`)}
async function doTransfer(recipientId,name,bank){let amount=Number(tam.value),pin=prompt('Enter your 4-digit transaction PIN');if(pin===null)return;if(!/^\d{4}$/.test(pin))return alert('Transaction PIN must be 4 digits.');let ti=tier();if(amount>ti.daily)return alert('Daily transfer limit exceeded for '+ti.name+'.');try{let d=await api('/api/transfers/internal',{method:'POST',headers:{'Idempotency-Key':id()},body:JSON.stringify({recipientId,amount,narration:tnote.value.trim()||undefined,pin})});closeSheet();await loadState();alert('Transfer successful. '+money(amount)+' sent to '+name+'. The recipient wallet was credited and their VEYRA account received an alert.');renderHome()}catch(e){alert(e.message)}}
function transactionsPage(){shell('home',`<h1 class="h1">Transactions</h1><div class="field"><input id="tq" placeholder="Search transactions" oninput="renderTx()"></div><div class="grid"><button class="btn secondary" onclick="txFilter='all';renderTx()">All</button><button class="btn secondary" onclick="txFilter='credit';renderTx()">Money in</button></div><div id="txout" class="card" style="margin-top:12px"></div>`);window.txFilter='all';renderTx()}function renderTx(){let q=(document.getElementById('tq')?.value||'').toLowerCase();let a=state.transactions.slice().reverse().filter(t=>(txFilter==='all'||t.kind===txFilter)&&JSON.stringify(t).toLowerCase().includes(q));document.getElementById('txout').innerHTML=a.map(txHtml).join('')||'<div class="muted">No matching transactions.</div>'}
function servicesPage(){shell('home',`<h1 class="h1">All Services</h1><div class="muted">Everything in one place.</div><div class="grid" style="margin-top:15px">${[['☎','Airtime','airtime'],['▣','Data','data'],['♢','Betting','betting'],['▤','TV','tv'],['ϟ','Electricity','electricity'],['🎓','Education','education'],['₦','Loans','loans'],['◈','Savings','wealth'],['▣','Cards','cards'],['↑','Upgrade','upgrade'],['▣','ATM','atm'],['⚙','Settings','settings']].map(x=>`<button class="tile" onclick="page('${x[2]}')"><span class="ico">${x[0]}</span><h4>${x[1]}</h4><span class="muted">Open</span></button>`).join('')}</div>`)}
function quick(type){if(type==='airtime')serviceSheet('Airtime','Phone number',['₦500','₦1,000','₦2,000']);else if(type==='data')dataSheet();else if(type==='betting')serviceSheet('Betting','Customer ID',['₦500','₦1,000','₦5,000']);else transferPage()}
function keypadInput(id,k){let e=document.getElementById(id);if(!e)return;if(k==='⌫')e.value=e.value.slice(0,-1);else e.value+=k} function serviceSheet(type,label,presets){openSheet(`<div class="modalhead"><h2>${type}</h2><button class="close" onclick="closeSheet()">×</button></div><div class="field"><label>${label}</label><input id="starget" inputmode="numeric"></div><div class="section"><h3>Quick amounts</h3></div><div class="grid">${presets.map(x=>`<button class="btn secondary" onclick="samt.value='${x.replace('₦','').replace(',','')}'">${x}</button>`).join('')}</div><div class="field"><label>Amount</label><input id="samt" type="number" min="100"></div><div class="keypad">${['1','2','3','4','5','6','7','8','9','00','0','⌫'].map(k=>`<button onclick="keypadInput('samt','${k}')">${k}</button>`).join('')}</div><button class="btn primary" style="margin-top:10px" onclick="payService('${type}')">Continue</button>`)}
function dataSheet(){openSheet(`<div class="modalhead"><h2>Data</h2><button class="close" onclick="closeSheet()">×</button></div><div class="field"><label>Phone number</label><input id="dtphone" inputmode="numeric"></div><div class="grid"><button class="tile" onclick="dataPlan('Daily 100MB',100)"><b>Hot Daily</b><span class="muted">100MB · ₦100</span></button><button class="tile" onclick="dataPlan('Daily 1GB',500)"><b>Hot Daily</b><span class="muted">1GB · ₦500</span></button><button class="tile" onclick="dataPlan('Weekly 5GB',1500)"><b>Weekly</b><span class="muted">5GB · ₦1,500</span></button><button class="tile" onclick="dataPlan('Monthly 10GB',3000)"><b>Monthly</b><span class="muted">10GB · ₦3,000</span></button><button class="tile" onclick="dataPlan('Monthly 20GB',5000)"><b>Monthly</b><span class="muted">20GB · ₦5,000</span></button><button class="tile" onclick="dataPlan('30 Day Unlimited',15000)"><b>Unlimited</b><span class="muted">30 days · ₦15,000</span></button></div>`)}
function dataPlan(name,amount){let phone=dtphone.value.trim();if(phone.length<10)return alert('Enter a valid phone number.');serviceConfirm('Data',phone,amount,name)}
function serviceConfirm(type,target,amount,plan){openSheet(`<div class="modalhead"><h2>Confirm ${type}</h2><button class="close" onclick="closeSheet()">×</button></div><div class="card"><b>${esc(plan||type)}</b><div class="muted">${esc(target)} · ${money(amount)}</div></div><button class="btn primary" onclick="payService('${type}','${esc(target)}',${amount})">Proceed</button>`)}
async function payService(type,targetOverride,amountOverride){let target=targetOverride||document.getElementById('starget')?.value.trim(),amount=amountOverride||Number(document.getElementById('samt')?.value);if(!target||!amount)return alert('Enter the required details and amount.');let pin=prompt('Enter your 4-digit transaction PIN');if(pin===null)return;let map={Airtime:'AIRTIME',Data:'DATA',Betting:'INTERNET',Electricity:'ELECTRICITY',TV:'TV',Education:'EDUCATION'};try{await api('/api/services/payment',{method:'POST',body:JSON.stringify({type:map[type]||'OTHER',target,amount,pin})});await loadState();closeSheet();alert(type+' payment successful.');renderHome()}catch(e){alert(e.message)}}
function savingsPage(){shell('wealth',`<h1 class="h1">Savings</h1><div class="muted">Move money between your available wallet and VEYRA savings.</div><div class="card"><div class="section"><h3>Savings balance</h3><span class="badge">Internal</span></div><b style="font-size:28px">${money(state.savings.reduce((a,x)=>a+Number(x.balance||0),0))}</b><div class="field"><label>Amount</label><input id="saveamt" type="number" min="1" inputmode="decimal"></div><div class="grid"><button class="btn primary" onclick="saveMoney('deposit')">Save money</button><button class="btn secondary" onclick="saveMoney('withdraw')">Withdraw</button></div></div><div class="grid"><div class="tile"><span class="ico">▣</span><h4>SafeBox</h4><span class="muted">Protected savings</span></div><div class="tile"><span class="ico">▤</span><h4>Fixed</h4><span class="muted">Lock funds</span></div></div>`)}
async function saveMoney(mode){let amount=Number(document.getElementById('saveamt')?.value);if(!amount)return alert('Enter an amount.');let accounts=state.savings||[];try{if(mode==='deposit'&&!accounts.length){let d=await api('/api/savings',{method:'POST',body:JSON.stringify({name:'Main Savings',type:'SAFEBOX'})});accounts=[d.savings]}let account=accounts[0];if(!account)return alert('Savings account is unavailable.');let pin=prompt('Enter your 4-digit transaction PIN');if(pin===null)return;await api('/api/savings/'+account.id+'/'+mode,{method:'POST',body:JSON.stringify({amount,pin})});await loadState();alert(mode==='deposit'?'Money saved successfully.':'Money withdrawn successfully.');savingsPage()}catch(e){alert(e.message)}}
function genericServicePage(type){let cfg={tv:['TV','Smartcard number',['₦1,000','₦2,000','₦5,000']],electricity:['Electricity','Meter number',['₦1,000','₦2,000','₦5,000']],education:['Education','Student/reference number',['₦1,000','₦5,000','₦10,000']],betting:['Betting','Customer ID',['₦500','₦1,000','₦5,000']]}[type];shell('home',`<h1 class="h1">${cfg[0]}</h1><div class="muted">Complete the details, choose an amount and confirm with your transaction PIN.</div><div class="card" style="margin-top:15px"><div class="field"><label>${cfg[1]}</label><input id="gTarget" inputmode="numeric"></div><div class="section"><h3>Quick amounts</h3></div><div class="grid">${cfg[2].map(x=>`<button class="btn secondary" onclick="document.getElementById('gAmount').value='${x.replace('₦','').replace(',','')}'">${x}</button>`).join('')}</div><div class="field"><label>Amount</label><input id="gAmount" type="number" min="100" inputmode="decimal"></div><button class="btn primary" onclick="genericPay('${cfg[0]}')">Continue</button></div>`)}
async function genericPay(type){let target=document.getElementById('gTarget').value.trim(),amount=Number(document.getElementById('gAmount').value);if(!target||!amount)return alert('Enter the required details and amount.');let pin=prompt('Enter your 4-digit transaction PIN');if(pin===null)return;let map={TV:'TV',Electricity:'ELECTRICITY',Education:'EDUCATION',Betting:'INTERNET'};try{await api('/api/services/payment',{method:'POST',body:JSON.stringify({type:map[type],target,amount,pin})});await loadState();alert(type+' payment successful.');renderHome()}catch(e){alert(e.message)}}
function wealthPage(){shell('wealth',`<h1 class="h1">Wealth ⚙</h1><div class="balance"><div class="label">Total Balance</div><div class="amount">${localStorage.getItem('veyra_hide')==='1'?'₦ ••••••••':money(me.wallet?.balance??me.balance)}</div><div class="sub">Interest Earned Today · ${money(0)}</div><button class="smallbtn" onclick="openSheet('<h2>Assets Breakdown</h2><p class=muted>Wallet ${money(me.wallet?.balance??me.balance)}</p><button class=btn primary onclick=closeSheet()>Done</button>')">View Assets Breakdown ›</button></div><div class="grid"><div class="tile"><span class="ico">◈</span><h4>OWealth</h4><span class="muted">Grow funds</span></div><div class="tile"><span class="ico">🎯</span><h4>Targets</h4><span class="muted">Save towards goals</span></div><div class="tile"><span class="ico">▣</span><h4>SafeBox <b style="color:red">15%</b></h4><span class="muted">Protected saving</span></div><div class="tile"><span class="ico">▤</span><h4>Fixed</h4><span class="muted">Lock savings</span></div><div class="tile"><span class="ico">₦</span><h4>Spend & Save</h4><span class="muted">Automatic saving</span></div><div class="tile" onclick="page('upgrade')"><span class="ico">↑</span><h4>Upgrade</h4><span class="muted">Higher limits</span></div></div><div class="promo" style="margin-top:12px"><h2>Christmas Savings Target</h2><p class="muted">Create a target and build it gradually.</p><button class="btn yellow cta" onclick="openSheet('<h2>Start Saving</h2><div class=field><label>Target amount</label><input id=targetamt type=number></div><button class=btn primary onclick=alert(\'Target created in this simulation.\');closeSheet()>Start</button>')">Start Saving</button></div>`)}
function loansPage(){shell('home',`<h1 class="h1">Loans</h1><div class="muted">Request funds, view active loans and repay them.</div><div class="card"><h3>How much do you need?</h3><div class="field"><label>Amount</label><input id="loanamt" type="number" min="1" placeholder="₦1,000,000"></div><div class="field"><label>Tenor</label><select id="loanten"><option>30 days</option><option>90 days</option><option>180 days</option><option>365 days</option></select></div><button class="btn primary" onclick="applyLoan()">Apply for loan</button><div class="notice">Loan approval and maximum amount are controlled by the deployed backend. This UI does not invent an approval.</div></div><div class="section"><h3>My loans</h3></div><div class="card">${state.loans.map(l=>`<div class="row"><div class="rbody"><b>${money(l.amount||l.principal)}</b><span class="muted">${esc(l.status||'ACTIVE')}</span></div><button class="btn secondary" style="width:auto" onclick="repayLoan('${esc(l.id)}')">Repay</button></div>`).join('')||'<div class="muted">No active loans.</div>'}</div>`)}
async function applyLoan(){let amount=Number(loanamt.value);if(!amount)return alert('Enter a loan amount.');let pin=prompt('Enter your 4-digit transaction PIN');if(pin===null)return;try{let d=await api('/api/loans',{method:'POST',body:JSON.stringify({amount,durationMonths:12,pin})});await loadState();alert('Loan application submitted. '+(d.loan?.status||''));loansPage()}catch(e){alert(e.message)}}async function repayLoan(id){let a=prompt('Enter repayment amount');if(!a)return;let pin=prompt('Enter your 4-digit transaction PIN');if(pin===null)return;try{await api('/api/loans/'+id+'/repay',{method:'POST',body:JSON.stringify({amount:Number(a),pin})});await loadState();loansPage()}catch(e){alert(e.message)}}
function cardsPage(){shell('cards',`<h1 class="h1">Cards</h1><div class="muted">Virtual and physical card area.</div><div class="card" style="background:linear-gradient(135deg,#1d3b34,#0c1714);min-height:190px"><span class="badge">VEYRA VIRTUAL</span><div style="margin-top:65px;font-size:20px;letter-spacing:3px">•••• •••• •••• ${state.cards[0]?.last4||'0000'}</div><div class="muted">${esc(me.firstName||'VEYRA USER')}</div></div><div class="grid"><button class="btn primary" onclick="createCard()">Create virtual card</button><button class="btn secondary" onclick="alert('Physical card ordering is not connected to a card issuer.')">Physical card</button></div><div class="card" style="margin-top:12px"><h3>Application tracker</h3><p class="muted">1. Identity ✓</p><p class="muted">2. Security ✓</p><p class="muted">3. Card setup</p><button class="btn primary" onclick="createCard()">Continue to apply</button></div>`)}async function createCard(){try{let d=await api('/api/cards',{method:'POST',body:'{}'});await loadState();alert('Virtual card created. Card ending '+d.card.last4);cardsPage()}catch(e){alert(e.message)}}
function upgradePage(){let t=tier();shell('home',`<h1 class="h1">Account Upgrade</h1><div class="muted">Increase your balance and transfer limits.</div>${[['Basic','₦500,000,000','₦50,000,000'],['Verified','₦2,000,000,000','₦500,000,000'],['Premium','Unlimited','₦40,000,000,000']].map((x,i)=>`<div class="card"><div class="section"><h3>${x[0]}</h3><span class="badge">${t.name===x[0]?'Current':'Tier '+(i+1)}</span></div><p class="muted">Maximum account balance</p><b>${x[1]}</b><p class="muted" style="margin-top:10px">Daily outgoing transfer</p><b>${x[2]}</b>${t.name!==x[0]?`<button class="btn ${i===2?'yellow':'primary'}" style="margin-top:12px" onclick="upgrade('${x[0]}')">Upgrade to ${x[0]}</button>`:''}</div>`).join('')}<div class="notice">Upgrade level is stored locally in this prototype until the backend adds a persistent account-tier field. Transfer limits are enforced by this frontend for the selected tier.</div>`)}function upgrade(t){localStorage.setItem('veyra_tier',t);alert('Account upgraded to '+t+' in this simulation.');upgradePage()}
function profilePage(){let t=tier();shell('profile',`<div class="profile"><div class="avatar" id="avatar">${localStorage.getItem('veyra_photo_'+me.id)?`<img src="${localStorage.getItem('veyra_photo_'+me.id)}">`:initials()}</div><div><h2 style="margin:0">${esc(me.firstName+' '+me.lastName)}</h2><div class="muted">@${esc(me.username||'username')}</div><span class="badge">${t.name}</span></div></div><div class="card" style="margin-top:14px"><div class="section"><h3>Account overview</h3><button class="smallbtn" onclick="page('upgrade')">Upgrade</button></div><p class="muted">Total Balance</p><b style="font-size:22px">${money(me.wallet?.balance??me.balance)}</b><p class="muted">Account number</p><b>${esc(me.accountNumber||'')}</b></div><div class="grid"><button class="tile" onclick="page('transactions')"><span class="ico">≡</span><h4>Transactions</h4></button><button class="tile" onclick="page('upgrade')"><span class="ico">↑</span><h4>Account Limits</h4></button><button class="tile" onclick="fingerprint()"><span class="ico">☝</span><h4>Security Center</h4></button></div><div class="card" style="margin-top:10px"><div class="row" onclick="photoSheet()"><span class="ico">◉</span><div class="rbody"><b>Profile photo</b><span class="muted">Change or capture your photo</span></div><span class="arr">›</span></div><div class="row"><span class="ico">▣</span><div class="rbody"><b>Phone</b><span class="muted">${esc(me.phone||'')}</span></div></div><div class="row"><span class="ico">✉</span><div class="rbody"><b>Email</b><span class="muted">${esc(me.email||'')}</span></div></div><div class="row"><span class="ico">◎</span><div class="rbody"><b>Transaction PIN</b><span class="muted">Protected PIN required for transfers and services</span></div><span class="arr">›</span></div><div class="row" onclick="page('settings')"><span class="ico">⚙</span><div class="rbody"><b>Settings</b><span class="muted">Security, alerts and preferences</span></div><span class="arr">›</span></div></div><button class="btn danger" onclick="logout()">Sign Out</button>`)}
function photoSheet(){openSheet(`<div class="modalhead"><h2>Profile photo</h2><button class="close" onclick="closeSheet()">×</button></div><input id="photoFile" type="file" accept="image/*" capture="user" onchange="previewPhoto(event)"><img id="photoPreview" style="width:100%;max-height:280px;object-fit:contain;border-radius:18px;margin-top:10px;display:none"><button class="btn primary" style="margin-top:10px" onclick="savePhoto()">Save photo</button>`)}function previewPhoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{document.getElementById('photoPreview').src=r.result;document.getElementById('photoPreview').style.display='block';window.photoData=r.result};r.readAsDataURL(f)}function savePhoto(){if(window.photoData)localStorage.setItem('veyra_photo_'+me.id,window.photoData);closeSheet();profilePage()}
function settingsPage(){shell('profile',`<h1 class="h1">Settings</h1><div class="card"><div class="row" onclick="changePassword()"><span class="ico">🔒</span><div class="rbody"><b>Password</b><span class="muted">Change login password</span></div><span class="arr">›</span></div><div class="row" onclick="changePin()"><span class="ico">#</span><div class="rbody"><b>Transaction PIN</b><span class="muted">Change the PIN used for payments and transfers</span></div><span class="arr">›</span></div><div class="row" onclick="fingerprint()"><span class="ico">☝</span><div class="rbody"><b>Fingerprint / device biometric</b><span class="muted">Use your phone's secure biometric prompt</span></div><span class="arr">›</span></div><div class="row" onclick="face()"><span class="ico">◉</span><div class="rbody"><b>Face verification</b><span class="muted">Camera-based Veyra verification where backend support exists</span></div><span class="arr">›</span></div></div><div class="card"><div class="row"><span class="ico">●</span><div class="rbody"><b>Hide balance</b><span class="muted">Keep amounts private on screen</span></div><button class="btn secondary" style="width:auto" onclick="togglePrivacy();settingsPage()">${localStorage.getItem('veyra_hide')==='1'?'ON':'OFF'}</button></div><div class="row"><span class="ico">♢</span><div class="rbody"><b>Notifications</b><span class="muted">Transfer alerts remain enabled</span></div></div></div>`)}async function changePassword(){let p=prompt('New password');if(!p)return;try{await api('/api/security/password',{method:'POST',body:JSON.stringify({currentPassword:prompt('Current password')||'',newPassword:p})});alert('Password changed.')}catch(e){alert(e.message)}}async function changePin(){let p=prompt('New 4-digit transaction PIN');if(!p||!/\d{4}/.test(p))return alert('PIN must be 4 digits.');try{await api('/api/security/pin',{method:'POST',body:JSON.stringify({currentPin:prompt('Current 4-digit PIN')||'',newPin:p})});alert('Transaction PIN changed.')}catch(e){alert(e.message)}}
async function fingerprint(){try{if(!window.PublicKeyCredential)return alert('This browser does not support WebAuthn.');let ok=await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();if(!ok)return alert('No phone biometric authenticator is available.');let cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Veyra Bank',id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:me.username||me.email,displayName:me.firstName+' '+me.lastName},pubKeyCredParams:[{type:'public-key',alg:-7}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});if(cred){localStorage.setItem('veyra_bio_'+me.id,'1');alert('Phone biometric authentication is enabled on this device.')}}catch(e){alert('Biometric setup was cancelled or unavailable.')}}
function face(){openSheet(`<div class="modalhead"><h2>Face verification</h2><button class="close" onclick="closeSheet()">×</button></div><video id="facevideo" autoplay playsinline style="width:100%;border-radius:18px;background:#000"></video><p class="muted">Camera verification is only a simulation unless your backend performs real template matching.</p><button class="btn primary" onclick="startFace()">Open camera</button><button class="btn secondary" style="margin-top:8px" onclick="closeSheet()">Done</button>`)}async function startFace(){try{facevideo.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}})}catch(e){alert('Camera permission is required.')}}
function rewardsPage(){shell('rewards',`<h1 class="h1">Rewards</h1><div class="promo"><div class="badge">REFER & EARN</div><h1>₦6,300</h1><p>Invite friends who transact and receive rewards.</p><button class="btn yellow cta" onclick="navigator.clipboard?.writeText(me.username||me.accountNumber);alert('Referral code copied.')">Copy Code</button></div><div class="card" style="margin-top:12px"><div class="row"><span class="ico">1</span><div class="rbody"><b>Share</b><span class="muted">Invite a friend</span></div></div><div class="row"><span class="ico">2</span><div class="rbody"><b>Friend transacts</b><span class="muted">Qualifying activity</span></div></div><div class="row"><span class="ico">3</span><div class="rbody"><b>Receive rewards</b><span class="muted">Rewards are simulated</span></div></div></div>`)}
function atmPage(){shell('home',`<h1 class="h1">VEYRA ATM</h1><div class="card" style="background:#050505;border-color:#17372d;text-align:center;padding:28px"><div class="mint">VEYRA ATM</div><div style="font-size:28px;margin:20px 0">${localStorage.getItem('veyra_hide')==='1'?'••••••••':money(me.wallet?.balance??me.balance)}</div><span class="badge">READY</span></div><div class="grid"><button class="tile" onclick="atm('Withdraw')"><span class="ico">↓</span><h4>Cash withdrawal</h4></button><button class="tile" onclick="atm('Balance')"><span class="ico">₦</span><h4>Balance</h4></button><button class="tile" onclick="page('transfer')"><span class="ico">↗</span><h4>Transfer</h4></button><button class="tile" onclick="page('cards')"><span class="ico">▣</span><h4>Card menu</h4></button></div><div class="notice">The visual ATM does not dispense physical cash. It is an internal simulation.</div>`)}function atm(a){if(a==='Balance')alert('Available balance: '+money(me.wallet?.balance??me.balance));else if(a==='Withdraw')openSheet('<h2>Cash withdrawal</h2><div class=field><label>Amount</label><input id=wa type=number></div><button class=btn primary onclick="alert(\'Physical ATM withdrawal is not connected.\');closeSheet()">Continue</button>')}
function notifications(){let ns=state.notifications||[];openSheet(`<div class="modalhead"><h2>Notifications</h2><button class="close" onclick="closeSheet()">×</button></div>${ns.slice().reverse().map(n=>`<div class="tx"><div class="txi">♢</div><div><b>${esc(n.title)}</b><div class="muted">${esc(n.message)}</div></div></div>`).join('')||'<div class="muted">No notifications.</div>'}`);api('/api/notifications/read-all',{method:'POST'}).catch(()=>{})}
function logout(){localStorage.removeItem('veyra_token');token='';me=null;renderLogin()}
(async()=>{if(token)await boot();else renderLogin()})();
</script></body></html>
