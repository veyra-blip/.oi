<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00b96b">
<title>Internal Wallet</title>
<style>
:root{--green:#00b96b;--green2:#00d982;--dark:#07130e;--bg:#f5f7f6;--card:#fff;--text:#101814;--muted:#718078;--line:#e6ece8;--danger:#e5484d;--amber:#d88b00;--shadow:0 14px 40px rgba(8,28,18,.08);--radius:20px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px}.brandmark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--green),#087c50);display:grid;place-items:center;color:#fff;font-weight:1000}.top-actions{display:flex;gap:9px;align-items:center}.iconbtn{width:42px;height:42px;border-radius:13px;background:#f1f5f2;color:#23332b}.badge{position:absolute;background:var(--danger);color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:9px;display:grid;place-items:center;margin:-48px 0 0 25px;border:2px solid #fff}.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 72px)}.side{background:#fff;border-right:1px solid var(--line);padding:20px 13px;position:sticky;top:72px;height:calc(100vh - 72px)}.navbtn{width:100%;padding:13px 14px;margin:3px 0;background:transparent;border-radius:14px;text-align:left;color:#5c6b63;font-weight:700}.navbtn.active,.navbtn:hover{background:#e9faf2;color:#078c55}.main{padding:25px;max-width:1450px;width:100%;margin:auto}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(135deg,#061d13,#0a5b3d);color:#fff;border-radius:27px;padding:28px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(0,217,130,.13);right:-100px;top:-110px}.hero-row{display:flex;justify-content:space-between;gap:20px;align-items:center;position:relative;z-index:1}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:#94e8c1;font-weight:900}.balance{font-size:39px;font-weight:950;letter-spacing:-1px;margin:7px 0}.muted{color:var(--muted)}.hero .muted{color:#b8d2c6}.quick{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border-radius:13px;padding:12px 16px;font-weight:850}.btn.primary{background:var(--green);color:#fff}.btn.light{background:#fff;color:#073f29}.btn.soft{background:#edf7f2;color:#087a4d}.btn.danger{background:#ffecee;color:#bd2c35}.btn.outline{background:transparent;border:1px solid var(--line);color:var(--text)}.grid{display:grid;gap:17px}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}.section{margin-top:23px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 8px 25px rgba(8,28,18,.035)}.card h3{margin:0 0 7px}.service{min-height:120px;display:flex;flex-direction:column;justify-content:space-between}.service-icon{width:44px;height:44px;border-radius:14px;background:#eafaf2;display:grid;place-items:center;color:#078c55;font-weight:950;font-size:19px}.service:hover{transform:translateY(-2px);box-shadow:var(--shadow);transition:.2s}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:24px;margin:0 0 6px}.subtitle{color:var(--muted);margin:0 0 18px}.list{display:flex;flex-direction:column}.tx{padding:14px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.tx:last-child{border-bottom:0}.txicon{width:42px;height:42px;border-radius:13px;background:#eef6f1;display:grid;place-items:center;font-weight:900}.txbody{flex:1;min-width:0}.txbody strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.amount{font-weight:900}.credit{color:#078c55}.debit{color:#c43a42}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef5f1;color:#547066;font-size:11px;font-weight:800}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #dbe5df;background:#fff;border-radius:13px;padding:13px 14px;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:#61d9a5;box-shadow:0 0 0 4px #e6faf1}.actions{display:flex;gap:9px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:rgba(2,12,8,.57);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.open{display:flex}.modalbox{background:#fff;width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:24px;padding:23px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:#f1f4f2;border-radius:10px;width:36px;height:36px}.auth{min-height:100vh;background:radial-gradient(circle at 80% 20%,#0b7c51 0,#07130e 42%,#030907 100%);display:grid;place-items:center;padding:18px}.authbox{width:min(520px,100%);background:#fff;border-radius:28px;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.35)}.authbrand{display:flex;align-items:center;gap:12px;margin-bottom:20px}.authbrand .brandmark{width:45px;height:45px}.authbox h1{margin:0 0 6px}.switch{text-align:center;color:var(--muted);margin-top:15px}.link{color:#008a52;font-weight:850;cursor:pointer}.notice{padding:12px 14px;border-radius:13px;background:#eef8f3;color:#17603f;font-size:13px;margin:12px 0}.error{background:#fff0f1;color:#b82e36}.search{display:flex;gap:9px;margin-bottom:15px}.search input{flex:1}.camera{background:#07130e;border-radius:18px;min-height:250px;overflow:hidden;position:relative}.camera video{width:100%;height:300px;object-fit:cover}.camera .scan{position:absolute;inset:25px;border:2px solid #55f0aa;border-radius:45%;box-shadow:0 0 0 999px rgba(0,0,0,.3)}.stat{font-size:25px;font-weight:950}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}.mobile-nav{display:none}.empty{text-align:center;padding:40px 15px;color:var(--muted)}.footer-note{text-align:center;color:#84918b;font-size:12px;padding:30px}.danger-text{color:var(--danger)}
@media(max-width:1000px){.grid4{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.side{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:50;justify-content:space-around;padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.mobile-nav button{background:none;color:#6a7870;font-size:10px;font-weight:800}.mobile-nav button.active{color:#008b55}.mobile-nav span{display:block;font-size:20px;margin-bottom:2px}.main{padding:17px;padding-bottom:90px}.hero-row{display:block}.topbar{padding:0 13px}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.grid4,.grid3,.grid2{grid-template-columns:1fr 1fr}.balance{font-size:31px}.hero{padding:20px}.card{padding:16px}.grid3 .card:last-child{grid-column:span 2}.top-actions .hide-mobile{display:none}.title{font-size:21px}.service{min-height:105px}.quick .btn{flex:1}.authbox{padding:21px}.table th:nth-child(3),.table td:nth-child(3){display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
const KEY='internal_wallet_v3';
const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const now=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{users:[],session:null};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function current(){return db.users.find(u=>u.id===db.session)||null}
function seed(){if(db.users.length)return;const admin={id:uid(),name:'System User',username:'admin',email:'admin@wallet.local',phone:'08000000000',password:'admin1234',pin:'1234',nin:'',account:'0100000001',balance:50000000000,createdAt:now(),role:'admin',showBalance:true,notifications:[],tx:[],savings:0,card:null,loan:0,beneficiaries:[],lockedUntil:0,pinFails:0};db.users.push(admin);save()}
seed();
const root=document.getElementById('root');
function authView(mode='login'){root.innerHTML=`<div class="auth"><div class="authbox"><div class="authbrand"><div class="brandmark">IW</div><div><b>Internal Wallet</b><div class="muted">Secure internal payments</div></div></div><h1>${mode==='login'?'Welcome back':'Create your account'}</h1><p class="muted">${mode==='login'?'Sign in to continue.':'Set up your personal wallet account.'}</p><div id="authmsg"></div><form id="authform">${mode==='register'?`<div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Username</label><input name="username" pattern="[A-Za-z0-9_]{3,20}" required></div><div class="field"><label>Phone / transaction number</label><input name="phone" inputmode="tel" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>NIN</label><input name="nin" inputmode="numeric" minlength="11" maxlength="11"></div><div class="field"><label>Password</label><input name="password" type="password" minlength="6" required></div><div class="field"><label>Transaction PIN</label><input name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div>`:`<div class="field"><label>Email, username or phone</label><input name="identity" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div>`}<button class="btn primary" style="width:100%">${mode==='login'?'Sign in':'Create account'}</button></form><div class="switch">${mode==='login'?`New here? <span class="link" id="reg">Create account</span><br><span class="link" id="forgot">Forgot password?</span>`:`Already have an account? <span class="link" id="login">Sign in</span>`}</div><div class="notice" style="margin-top:18px">All funds and transfers in this build are internal wallet transactions. No real bank money is moved.</div></div></div>`;
 document.getElementById('authform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(mode==='register')register(f);else login(f)};
 document.getElementById(mode==='login'?'reg':'login')?.addEventListener('click',()=>authView(mode==='login'?'register':'login'));
 document.getElementById('forgot')?.addEventListener('click',forgot);
}
function msg(t,err=false){document.getElementById('authmsg').innerHTML=`<div class="notice ${err?'error':''}">${esc(t)}</div>`}
function register(f){const username=String(f.get('username')).trim().toLowerCase(),email=String(f.get('email')).trim().toLowerCase(),phone=String(f.get('phone')).trim();if(db.users.some(u=>u.username===username||u.email===email||u.phone===phone))return msg('That username, email or phone is already registered.',true);const u={id:uid(),name:String(f.get('name')).trim(),username,email,phone,nin:String(f.get('nin')||''),password:String(f.get('password')),pin:String(f.get('pin')),account:'01'+Math.floor(100000000+Math.random()*899999999),balance:50000000000,createdAt:now(),role:'user',showBalance:true,notifications:[],tx:[],savings:0,card:null,loan:0,beneficiaries:[],lockedUntil:0,pinFails:0};db.users.push(u);db.session=u.id;save();app()}
function login(f){const id=String(f.get('identity')).trim().toLowerCase(),p=String(f.get('password'));const u=db.users.find(x=>x.username===id||x.email===id||x.phone===id);if(!u||u.password!==p)return msg('Invalid login details.',true);db.session=u.id;save();app()}
function forgot(){const identity=prompt('Enter your email, username or phone');if(!identity)return;const u=db.users.find(x=>[x.email,x.username,x.phone].includes(identity.trim().toLowerCase()));if(!u)return alert('Account not found.');const code=String(Math.floor(100000+Math.random()*900000));prompt('Your reset code is '+code+'. Enter it to continue:');const entered=prompt('Enter reset code');if(entered!==code)return alert('Incorrect code.');const p=prompt('Enter a new password');if(!p||p.length<6)return alert('Password must be at least 6 characters.');u.password=p;save();alert('Password changed successfully.')}
function app(){if(!current())return authView();renderShell();go('home')}
function renderShell(){const u=current();root.innerHTML=`<div class="app"><header class="topbar"><div class="brand"><div class="brandmark">IW</div>Internal Wallet</div><div class="top-actions"><button class="iconbtn" id="searchBtn">⌕</button><button class="iconbtn" id="notifBtn" style="position:relative">♢<span class="badge" id="nb">${u.notifications.filter(n=>!n.read).length||''}</span></button><button class="iconbtn" id="profileBtn">◉</button></div></header><div class="layout"><aside class="side">${navHtml()}<div style="position:absolute;bottom:20px;left:13px;right:13px"><button class="navbtn" id="logout">⇥ Sign out</button></div></aside><main class="main"><div id="pages"></div><div class="footer-note">Internal Wallet · Internal transactions only</div></main></div><nav class="mobile-nav">${[['home','⌂','Home'],['send','↗','Send'],['history','◷','History'],['services','▦','Services'],['profile','◉','Profile']].map(x=>`<button data-nav="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav></div><div id="modal" class="modal"></div>`;
 document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));document.getElementById('logout').onclick=()=>{db.session=null;save();authView()};document.getElementById('searchBtn').onclick=searchModal;document.getElementById('notifBtn').onclick=notifications;document.getElementById('profileBtn').onclick=()=>go('profile')}
function navHtml(){return [['home','⌂','Home'],['send','↗','Send money'],['history','◷','Transactions'],['services','▦','Services'],['savings','▣','Savings'],['cards','▤','Cards'],['loans','₦','Loans'],['beneficiaries','♙','Beneficiaries'],['profile','◉','Profile'],['settings','⚙','Settings']].map(x=>`<button class="navbtn" data-nav="${x[0]}">${x[1]} &nbsp; ${x[2]}</button>`).join('')}
function go(page){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));const pages=document.getElementById('pages');if(!pages)return;pages.innerHTML=pageHtml(page);const el=document.getElementById('page-'+page);el?.classList.add('active');document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));bindPage(page);window.scrollTo({top:0,behavior:'smooth'})}
function pageHtml(page){const u=current();if(page==='home')return homeHtml(u);if(page==='send')return `<section class="page active" id="page-send"><h1 class="title">Send money</h1><p class="subtitle">Transfer internal funds to another wallet account.</p><div class="grid grid2"><div class="card"><form id="sendForm"><div class="field"><label>Recipient account number or username</label><input name="recipient" required placeholder="01... or username"></div><div class="field"><label>Amount</label><input name="amount" type="number" min="1" step="0.01" required></div><div class="field"><label>Description</label><input name="note" maxlength="80" placeholder="What is this for?"></div><button class="btn primary">Continue</button></form></div><div class="card"><h3>Security</h3><p class="muted">Transfers may request your transaction PIN. Transactions made during the protected night window may also require face verification.</p><span class="tag">PIN protected</span> <span class="tag">NightGuard</span></div></div></section>`;if(page==='history')return historyHtml(u);if(page==='services')return servicesHtml();if(page==='savings')return savingsHtml(u);if(page==='cards')return cardsHtml(u);if(page==='loans')return loansHtml(u);if(page==='beneficiaries')return beneficiariesHtml(u);if(page==='profile')return profileHtml(u);if(page==='settings')return settingsHtml(u);return ''}
function homeHtml(u){const balance=u.showBalance?money(u.balance):'••••••••';const tx=u.tx.slice().reverse().slice(0,6);return `<section class="page active" id="page-home"><div class="hero"><div class="hero-row"><div><div class="eyebrow">Available balance</div><div class="balance" id="dashBalance">${balance}</div><div class="muted">Account ${esc(u.account)}</div><div class="quick"><button class="btn light" onclick="go('send')">Send money</button><button class="btn" style="background:#164f3a;color:#fff" onclick="serviceModal('Airtime')">Buy airtime</button><button class="btn" style="background:#164f3a;color:#fff" onclick="serviceModal('Data')">Buy data</button></div></div><button class="btn" style="background:rgba(255,255,255,.12);color:#fff" onclick="toggleBalance()">${u.showBalance?'Hide':'Show'} balance</button></div></div><div class="section"><div class="row"><div><h2 class="title">Quick services</h2><p class="subtitle">Everything you need in one place.</p></div><button class="btn soft" onclick="go('services')">View all</button></div><div class="grid grid4">${[['Airtime','☎'],['Data','◉'],['Electricity','ϟ'],['TV Bill','▣'],['Education','▤'],['Betting','♢'],['Savings','▣'],['Loans','₦']].map(s=>`<div class="card service" onclick="${['Savings','Loans'].includes(s[0])?`go('${s[0].toLowerCase()}')`:`serviceModal('${s[0]}')`}"><div class="service-icon">${s[1]}</div><div><b>${s[0]}</b><div class="muted" style="font-size:12px">Open service</div></div></div>`).join('')}</div></div><div class="section grid grid2"><div class="card"><div class="row"><h3>Recent transactions</h3><button class="btn soft" onclick="go('history')">See all</button></div>${tx.length?tx.map(txHtml).join(''):'<div class="empty">No transactions yet.</div>'}</div><div class="card"><h3>Your account</h3><div class="row" style="margin:14px 0"><span class="muted">Username</span><b>@${esc(u.username)}</b></div><div class="row" style="margin:14px 0"><span class="muted">Full name</span><b>${esc(u.name)}</b></div><div class="row" style="margin:14px 0"><span class="muted">Savings</span><b>${money(u.savings)}</b></div><div class="row"><span class="muted">Role</span><span class="tag">${esc(u.role)}</span></div></div></div></section>`}
function txHtml(t){return `<div class="tx"><div class="txicon">${t.kind==='credit'?'↓':'↑'}</div><div class="txbody"><strong>${esc(t.title)}</strong><span class="muted" style="font-size:12px">${new Date(t.date).toLocaleString()}</span></div><div class="amount ${t.kind==='credit'?'credit':'debit'}">${t.kind==='credit'?'+':'-'}${money(t.amount)}</div></div>`}
function historyHtml(u){return `<section class="page" id="page-history"><h1 class="title">Transactions</h1><p class="subtitle">Search and review your wallet activity.</p><div class="card"><div class="search"><input id="txSearch" placeholder="Search transaction, recipient or description"><select id="txFilter"><option value="all">All</option><option value="credit">Money in</option><option value="debit">Money out</option></select></div><div id="txList"></div></div></section>`}
function servicesHtml(){const sv=[['Airtime','☎','Buy airtime'],['Data','◉','Buy mobile data'],['Electricity','ϟ','Pay electricity'],['TV Bill','▣','Pay TV subscription'],['Education','▤','Pay education'],['Betting','♢','Fund betting wallet']];return `<section class="page" id="page-services"><h1 class="title">All services</h1><p class="subtitle">Pay for supported services from your internal balance.</p><div class="grid grid3">${sv.map(s=>`<div class="card service" onclick="serviceModal('${s[0]}')"><div class="service-icon">${s[1]}</div><h3>${s[0]}</h3><div class="muted">${s[2]}</div></div>`).join('')}</div></section>`}
function savingsHtml(u){return `<section class="page" id="page-savings"><h1 class="title">Savings</h1><p class="subtitle">Move internal funds into your savings balance.</p><div class="grid grid2"><div class="hero"><div class="eyebrow">Savings balance</div><div class="balance">${money(u.savings)}</div><p class="muted">Your savings are separate from your spending balance.</p></div><div class="card"><div class="field"><label>Amount</label><input id="saveAmount" type="number" min="1"></div><div class="actions"><button class="btn primary" onclick="saveMoney('deposit')">Deposit</button><button class="btn soft" onclick="saveMoney('withdraw')">Withdraw</button></div></div></div></section>`}
function cardsHtml(u){return `<section class="page" id="page-cards"><h1 class="title">Cards</h1><p class="subtitle">Manage your simulated internal wallet card.</p><div class="grid grid2"><div class="card" style="background:linear-gradient(135deg,#07130e,#138457);color:#fff;min-height:220px"><div class="row"><b>INTERNAL WALLET</b><span>◈</span></div><div style="margin-top:55px;font-size:22px;letter-spacing:3px">${u.card?esc(u.card.number):'•••• •••• •••• ••••'}</div><div class="row" style="margin-top:24px"><span>${esc(u.name).toUpperCase()}</span><span>${u.card?'12/30':'--/--'}</span></div></div><div class="card">${u.card?`<h3>Card active</h3><p class="muted">This card is for internal wallet simulations and does not connect to a real card network.</p><button class="btn danger" onclick="deleteCard()">Remove card</button>`:`<h3>Create a card</h3><p class="muted">Create a simulated card for the wallet.</p><button class="btn primary" onclick="createCard()">Create card</button>`}</div></div></section>`}
function loansHtml(u){return `<section class="page" id="page-loans"><h1 class="title">Loans</h1><p class="subtitle">Internal loan simulation with repayment tracking.</p><div class="grid grid2"><div class="card"><div class="eyebrow" style="color:#078c55">Outstanding</div><div class="stat">${money(u.loan)}</div><p class="muted">Current internal loan balance.</p>${u.loan?`<button class="btn primary" onclick="repayLoan()">Repay</button>`:''}</div><div class="card"><h3>Request a loan</h3><div class="field"><label>Amount</label><input id="loanAmount" type="number" min="1000"></div><button class="btn primary" onclick="requestLoan()">Request loan</button><p class="muted" style="font-size:12px;margin-top:12px">Approval is simulated locally in this frontend build.</p></div></div></section>`}
function beneficiariesHtml(u){return `<section class="page" id="page-beneficiaries"><h1 class="title">Beneficiaries</h1><p class="subtitle">Save trusted wallet recipients for faster transfers.</p><div class="card"><button class="btn primary" onclick="addBeneficiary()">Add beneficiary</button><div class="list" style="margin-top:12px">${u.beneficiaries.length?u.beneficiaries.map((b,i)=>`<div class="tx"><div class="txicon">♙</div><div class="txbody"><strong>${esc(b.name)}</strong><span class="muted">${esc(b.account)}</span></div><button class="btn danger" onclick="removeBeneficiary(${i})">Remove</button></div>`).join(''):'<div class="empty">No beneficiaries saved.</div>'}</div></div></section>`}
function profileHtml(u){return `<section class="page" id="page-profile"><h1 class="title">Profile</h1><p class="subtitle">Your account information.</p><div class="grid grid2"><div class="card"><h3>${esc(u.username)}</h3><p class="muted">${esc(u.name)}</p><div class="row"><span>Account number</span><b>${esc(u.account)}</b></div><div class="row" style="margin-top:13px"><span>Phone</span><b>${esc(u.phone)}</b></div><div class="row" style="margin-top:13px"><span>Email</span><b>${esc(u.email)}</b></div></div><div class="card"><h3>Identity verification</h3><p class="muted">Use your device camera for a local face-verification step.</p><button class="btn primary" onclick="faceVerify(true)">Verify face</button><p id="faceStatus" class="muted" style="margin-top:12px"></p></div></div></section>`}
function settingsHtml(u){return `<section class="page" id="page-settings"><h1 class="title">Settings</h1><p class="subtitle">Security and account preferences.</p><div class="grid grid2"><div class="card"><h3>Security</h3><button class="btn soft" onclick="changePassword()">Change password</button> <button class="btn soft" onclick="changePin()">Change PIN</button><div style="margin-top:16px"><span class="tag">PIN lockout enabled</span> <span class="tag">NightGuard enabled</span></div></div><div class="card"><h3>Preferences</h3><label class="row" style="padding:12px 0"><span>Show balance</span><input id="prefBalance" type="checkbox" ${u.showBalance?'checked':''}></label><label class="row" style="padding:12px 0"><span>Email/login alerts</span><input id="prefAlerts" type="checkbox" checked></label><button class="btn primary" onclick="savePrefs()">Save preferences</button></div><div class="card"><h3>Account</h3><p class="muted">Created ${new Date(u.createdAt).toLocaleDateString()}</p><button class="btn danger" onclick="signOutAll()">Sign out</button></div></div></section>`}
function bindPage(page){const u=current();if(page==='history'){const render=()=>{const q=(document.getElementById('txSearch')?.value||'').toLowerCase(),f=document.getElementById('txFilter')?.value||'all';const a=u.tx.slice().reverse().filter(t=>(f==='all'||t.kind===f)&&JSON.stringify(t).toLowerCase().includes(q));document.getElementById('txList').innerHTML=a.length?a.map(txHtml).join(''):'<div class="empty">No matching transactions.</div>'};document.getElementById('txSearch').oninput=render;document.getElementById('txFilter').onchange=render;render()}}
function openModal(html){const m=document.getElementById('modal');m.innerHTML=`<div class="modalbox">${html}</div>`;m.classList.add('open')}
function closeModal(){document.getElementById('modal')?.classList.remove('open')}
function searchModal(){openModal(`<div class="modalhead"><h2>Find a wallet user</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Username or account number</label><input id="userSearch" placeholder="@username or 01..."></div><button class="btn primary" onclick="findUser()">Search</button><div id="searchResult" style="margin-top:15px"></div>`)}
function findUser(){const q=document.getElementById('userSearch').value.trim().toLowerCase();const u=db.users.find(x=>x.username===q.replace(/^@/,'')||x.account===q);document.getElementById('searchResult').innerHTML=u?`<div class="card"><b>@${esc(u.username)}</b><p class="muted">${esc(u.name)} · ${esc(u.account)}</p><button class="btn primary" onclick="closeModal();go('send');setTimeout(()=>document.querySelector('[name=recipient]').value='${esc(u.account)}',50)">Send money</button></div>`:'<div class="notice error">No matching wallet account.</div>'}
function notifications(){const u=current();u.notifications.forEach(n=>n.read=true);save();openModal(`<div class="modalhead"><h2>Notifications</h2><button class="close" onclick="closeModal()">×</button></div>${u.notifications.length?u.notifications.slice().reverse().map(n=>`<div class="tx"><div class="txicon">♢</div><div class="txbody"><strong>${esc(n.title)}</strong><span class="muted">${esc(n.body)} · ${new Date(n.date).toLocaleString()}</span></div></div>`).join(''):'<div class="empty">No notifications.</div>'}`);document.getElementById('nb').textContent='';}
function addNotif(u,title,body){u.notifications.push({id:uid(),title,body,date:now(),read:false})}
function toggleBalance(){const u=current();u.showBalance=!u.showBalance;save();go('home')}
function requirePin(cb){const u=current();if(Date.now()<u.lockedUntil)return alert('Transaction PIN is temporarily locked. Try again later.');const p=prompt('Enter your 4-digit transaction PIN');if(p===null)return;if(p!==u.pin){u.pinFails++;if(u.pinFails>=5){u.lockedUntil=Date.now()+15*60*1000;u.pinFails=0;alert('Too many incorrect PIN attempts. PIN locked for 15 minutes.')}else alert('Incorrect PIN.');save();return}u.pinFails=0;save();cb()}
function isNight(){const h=new Date().getHours();return h>=0&&h<5}
async function faceVerify(closeAfter=false){openModal(`<div class="modalhead"><h2>Face verification</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Position your face inside the guide. This build only performs a camera presence step; real biometric matching requires WebAuthn or a secure identity provider.</p><div class="camera"><video id="faceVideo" autoplay muted playsinline></video><div class="scan"></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="verifyFaceBtn">Verify</button><button class="btn outline" onclick="closeModal()">Cancel</button></div><p id="faceMsg" class="muted"></p>`);let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:true});document.getElementById('faceVideo').srcObject=stream}catch(e){document.getElementById('faceMsg').textContent='Camera permission is unavailable. For this prototype, verification cannot continue.';return}document.getElementById('verifyFaceBtn').onclick=()=>{document.getElementById('faceMsg').textContent='Face verification completed for this session.';setTimeout(()=>{stream?.getTracks().forEach(t=>t.stop());closeModal();if(closeAfter){const x=document.getElementById('faceStatus');if(x)x.textContent='Face verified for this session.'}},700)}}
function transfer(recipient,amount,note){const sender=current();const r=db.users.find(x=>x.account===recipient||x.username===recipient.toLowerCase());if(!r)return alert('Recipient not found.');if(r.id===sender.id)return alert('You cannot transfer to yourself.');if(amount<=0||amount>sender.balance)return alert('Insufficient balance or invalid amount.');const perform=()=>{sender.balance-=amount;r.balance+=amount;const t={id:uid(),date:now(),title:'Transfer to @'+r.username,amount,kind:'debit',recipient:r.account,note};sender.tx.push(t);r.tx.push({id:uid(),date:now(),title:'Transfer from @'+sender.username,amount,kind:'credit',sender:sender.account,note});addNotif(r,'Money received',`${money(amount)} received from @${sender.username}`);addNotif(sender,'Transfer completed',`${money(amount)} sent to @${r.username}`);save();alert('Transfer successful.');go('home')};requirePin(()=>{if(isNight()){closeModal();faceVerify(false).then(()=>{});setTimeout(()=>{if(confirm('Face verification is required during the protected night window. Continue after completing the camera step?'))perform()},1200)}else perform()})}
function bindSend(){const f=document.getElementById('sendForm');if(f)f.onsubmit=e=>{e.preventDefault();const d=new FormData(f);transfer(String(d.get('recipient')).trim(),Number(d.get('amount')),String(d.get('note')||''))}}
const oldBind=bindPage;bindPage=function(page){oldBind(page);if(page==='send')bindSend()}
function serviceModal(type){const labels={Airtime:'Phone number',Data:'Phone number',Electricity:'Meter number', 'TV Bill':'Smartcard number',Education:'Student/reference number',Betting:'Customer ID'};openModal(`<div class="modalhead"><h2>${type}</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>${labels[type]}</label><input id="serviceTarget" required></div><div class="field"><label>Amount</label><input id="serviceAmount" type="number" min="100" required></div><div class="field"><label>Provider</label><select id="serviceProvider"><option>Default provider</option><option>Provider A</option><option>Provider B</option></select></div><button class="btn primary" onclick="payService('${type}')">Pay now</button><p class="muted" style="font-size:12px;margin-top:12px">This records an internal service payment only.</p>`)}
function payService(type){const u=current(),a=Number(document.getElementById('serviceAmount').value),target=document.getElementById('serviceTarget').value.trim();if(!target||a<=0||a>u.balance)return alert('Enter a valid amount and target.');requirePin(()=>{u.balance-=a;u.tx.push({id:uid(),date:now(),title:type+' payment',amount:a,kind:'debit',note:target});addNotif(u,'Payment completed',`${money(a)} paid for ${type}`);save();closeModal();alert(type+' payment completed.');go('home')})}
function saveMoney(mode){const u=current(),a=Number(document.getElementById('saveAmount').value);if(a<=0)return alert('Enter an amount.');if(mode==='deposit'){if(a>u.balance)return alert('Insufficient balance.');u.balance-=a;u.savings+=a;u.tx.push({id:uid(),date:now(),title:'Savings deposit',amount:a,kind:'debit'})}else{if(a>u.savings)return alert('Insufficient savings.');u.savings-=a;u.balance+=a;u.tx.push({id:uid(),date:now(),title:'Savings withdrawal',amount:a,kind:'credit'})}save();go('savings')}
function createCard(){const u=current();u.card={number:'5399 '+Math.floor(1000+Math.random()*8999)+' '+Math.floor(1000+Math.random()*8999)+' '+Math.floor(1000+Math.random()*8999)};save();go('cards')}
function deleteCard(){if(confirm('Remove this card?')){current().card=null;save();go('cards')}}
function requestLoan(){const u=current(),a=Number(document.getElementById('loanAmount').value);if(a<1000)return alert('Minimum loan is ₦1,000.');u.loan+=a;u.balance+=a;u.tx.push({id:uid(),date:now(),title:'Loan disbursement',amount:a,kind:'credit'});addNotif(u,'Loan approved',`${money(a)} added to your wallet`);save();alert('Loan approved.');go('loans')}
function repayLoan(){const u=current(),a=Number(prompt('Amount to repay',Math.min(u.loan,u.balance)));if(!a||a<=0||a>u.balance||a>u.loan)return alert('Invalid repayment amount.');u.balance-=a;u.loan-=a;u.tx.push({id:uid(),date:now(),title:'Loan repayment',amount:a,kind:'debit'});save();go('loans')}
function addBeneficiary(){const name=prompt('Beneficiary name');const account=prompt('Account number');if(!name||!account)return;const u=db.users.find(x=>x.account===account);if(!u)return alert('Wallet account not found.');current().beneficiaries.push({name,account});save();go('beneficiaries')}
function removeBeneficiary(i){current().beneficiaries.splice(i,1);save();go('beneficiaries')}
function changePassword(){const u=current(),old=prompt('Current password');if(old!==u.password)return alert('Incorrect password.');const p=prompt('New password');if(!p||p.length<6)return alert('Password must be at least 6 characters.');u.password=p;save();alert('Password changed.')}
function changePin(){const u=current();requirePin(()=>{const p=prompt('New 4-digit PIN');if(!/^\d{4}$/.test(p))return alert('PIN must be exactly 4 digits.');u.pin=p;save();alert('Transaction PIN changed.')})}
function savePrefs(){const u=current();u.showBalance=document.getElementById('prefBalance').checked;save();alert('Preferences saved.');go('home')}
function signOutAll(){db.session=null;save();authView()}
function bindGlobal(){document.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})}
bindGlobal();
if(current())app();else authView();
</script>
</body>
</html>
