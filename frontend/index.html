<script>
'use strict';

/*
  VEYRA shared-wallet frontend
  IMPORTANT: set API_BASE to the public URL where backend/src/server.ts is deployed.
  Example: https://your-veyra-api.example.com
*/
const API_BASE = 'https://veyra-api-etnq.onrender.com';
const TOKEN_KEY='veyra_access_token';
const REFRESH_KEY='veyra_refresh_token';
const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const now=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let state={user:null,tx:[],notifications:[]};
let lookupTimer=null;

function token(){return localStorage.getItem(TOKEN_KEY)||''}
function setTokens(access,refresh){if(access)localStorage.setItem(TOKEN_KEY,access);if(refresh)localStorage.setItem(REFRESH_KEY,refresh)}
function clearTokens(){localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(REFRESH_KEY)}
function apiUrl(path){return API_BASE.replace(/\/+$/,'')+path}
async function api(path,options={},retry=true){
  const headers={'Content-Type':'application/json',...(options.headers||{})};
  if(token())headers.Authorization='Bearer '+token();
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),30000);
  let r;
  try{
    r=await fetch(apiUrl(path),{...options,headers,signal:controller.signal,cache:'no-store'});
  }catch(e){
    clearTimeout(timeout);
    if(e?.name==='AbortError')throw new Error('Veyra server timed out while waking or responding. Wait a few seconds and tap Retry.');
    throw new Error('Cannot reach the Veyra API. Check the Render service or your internet connection.');
  }
  clearTimeout(timeout);
  if(r.status===401&&retry&&localStorage.getItem(REFRESH_KEY)){
    try{
      const rr=await fetch(apiUrl('/api/auth/refresh'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refreshToken:localStorage.getItem(REFRESH_KEY)}),cache:'no-store'});
      if(rr.ok){const d=await rr.json();setTokens(d.accessToken,d.refreshToken);return api(path,options,false)}
    }catch{}
    clearTokens();state={user:null,tx:[],notifications:[]};authView('login');throw new Error('Session expired. Please sign in again.');
  }
  let data={};try{data=await r.json()}catch{}
  if(!r.ok){const e=new Error(data.message||data.code||('Request failed ('+r.status+')'));e.httpStatus=r.status;e.apiCode=data.code;throw e}
  return data;
}

async function loadState(){
  // /api/me is the authentication check. Do not throw the user back to
  // login just because a secondary dashboard endpoint is temporarily down.
  const m=await api('/api/me');
  const u=m.user;

  let t={transactions:[]},n={notifications:[]},sv={savings:[]},cd={cards:[]},lo={loans:[]};
  const results=await Promise.allSettled([
    api('/api/transactions'),
    api('/api/notifications'),
    api('/api/savings'),
    api('/api/cards'),
    api('/api/loans')
  ]);
  if(results[0].status==='fulfilled') t=results[0].value||t;
  if(results[1].status==='fulfilled') n=results[1].value||n;
  if(results[2].status==='fulfilled') sv=results[2].value||sv;
  if(results[3].status==='fulfilled') cd=results[3].value||cd;
  if(results[4].status==='fulfilled') lo=results[4].value||lo;

  state.user={...u,name:`${u.firstName} ${u.lastName}`,account:u.accountNumber,balance:Number(u.balance),showBalance:true,savings:(sv.savings||[]).reduce((a,x)=>a+Number(x.balance||0),0),savingsAccounts:sv.savings||[],cards:cd.cards||[],loans:lo.loans||[],loan:(lo.loans||[]).filter(x=>x.status==='ACTIVE'||x.status==='APPROVED').reduce((a,x)=>a+Number(x.totalRepayable||0),0),notifications:n.notifications||[],tx:normalizeTx(t.transactions||[]),beneficiaries:[],role:'user'};
  state.user.beneficiaries=JSON.parse(localStorage.getItem('veyra_beneficiaries_'+u.id)||'[]');

}

function toggleBalance(){const u=current();u.showBalance=!u.showBalance;go('home')}
function isNight(){const h=new Date().getHours();return h>=0&&h<5}
function templateFromVideo(video){
  const canvas=document.createElement('canvas'); canvas.width=32; canvas.height=32; const ctx=canvas.getContext('2d',{willReadFrequently:true});
  const size=Math.min(video.videoWidth||320,video.videoHeight||240); const sx=((video.videoWidth||320)-size)/2, sy=((video.videoHeight||240)-size)/2;
  ctx.drawImage(video,sx,sy,size,size,0,0,32,32); const px=ctx.getImageData(0,0,32,32).data; const v=[];
  for(let i=0;i<px.length;i+=4)v.push((0.299*px[i]+0.587*px[i+1]+0.114*px[i+2])/255);
  const mean=v.reduce((a,b)=>a+b,0)/v.length; const sd=Math.sqrt(v.reduce((a,b)=>a+(b-mean)**2,0)/v.length)||1; return v.map(x=>(x-mean)/sd);
}
async function openCameraModal(title,onCapture){
  openModal(`<div class="modalhead"><h2>${esc(title)}</h2><button class="close" id="cameraCancel">×</button></div><p class="muted">Center your face inside the frame, keep your face visible and look at the camera.</p><div class="camera"><video id="faceVideo" autoplay muted playsinline></video><div class="scan"></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="captureFaceBtn">Capture and continue</button><button class="btn outline" id="cameraCancel2">Cancel</button></div><p id="faceMsg" class="muted"></p>`);
  let stream; try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});const v=document.getElementById('faceVideo');v.srcObject=stream;await v.play()}catch(e){document.getElementById('faceMsg').textContent='Camera permission is required for this feature.';return false}
  const close=()=>{stream?.getTracks().forEach(t=>t.stop());closeModal()}; document.getElementById('cameraCancel').onclick=close;document.getElementById('cameraCancel2').onclick=close;
  document.getElementById('captureFaceBtn').onclick=async()=>{const v=document.getElementById('faceVideo');if(!v.videoWidth){document.getElementById('faceMsg').textContent='Camera is not ready yet.';return}const template=templateFromVideo(v);stream?.getTracks().forEach(t=>t.stop());await onCapture(template);};
  return true;
}
async function enrollFace(){await openCameraModal('Save your Veyra face template',async template=>{try{await api('/api/security/face/enroll',{method:'POST',body:JSON.stringify({template})});closeModal();alert('Face template captured and saved. You can use it for account recovery and NightGuard.')}catch(e){alert(e.message)}})}
async function faceVerify(){let result=false;await openCameraModal('NightGuard face verification',async template=>{try{const d=await api('/api/security/face/verify',{method:'POST',body:JSON.stringify({template})});result=!!d.matched;closeModal()}catch(e){alert(e.message);result=false}});return result}
async function ensureFaceEnrollment(){try{await api('/api/security/face/verify');}catch(e){if(e.message.includes('No face template')){openModal(`<div class="modalhead"><h2>Secure your account</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Capture a face template once. Veyra stores an encrypted template, not the camera photo.</p><div class="notice">This is for this simulated wallet only. It is not real KYC or government identity verification.</div><button class="btn primary" onclick="enrollFace()">Set up face verification</button><button class="btn outline" onclick="closeModal()">Do it later</button>`)}}}

async function beginTransfer(recipient,amount,note){
  if(!recipient||!Number.isFinite(amount)||amount<=0)return alert('Enter a valid recipient and amount.');
  const box=document.getElementById('recipientLookup');let recipientId=box?.dataset.recipientId;
  if(!recipientId){try{const d=await api('/api/users/lookup?q='+encodeURIComponent(recipient));recipientId=d.recipient.id}catch(e){return alert('Recipient account was not found in the shared Veyra database.')}}
  if(amount>current().balance)return alert('Insufficient balance.');
  if(isNight()){const ok=await faceVerify();if(!ok)return}
  const pin=prompt('Enter your 4-digit transaction PIN');if(pin===null)return;if(!/^\d{4}$/.test(pin))return alert('PIN must be exactly 4 digits.');
  try{
    const d=await api('/api/transfers/internal',{method:'POST',headers:{'Idempotency-Key':uid()},body:JSON.stringify({recipientId,amount,narration:note||undefined,pin})});
    await loadState();alert(`Transfer successful.\n${money(amount)} sent.\nThe recipient's Veyra wallet has been credited.`);go('home');
  }catch(e){alert(e.message)}
}

async function payService(type){const target=document.getElementById('serviceTarget').value.trim(),amount=Number(document.getElementById('serviceAmount').value);if(!target||!amount)return alert('Enter the required details and amount.');const map={Airtime:'AIRTIME',Data:'DATA',Electricity:'ELECTRICITY','TV Bill':'TV',Education:'EDUCATION',Betting:'INTERNET'};const pin=prompt('Enter your 4-digit transaction PIN');if(pin===null)return;try{await api('/api/services/payment',{method:'POST',body:JSON.stringify({type:map[type],target,amount,pin})});await loadState();closeModal();alert(`${type} payment successful.`);go('home')}catch(e){alert(e.message)}}
async function saveMoney(mode){const amount=Number(document.getElementById('saveAmount')?.value);if(!amount)return alert('Enter an amount.');let accounts=current().savingsAccounts||[];if(mode==='deposit'&&accounts.length===0){try{const d=await api('/api/savings',{method:'POST',body:JSON.stringify({name:'Main Savings',type:'SAFEBOX'})});accounts=[d.savings];current().savingsAccounts=accounts}catch(e){return alert(e.message)}}const account=accounts[0];const pin=prompt('Enter your 4-digit transaction PIN');if(pin===null)return;try{await api(`/api/savings/${account.id}/${mode}`,{method:'POST',body:JSON.stringify({amount,pin})});await loadState();go('savings')}catch(e){alert(e.message)}}
async function createCard(){try{const d=await api('/api/cards',{method:'POST',body:'{}'});await loadState();alert(`Virtual card created.\nCard ending ${d.card.last4}\nCVV: ${d.card.cvv}\nKeep these details private.`);go('cards')}catch(e){alert(e.message)}}
async function deleteCard(){const c=current().cards?.[0];if(!c||!confirm('Remove this virtual card?'))return;try{await api('/api/cards/'+c.id,{method:'DELETE'});await loadState();go('cards')}catch(e){alert(e.message)}}
async function requestLoan(){const amount=Number(document.getElementById('loanAmount')?.value);if(!amount)return alert('Enter a loan amount.');try{await api('/api/loans',{method:'POST',body:JSON.stringify({amount,durationMonths:12})});await loadState();alert('Loan request submitted.');go('loans')}catch(e){alert(e.message)}}
async function repayLoan(){const loan=(current().loans||[]).find(x=>x.status==='ACTIVE'||x.status==='APPROVED');if(!loan)return;const amount=Number(prompt('Repayment amount',String(loan.totalRepayable)));if(!amount)return;const pin=prompt('Enter your 4-digit transaction PIN');if(pin===null)return;try{await api(`/api/loans/${loan.id}/repay`,{method:'POST',body:JSON.stringify({amount,pin})});await loadState();alert('Loan repayment recorded.');go('loans')}catch(e){alert(e.message)}}
function addBeneficiary(){const name=prompt('Beneficiary name');if(!name)return;const account=prompt('Veyra account number');if(!account)return;const list=current().beneficiaries||[];list.push({name,account});current().beneficiaries=list;localStorage.setItem('veyra_beneficiaries_'+current().id,JSON.stringify(list));go('beneficiaries')}
function removeBeneficiary(i){const list=current().beneficiaries||[];list.splice(i,1);current().beneficiaries=list;localStorage.setItem('veyra_beneficiaries_'+current().id,JSON.stringify(list));go('beneficiaries')}

function navHtml(){return [['home','⌂','Home'],['send','↗','Transfer'],['history','◷','Transactions'],['services','▦','Services'],['savings','⌁','Finance'],['cards','▭','Cards'],['loans','₦','Loan'],['profile','●','Me'],['settings','⚙','Settings']].map(x=>`<button class="navbtn" data-nav="${x[0]}">${x[1]} &nbsp; ${x[2]}</button>`).join('')}

ass="rb"><b>Profile</b><div class="rs">Photo, name and identity</div></div><span class="v-arr">›</span></button></div><div class="card recent-card" style="margin-top:16px"><div class="row"><h3>Recent transactions</h3><button class="btn soft" onclick="go('history')">See all</button></div>${tx.length?tx.map(txHtml).join(''):'<div class="empty">No transactions yet.</div>'}</div></section>`}
function sendHtml(u){return `<section class="page active" id="page-send"><h1 class="title">To Veyra</h1><p class="subtitle">Send money to another Veyra account.</p><div class="card transfer-card"><form id="sendForm"><div class="field"><label>Veyra account number</label><input id="recipientInput" name="recipient" inputmode="numeric" maxlength="10" required placeholder="Enter account number"><div id="recipientLookup" class="lookup"></div></div><div class="field"><label>Amount</label><input name="amount" type="number" min="1" step="0.01" required placeholder="₦0.00"></div><div class="field"><label>Description</label><input name="note" maxlength="140" placeholder="Optional"></div><button class="btn primary full" id="sendBtn">Continue</button></form></div></section>`}
function vServicesPage(){return `<section class="page active" id="page-services"><h1 class="title">Services</h1><p class="subtitle">Everyday services inside Veyra.</p><div class="service-list">${[['☎','Airtime','Buy airtime',"serviceModal('Airtime')"],['◉','Data','Buy data',"serviceModal('Data')"],['🎁','Gift','Send a Veyra gift',"go('gift')"],['▣','TV','Pay TV',"serviceModal('TV Bill')"],['ϟ','Electricity','Pay electricity',"serviceModal('Electricity')"],['▤','Education','Education payment',"serviceModal('Education')"],['₦','Loan','Loan center',"go('loans')"],['⌁','Savings','Save money',"go('savings')"],['▭','Cards','Virtual card',"go('cards')"],['⚙','Settings','Security and preferences',"go('settings')"]].map(x=>`<button class="v-row service-row" onclick="${x[3]}"><div class="ri">${x[0]}</div><div class="rb"><b>${x[1]}</b><div class="rs">${x[2]}</div></div><span class="v-arr">›</span></button>`).join('')}</div></section>`}
function vGiftPage(){return `<section class="page active" id="page-gift"><h1 class="title">Gift</h1><p class="subtitle">Send a Veyra gift to another Veyra account.</p><div class="card transfer-card"><div class="field"><label>Recipient account number</label><input id="giftRecipient" inputmode="numeric" maxlength="10" placeholder="Enter account number"></div><div id="giftLookup"></div><div class="field"><label>Gift amount</label><input id="giftAmount" type="number" min="1" placeholder="₦0.00"></div><div class="field"><label>Gift message</label><textarea id="giftNote" maxlength="140" rows="3" placeholder="Write a short message"></textarea></div><button class="btn primary full" onclick="sendGift()">Continue</button></div></section>`}
async function sendGift(){const recipient=document.getElementById('giftRecipient')?.value.trim(),amount=Number(document.getElementById('giftAmount')?.value),note=document.getElementById('giftNote')?.value.trim();if(!/^\d{10}$/.test(recipient)||!amount)return alert('Enter a valid Veyra account number and gift amount.');if(amount>current().balance)return alert('Insufficient balance.');try{const d=await api('/api/users/lookup?q='+encodeURIComponent(recipient));const pin=prompt('Enter your 4-digit transaction PIN');if(pin===null)return;if(!/^\d{4}$/.test(pin))return alert('PIN must be exactly 4 digits.');await api('/api/transfers/internal',{method:'POST',headers:{'Idempotency-Key':uid()},body:JSON.stringify({recipientId:d.recipient.id,amount,narration:'Gift'+(note?': '+note:'') ,pin})});await loadState();alert('Gift sent successfully.');go('home')}catch(e){alert(e.message)}}
function vBankPage(){return `<section class="page active" id="page-bank"><h1 class="title">To Bank</h1><p class="subtitle">Choose a Nigerian bank and verify the account name.</p><div class="card bank-card"><div class="field"><label>Search bank</label><input id="vBankQ" placeholder="Search Access, GTBank, Zenith..." oninput="vRenderBanks(this.value)"></div><div id="paystackBankStatus" class="notice">Loading supported Nigerian banks…</div><div id="vBanks"></div></div></section>`}
async function loadPaystackBanks(){try{const d=await api('/api/paystack/banks');PAYSTACK_BANKS=Array.isArray(d.banks)?d.banks:[];vRenderBanks(document.getElementById('vBankQ')?.value||'')}catch(e){const s=document.getElementById('paystackBankStatus');if(s)s.className='notice error',s.textContent=e.message||'Could not load the bank list.'}}

async function resolvePaystackAccount(acc){const out=document.getElementById('bankResolveResult');if(!out||!selectedPaystackBank)return;try{const d=await api('/api/paystack/resolve?accountNumber='+encodeURIComponent(acc)+'&bankCode='+encodeURIComponent(selectedPaystackBank.code));const a=d.account;out.innerHTML=`<div class="verified-account"><div class="verified-mark">✓</div><div><b>${esc(a.accountName)}</b><div class="muted">${esc(a.accountNumber)} · ${esc(selectedPaystackBank.name)}</div></div></div><div class="field"><label>Amount</label><input id="bankAmt" type="number" min="1" inputmode="decimal" placeholder="₦0.00"></div><button class="btn primary full" onclick="vExternalSend()">Continue</button>`}catch(e){out.innerHTML=`<div class="notice error">${esc(e.message||'Could not resolve account name.')}</div>`}}
async function vExternalSend(){if(!selectedPaystackBank)return;const acct=document.getElementById('bankAcc')?.value.trim(),amount=Number(document.getElementById('bankAmt')?.value),resolved=document.querySelector('.verified-account b')?.textContent;if(!/^\d{10}$/.test(acct)||!amount||!resolved)return alert('Verify the account and enter an amount first.');if(amount>current().balance)return alert('Insufficient balance.');const pin=prompt('Enter your 4-digit transaction PIN');if(pin===null)return;if(!/^\d{4}$/.test(pin))return alert('PIN must be exactly 4 digits.');try{const d=await api('/api/transfers/external/simulate',{method:'POST',body:JSON.stringify({accountNumber:acct,bankCode:selectedPaystackBank.code,bankName:selectedPaystackBank.name,accountName:resolved,amount,narration:'Veyra simulated bank transfer',pin})});await loadState();const r=d.receipt||{};openModal(`<div class="center"><div class="successicon">✓</div><h2>Transfer successful</h2><div class="successamount">${money(r.amount||amount)}</div><div class="summary"><div class="summaryrow"><span>Bank</span><b>${esc(r.bankName||selectedPaystackBank.name)}</b></div><div class="summaryrow"><span>Account</span><b>${esc(r.accountNumber||acct)}</b></div><div class="summaryrow"><span>Name</span><b>${esc(r.accountName||resolved)}</b></div></div><div class="sim-watermark">Simulation transfer · No real money was sent to the bank.</div><button class="btn primary full" style="margin-top:14px" onclick="closeModal();go('home')">Done</button></div>`)}catch(e){alert(e.message)}}
function vProfilePage(u){const ti=vTierInfo();return `<section class="page active" id="page-profile"><h1 class="title">Profile</h1><p class="subtitle">Your Veyra account.</p><div class="card profile-hero"><div class="profile-photo-wrap">${vPhoto(u)}<button class="photo-edit" onclick="vPhotoMenu()">✎</button></div><div><div class="profile-name">${esc(u.name)}</div><div class="muted">@${esc(u.username)}</div><span class="tag">${ti.name} account</span></div></div><div class="v-list" style="margin-top:14px"><button class="v-row" onclick="go('account')"><div class="ri">▣</div><div class="rb"><b>Account information</b><div class="rs">Account number, phone, email and NIN</div></div><span class="v-arr">›</span></button><button class="v-row" onclick="enrollFace()"><div class="ri">◉</div><div class="rb"><b>Face verification</b><div class="rs">Capture or update your Veyra face template</div></div><span class="v-arr">›</span></button><button class="v-row" onclick="go('settings')"><div class="ri">⚙</div><div class="rb"><b>Settings</b><div class="rs">Password, PIN and privacy</div></div><span class="v-arr">›</span></button></div></section>`}
function vSettingsPage(u){return `<section class="page active" id="page-settings"><h1 class="title">Settings</h1><p class="subtitle">Security and preferences.</p><div class="v-list"><button class="v-row" onclick="changePassword()"><div class="ri">🔒</div><div class="rb"><b>Change password</b></div><span class="v-arr">›</span></button><button class="v-row" onclick="changePin()"><div class="ri">⌘</div><div class="rb"><b>Change transaction PIN</b></div><span class="v-arr">›</span></button><button class="v-row" onclick="go('fingerprint')"><div class="ri">☝</div><div class="rb"><b>Device biometric</b><div class="rs">Use the phone's secure authenticator</div></div><span class="v-arr">›</span></button><button class="v-row" onclick="toggleBalance()"><div class="ri">◌</div><div class="rb"><b>Private balance mode</b><div class="rs">${u.showBalance?'Balance is visible':'Balance is hidden'}</div></div><span class="v-arr">›</span></button></div><button class="btn danger full" style="margin-top:14px" onclick="logout()">Sign out</button></section>`}
function vUpgradePage(){const cur=vTierNo(),plans=[{n:1,name:'Basic',bal:'₦500,000,000',lim:'₦50,000,000'},{n:2,name:'Verified',bal:'₦2,000,000,000',lim:'₦500,000,000'},{n:3,name:'Premium',bal:'Unlimited',lim:'₦40,000,000,000'}];return `<section class="page active" id="page-upgrade"><h1 class="title">Account Upgrade</h1><p class="subtitle">Choose your simulated account level.</p>${plans.map(p=>`<div class="v-tier ${cur===p.n?'active':''}"><div class="row"><b>${p.name}</b>${cur===p.n?'<span class="tag">CURRENT</span>':''}</div><div class="row" style="margin-top:12px"><span class="small">Maximum balance</span><b>${p.bal}</b></div><div class="row" style="margin-top:9px"><span class="small">Daily transfer</span><b>${p.lim}</b></div>${cur<p.n?`<button class="btn primary full" style="margin-top:12px" onclick="vSaveTier(${p.n})">Upgrade</button>`:''}</div>`).join('')}</section>`}
function vSaveTier(n){vTier[current().id]=n;localStorage.setItem('veyra_account_tiers',JSON.stringify(vTier));alert('Account upgraded.');go('profile')}
function vAccountPage(){const u=current(),ti=vTierInfo();return `<section class="page active" id="page-account"><h1 class="title">Account details</h1><p class="subtitle">Your Veyra account at a glance.</p><div class="card account-number-card"><div class="muted">Account number</div><div class="account-number-big">${esc(u.account)}</div><button class="btn soft" onclick="copyAccount()">Copy account number</button></div><div class="card"><div class="row"><span class="muted">Full name</span><b>${esc(u.name)}</b></div><div class="row" style="margin-top:14px"><span class="muted">Username</span><b>@${esc(u.username)}</b></div><div class="row" style="margin-top:14px"><span class="muted">Phone</span><b>${esc(u.phone)}</b></div><div class="row" style="margin-top:14px"><span class="muted">Email</span><b>${esc(u.email)}</b></div><div class="row" style="margin-top:14px"><span class="muted">Account level</span><b>${ti.name}</b></div></div></section>`}
function vAtmPage(){return `<section class="page active" id="page-atm"><h1 class="title">Veyra ATM</h1><p class="subtitle">Visual ATM experience for the internal simulation.</p><div class="v-atm"><div class="v-atm-screen"><div><div>VEYRA ATM</div><div style="font-size:24px;margin-top:8px">${current().showBalance?money(current().balance):'••••••••'}</div><small>READY</small></div></div><div class="v-atm-grid"><button class="v-atm-key" onclick="alert('Cash withdrawal is visual-only in this HTML.')">Cash withdrawal</button><button class="v-atm-key" onclick="alert('Balance: '+money(current().balance))">Balance</button><button class="v-atm-key" onclick="go('send')">Transfer</button><button class="v-atm-key" onclick="go('cards')">Card menu</button></div></div></section>`}
function vFingerprintPage(){return `<section class="page active" id="page-fingerprint"><h1 class="title">Device biometric</h1><p class="subtitle">Use Android's secure biometric authenticator when supported.</p><div class="card"><div style="font-size:54px;text-align:center;margin:10px">☝</div><h3 style="text-align:center">Device authentication</h3><p class="muted" style="text-align:center">A normal web page cannot read or store your fingerprint directly. WebAuthn can request the device's secure biometric check.</p><button class="btn primary full" onclick="vEnrollBio()">Set up biometric</button></div></section>`}
async function vEnrollBio(){if(!window.PublicKeyCredential)return alert('WebAuthn is not supported in this browser.');try{if(!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()))return alert('No platform biometric authenticator is available.');const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Veyra',id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:current().username,displayName:current().name},pubKeyCredParams:[{type:'public-key',alg:-7}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});if(cred){localStorage.setItem('veyra_bio_'+current().id,'1');alert('Device biometric enabled on this device.')}}catch(e){alert('Biometric setup was cancelled or unavailable.')}}
function vPhotoMenu(){openModal(`<div class="modalhead"><h2>Profile photo</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Choose a photo or take one with your camera.</p><input type="file" accept="image/*" style="width:100%" onchange="vSavePhoto(this.files[0])"><button class="btn soft full" style="margin-top:10px" onclick="vCameraPhoto()">Take photo</button><button class="btn danger full" style="margin-top:10px" onclick="vDeletePhoto()">Remove photo</button>`,true)}
function vSavePhoto(file){if(!file)return;const r=new FileReader();r.onload=()=>{vPhotos[current().id]=r.result;localStorage.setItem('veyra_profile_photos',JSON.stringify(vPhotos));closeModal();go('profile')};r.readAsDataURL(file)}
function vDeletePhoto(){delete vPhotos[current().id];localStorage.setItem('veyra_profile_photos',JSON.stringify(vPhotos));closeModal();go('profile')}
async function vCameraPhoto(){openModal(`<div class="modalhead"><h2>Take photo</h2><button class="close" id="vpclose">×</button></div><div class="camera"><video id="vpvideo" autoplay muted playsinline></video></div><button class="btn primary full" id="vpcap" style="margin-top:10px">Capture</button>`,true);let s;try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});const v=document.getElementById('vpvideo');v.srcObject=s;await v.play();document.getElementById('vpclose').onclick=()=>{s.getTracks().forEach(t=>t.stop());closeModal()};document.getElementById('vpcap').onclick=()=>{const c=document.createElement('canvas');c.width=480;c.height=480;const x=c.getContext('2d'),z=Math.min(v.videoWidth,v.videoHeight);x.drawImage(v,(v.videoWidth-z)/2,(v.videoHeight-z)/2,z,z,0,0,480,480);vPhotos[current().id]=c.toDataURL('image/jpeg',.85);localStorage.setItem('veyra_profile_photos',JSON.stringify(vPhotos));s.getTracks().forEach(t=>t.stop());closeModal();go('profile')}}catch(e){alert('Camera permission is required.')}}
const oldBindPage=bindPage;
bindPage=function(page){oldBindPage(page);if(page==='bank')loadPaystackBanks();if(page==='gift'){const input=document.getElementById('giftRecipient');input?.addEventListener('input',()=>{clearTimeout(lookupTimer);lookupTimer=setTimeout(async()=>{const q=input.value.trim(),box=document.getElementById('giftLookup');if(!box)return;if(q.length<3){box.innerHTML='';return}try{const d=await api('/api/users/lookup?q='+encodeURIComponent(q));box.innerHTML=`<div class="lookup-card"><b>${esc(d.recipient.firstName+' '+d.recipient.lastName)}</b><div class="muted">Account ${esc(d.recipient.accountNumber)}</div></div>`}catch{box.innerHTML='<div class="notice error">Veyra account not found.</div>'}},300)})}};
</script>
<script>
(function(){
const oldRenderShell=window.renderShell;
function applyTheme(){const t=localStorage.getItem('veyra_theme')||'light';document.documentElement.classList.toggle('v-dark',t==='dark');document.documentElement.classList.toggle('v-light',t!=='dark')}
window.toggleTheme=function(){const t=(localStorage.getItem('veyra_theme')||'light')==='dark'?'light':'dark';localStorage.setItem('veyra_theme',t);applyTheme();if(token())go('settings')};applyTheme();
function brandAvatar(){const u=current(),b=document.querySelector('.brandmark');if(!b)return;b.innerHTML=vPhotos?.[u.id]?`<img class="brand-photo" src="${vPhotos[u.id]}" alt="Profile">`:'V'}
window.renderShell=function(){oldRenderShell();setTimeout(brandAvatar,0)};
window.sendHtml=function(){return `<section class="page active" id="page-send"><h1 class="title">To Veyra</h1><p class="subtitle">Send money securely to another Veyra account.</p><div class="card"><div class="v-stepper"><div class="v-step active" id="st1"><div class="dot">1</div>Recipient</div><div class="v-step" id="st2"><div class="dot">2</div>Amount</div><div class="v-step" id="st3"><div class="dot">3</div>Confirm</div></div><div class="field"><label>Veyra account number</label><input id="recipientInput" inputmode="numeric" maxlength="10" placeholder="Enter 10-digit account number"><div id="recipientLookup"></div></div><div id="transferNext"></div></div></section>`};
window.bindTransferWizard=function(){const input=document.getElementById('recipientInput');if(!input)return;input.oninput=async()=>{const q=input.value.replace(/\D/g,'').slice(0,10);input.value=q;const box=document.getElementById('recipientLookup');if(q.length<10){box.innerHTML='';return}box.innerHTML='<div class="notice">Checking Veyra account…</div>';try{const d=await api('/api/users/lookup?q='+encodeURIComponent(q));const r=d.recipient;window.__vRecipient=r;box.innerHTML=`<div class="lookup-card"><b>${esc(r.firstName+' '+r.lastName)}</b><div class="muted">${esc(r.accountNumber)}</div></div><div class="v-alias"><div class="field"><label>Recipient label (optional)</label><input id="recipientAlias" maxlength="24" placeholder="e.g. BB2"></div><button class="btn soft" style="margin-bottom:13px" onclick="transferStep2()">Continue</button></div>`}catch(e){box.innerHTML=`<div class="notice error">${esc(e.message||'Veyra account not found.')}</div>`}}};
window.transferStep2=function(){const r=window.__vRecipient;if(!r)return;document.getElementById('st1').classList.add('done');document.getElementById('st1').classList.remove('active');document.getElementById('st2').classList.add('active');window.__vTransfer={recipient:r,alias:(document.getElementById('recipientAlias')?.value||'').trim()};document.getElementById('transferNext').innerHTML=`<div class="field"><label>Amount</label><input id="vTransferAmount" type="number" min="1" step="0.01" placeholder="₦0.00"></div><div class="field"><label>Description</label><input id="vTransferNote" maxlength="140" placeholder="Optional"></div><div class="field"><label>SMS Sender ID</label><input id="vTransferSenderId" maxlength="30" autocomplete="off" value="VEYRA" placeholder="Enter approved Sender ID"></div><button class="btn primary full" onclick="transferStep3()">Continue</button>`};
window.transferStep3=function(){const amount=Number(document.getElementById('vTransferAmount')?.value),note=(document.getElementById('vTransferNote')?.value||'').trim(),senderId=(document.getElementById('vTransferSenderId')?.value||'').trim();if(!amount||amount<=0)return alert('Enter a valid amount.');if(amount>current().balance)return alert('Insufficient balance.');if(!senderId)return alert('Enter an SMS Sender ID.');window.__vTransfer.amount=amount;window.__vTransfer.note=note;window.__vTransfer.senderId=senderId;document.getElementById('st2').classList.add('done');document.getElementById('st2').classList.remove('active');document.getElementById('st3').classList.add('active');const r=window.__vTransfer.recipient;document.getElementById('transferNext').innerHTML=`<div class="v-confirm"><div class="v-confirm-row"><span>Recipient</span><b>${esc(r.firstName+' '+r.lastName)}</b></div><div class="v-confirm-row"><span>Account</span><b>${esc(r.accountNumber)}</b></div><div class="v-confirm-row"><span>Amount</span><b>${money(amount)}</b></div><div class="v-confirm-row"><span>Recipient label</span><b>${esc(window.__vTransfer.alias||'None')}</b></div><div class="v-confirm-row"><span>SMS Sender ID</span><b>${esc(window.__vTransfer.senderId)}</b></div></div><div class="field"><label>Transaction PIN</label><input id="vTransferPin" class="v-pin" inputmode="numeric" maxlength="4" placeholder="••••"></div><button class="btn primary full" onclick="performVTransfer()">Send money</button>`};
window.performVTransfer=async function(){const p=document.getElementById('vTransferPin')?.value.trim();if(!/^[0-9]{4}$/.test(p||''))return alert('PIN must be exactly 4 digits.');const t=window.__vTransfer;document.getElementById('transferNext').innerHTML='<div class="v-processing"><div class="v-spinner"></div><h3>Processing transfer</h3><p class="muted">Please wait while Veyra completes the transfer.</p></div>';try{await api('/api/transfers/internal',{method:'POST',headers:{'Idempotency-Key':uid()},body:JSON.stringify({recipientId:t.recipient.id,amount:t.amount,narration:t.note||undefined,pin:p,recipientAlias:t.alias||undefined,senderId:t.senderId||undefined})});await loadState();document.getElementById('st3').classList.add('done');document.getElementById('st3').classList.remove('active');document.getElementById('transferNext').innerHTML=`<div class="v-processing"><div class="successicon">✓</div><h3>Transfer successful</h3><p>${money(t.amount)} sent to ${esc(t.recipient.firstName+' '+t.recipient.lastName)}.</p><button class="btn primary full" onclick="go('home')">Done</button></div>`}catch(e){document.getElementById('transferNext').innerHTML=`<div class="notice error">${esc(e.message||'Transfer failed.')}</div><button class="btn outline full" onclick="go('send')">Try again</button>`}};
const oldServiceModal=window.serviceModal;window.serviceModal=function(type){if(type==='Airtime')return airtimeUI();if(type==='Data')return dataUI();return oldServiceModal(type)};
function airtimeUI(){window.__airNet='MTN';window.__airAmt=0;openModal(`<div class="modalhead"><div><h2>Airtime</h2><div class="subtitle">Network, amount and confirmation</div></div><button class="close" onclick="closeModal()">×</button></div><div id="airtimeBox"></div>`,true);renderAirtime(1)}
window.renderAirtime=function(step){const b=document.getElementById('airtimeBox');if(!b)return;const net=window.__airNet||'MTN',amt=window.__airAmt||0;if(step===1)b.innerHTML=`<div class="field"><label>Network</label><div class="v-option-grid">${['MTN','Airtel','Glo','9mobile'].map(n=>`<button class="v-option ${net===n?'active':''}" onclick="__airNet='${n}';renderAirtime(1)">${n}</button>`).join('')}</div></div><div class="field"><label>Quick amount</label><div class="v-amounts">${[100,200,500,1000,2000,5000].map(x=>`<button class="v-amount ${amt===x?'active':''}" onclick="__airAmt=${x};renderAirtime(1)">₦${x.toLocaleString()}</button>`).join('')}</div></div><div class="field"><label>Custom amount</label><input id="airCustom" type="number" min="50" placeholder="Enter amount" value="${amt||''}"></div><button class="btn primary full" onclick="airtimeNext()">Continue</button>`;else if(step===2)b.innerHTML=`<div class="v-stepper"><div class="v-step done"><div class="dot">✓</div>Options</div><div class="v-step active"><div class="dot">2</div>Amount</div><div class="v-step"><div class="dot">3</div>Confirm</div></div><div class="v-confirm"><div class="v-confirm-row"><span>Network</span><b>${esc(net)}</b></div><div class="v-confirm-row"><span>Amount</span><b>${money(amt)}</b></div></div><div class="field"><label>Transaction PIN</label><input id="airPin" class="v-pin" inputmode="numeric" maxlength="4" placeholder="••••"></div><button class="btn primary full" onclick="airtimePay()">Buy airtime</button>`;else b.innerHTML='<div class="v-processing"><div class="v-spinner"></div><h3>Processing airtime</h3><p class="muted">Please wait…</p></div>'};
window.airtimeNext=function(){const c=Number(document.getElementById('airCustom')?.value||0);if(c>0)window.__airAmt=c;if(!window.__airAmt||window.__airAmt<50)return alert('Enter an airtime amount of at least ₦50.');renderAirtime(2)};
window.airtimePay=async function(){const p=document.getElementById('airPin')?.value.trim();if(!/^[0-9]{4}$/.test(p||''))return alert('PIN must be exactly 4 digits.');renderAirtime(3);try{await api('/api/services/payment',{method:'POST',body:JSON.stringify({type:'AIRTIME',target:window.__airNet,amount:Number(window.__airAmt),pin:p})});await loadState();setTimeout(()=>openModal(`<div class="v-processing"><div class="successicon">✓</div><h3>Airtime purchase successful</h3><p>${money(window.__airAmt)} ${esc(window.__airNet)} airtime was recorded in this simulation.</p><button class="btn primary full" onclick="closeModal();go('home')">Done</button></div>`,true),450)}catch(e){renderAirtime(2);alert(e.message)}};
function dataUI(){window.__dataPlan='';openModal(`<div class="modalhead"><div><h2>Data</h2><div class="subtitle">Choose category and plan</div></div><button class="close" onclick="closeModal()">×</button></div><div id="dataBox"></div>`,true);renderData('Daily')}
window.renderData=function(cat){window.__dataCat=cat;const cats=['Hot','Daily','Weekly','Monthly','Yearly','Social','Night','Others'];const plans={Hot:['500MB','1GB','2GB'],Daily:['100MB','200MB','500MB','1GB'],Weekly:['500MB','1GB','2GB','5GB'],Monthly:['1.5GB','3GB','5GB','10GB','20GB'],Yearly:['20GB','50GB','100GB'],Social:['1GB Social','3GB Social','5GB Social'],Night:['1GB Night','2GB Night','5GB Night'],Others:['TikTok','Instagram','WhatsApp','YouTube']};document.getElementById('dataBox').innerHTML=`<div class="v-service-tabs">${cats.map(c=>`<button class="v-service-tab ${cat===c?'active':''}" onclick="renderData('${c}')">${c}</button>`).join('')}</div><div class="field"><label>${esc(cat)} plans</label><div class="v-option-grid">${plans[cat].map(p=>`<button class="v-option" onclick="dataPlan('${p}')"><b>${p}</b><div class="muted" style="font-size:10px;margin-top:4px">Select plan</div></button>`).join('')}</div></div><div id="dataSelected"></div>`};
window.dataPlan=function(plan){window.__dataPlan=plan;document.getElementById('dataSelected').innerHTML=`<div class="field"><label>Phone number</label><input id="dataPhone" inputmode="tel" maxlength="11" placeholder="08012345678"></div><div class="field"><label>Amount</label><input id="dataAmount" type="number" min="50" placeholder="Enter plan price"></div><div class="field"><label>Transaction PIN</label><input id="dataPin" class="v-pin" inputmode="numeric" maxlength="4" placeholder="••••"></div><button class="btn primary full" onclick="dataPay()">Buy data</button>`};
window.dataPay=async function(){const phone=document.getElementById('dataPhone')?.value.trim(),amount=Number(document.getElementById('dataAmount')?.value),pin=document.getElementById('dataPin')?.value.trim();if(!phone||!amount||!/^[0-9]{4}$/.test(pin||''))return alert('Enter phone, amount and 4-digit PIN.');try{await api('/api/services/payment',{method:'POST',body:JSON.stringify({type:'DATA',target:phone,amount,pin,narration:window.__dataCat+' '+window.__dataPlan})});await loadState();openModal(`<div class="v-processing"><div class="successicon">✓</div><h3>Data purchase successful</h3><p>${esc(window.__dataPlan)} on ${esc(phone)} was recorded in this simulation.</p><button class="btn primary full" onclick="closeModal();go('home')">Done</button></div>`,true)}catch(e){alert(e.message)}};
window.loansHtml=function(u){const active=(u.loans||[]).find(x=>x.status==='ACTIVE'||x.status==='APPROVED');return `<section class="page active" id="page-loans"><h1 class="title">Loan Center</h1><p class="subtitle">Choose an amount and repayment period.</p><div class="card"><div class="field"><label>Loan amount</label><input id="loanAmount" type="number" min="1000" placeholder="₦1,000"></div><div class="field"><label>Tenor</label><select id="loanTenor"><option value="1">30 days</option><option value="3">90 days</option><option value="6">180 days</option><option value="12">365 days</option></select></div><button class="btn primary full" onclick="requestLoanV2()">Apply for loan</button></div><div class="card" style="margin-top:12px"><div class="row"><span class="muted">Outstanding</span><b>${money(active?.totalRepayable||0)}</b></div>${active?'<button class="btn soft full" style="margin-top:12px" onclick="repayLoan()">Repay active loan</button>':'<p class="muted" style="margin-top:10px">No active loan.</p>'}</div></section>`};
window.requestLoanV2=async function(){const amount=Number(document.getElementById('loanAmount')?.value),months=Number(document.getElementById('loanTenor')?.value||12);if(!amount)return alert('Enter a loan amount.');const pin=prompt('Enter your 4-digit transaction PIN');if(pin===null)return;if(!/^[0-9]{4}$/.test(pin))return alert('PIN must be exactly 4 digits.');try{await api('/api/loans',{method:'POST',body:JSON.stringify({amount,durationMonths:months,pin})});await loadState();alert('Loan application submitted.');go('loans')}catch(e){alert(e.message)}};
window.vSettingsPage=function(u){const dark=(localStorage.getItem('veyra_theme')||'light')==='dark';return `<section class="page active" id="page-settings"><h1 class="title">Settings</h1><p class="subtitle">Security, privacy and account preferences.</p><div class="v-list"><button class="v-row" onclick="changePassword()"><div class="ri">🔒</div><div class="rb"><b>Change password</b></div><span class="v-arr">›</span></button><button class="v-row" onclick="changePin()"><div class="ri">⌘</div><div class="rb"><b>Change transaction PIN</b></div><span class="v-arr">›</span></button><button class="v-row" onclick="editProfile()"><div class="ri">✎</div><div class="rb"><b>Edit profile</b><div class="rs">Name, phone and email</div></div><span class="v-arr">›</span></button><button class="v-row" onclick="go('upgrade')"><div class="ri">↑</div><div class="rb"><b>Account upgrade</b><div class="rs">Change your Veyra account level</div></div><span class="v-arr">›</span></button><button class="v-row" onclick="toggleBalance()"><div class="ri">◌</div><div class="rb"><b>Private balance</b><div class="rs">${u.showBalance?'Balance visible':'Balance hidden'}</div></div><span class="v-arr">›</span></button><button class="v-row" onclick="toggleTheme()"><div class="ri">${dark?'☀':'◐'}</div><div class="rb"><b>${dark?'Light mode':'Dark mode'}</b><div class="rs">Change app appearance</div></div><span class="v-arr">›</span></button><button class="v-row" onclick="closeAccount()"><div class="ri">⊗</div><div class="rb"><b>Close account</b><div class="rs">Hide and deactivate this simulation account</div></div><span class="v-arr">›</span></button></div><button class="btn danger full" style="margin-top:14px" onclick="logout()">Sign out</button></section>`};
window.editProfile=function(){const u=current();openModal(`<div class="modalhead"><h2>Edit profile</h2><button class="close" onclick="closeModal()">×</button></div><p class="notice">The deployed backend currently has no profile-update endpoint, so these fields are displayed but not falsely saved.</p><div class="field"><label>Full name</label><input value="${esc(u.name)}" disabled></div><div class="field"><label>Phone</label><input value="${esc(u.phone)}" disabled></div><div class="field"><label>Email</label><input value="${esc(u.email)}" disabled></div><button class="btn outline full" onclick="closeModal()">Close</button>`,true)};
window.closeAccount=function(){if(!confirm('Close this Veyra simulation account?'))return;alert('Account closing needs a backend endpoint. No local-only fake close was performed.')};
window.vAccountPage=function(){const u=current(),ti=vTierInfo();return `<section class="page active" id="page-account"><h1 class="title">Account details</h1><p class="subtitle">Your Veyra account at a glance.</p><div class="card account-number-card"><div class="muted">Account number</div><div class="account-number-big">${esc(u.account)}</div><button class="btn soft" onclick="copyAccount()">Copy account number</button></div><div class="card"><div class="row"><span class="muted">Full name</span><b>${esc(u.name)}</b></div><div class="row" style="margin-top:14px"><span class="muted">Username</span><b>@${esc(u.username)}</b></div><div class="row" style="margin-top:14px"><span class="muted">Phone</span><b>${esc(u.phone)}</b></div><div class="row" style="margin-top:14px"><span class="muted">Email</span><b>${esc(u.email)}</b></div><div class="row" style="margin-top:14px"><span class="muted">Account level</span><b>${ti.name}</b></div></div></section>`};
const oldBind=window.bindPage;window.bindPage=function(page){oldBind(page);if(page==='send')bindTransferWizard();if(page==='settings')applyTheme();if(page==='home')setTimeout(brandAvatar,0)};
if(token()){renderShell();go('home')}
})();
</script></body>
</html>
