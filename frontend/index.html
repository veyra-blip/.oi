*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px}.brandmark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--green),#087c50);display:grid;place-items:center;color:#fff;font-weight:1000}.top-actions{display:flex;gap:9px;align-items:center}.iconbtn{width:42px;height:42px;border-radius:13px;background:#f1f5f2;color:#23332b}.badge{position:absolute;background:var(--danger);color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:9px;display:grid;place-items:center;margin:-48px 0 0 25px;border:2px solid #fff}.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 72px)}.side{background:#fff;border-right:1px solid var(--line);padding:20px 13px;position:sticky;top:72px;height:calc(100vh - 72px)}.navbtn{width:100%;padding:13px 14px;margin:3px 0;background:transparent;border-radius:14px;text-align:left;color:#5c6b63;font-weight:700}.navbtn.active,.navbtn:hover{background:#e9faf2;color:#078c55}.main{padding:25px;max-width:1450px;width:100%;margin:auto}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(135deg,#061d13,#0a5b3d);color:#fff;border-radius:27px;padding:28px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(0,217,130,.13);right:-100px;top:-110px}.hero-row{display:flex;justify-content:space-between;gap:20px;align-items:center;position:relative;z-index:1}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:#94e8c1;font-weight:900}.balance{font-size:39px;font-weight:950;letter-spacing:-1px;margin:7px 0}.muted{color:var(--muted)}.hero .muted{color:#b8d2c6}.quick{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border-radius:13px;padding:12px 16px;font-weight:850}.btn.primary{background:var(--green);color:#fff}.btn.light{background:#fff;color:#073f29}.btn.soft{background:#edf7f2;color:#087a4d}.btn.danger{background:#ffecee;color:#bd2c35}.btn.outline{background:transparent;border:1px solid var(--line);color:var(--text)}.grid{display:grid;gap:17px}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}.section{margin-top:23px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 8px 25px rgba(8,28,18,.035)}.card h3{margin:0 0 7px}.service{min-height:120px;display:flex;flex-direction:column;justify-content:space-between}.service-icon{width:44px;height:44px;border-radius:14px;background:#eafaf2;display:grid;place-items:center;color:#078c55;font-weight:950;font-size:19px}.service:hover{transform:translateY(-2px);box-shadow:var(--shadow);transition:.2s}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:24px;margin:0 0 6px}.subtitle{color:var(--muted);margin:0 0 18px}.list{display:flex;flex-direction:column}.tx{padding:14px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.tx:last-child{border-bottom:0}.txicon{width:42px;height:42px;border-radius:13px;background:#eef6f1;display:grid;place-items:center;font-weight:900}.txbody{flex:1;min-width:0}.txbody strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.amount{font-weight:900}.credit{color:#078c55}.debit{color:#c43a42}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef5f1;color:#547066;font-size:11px;font-weight:800}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #dbe5df;background:#fff;border-radius:13px;padding:13px 14px;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:#61d9a5;box-shadow:0 0 0 4px #e6faf1}.actions{display:flex;gap:9px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:rgba(2,12,8,.57);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.open{display:flex}.modalbox{background:#fff;width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:24px;padding:23px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:#f1f4f2;border-radius:10px;width:36px;height:36px}.auth{min-height:100vh;background:radial-gradient(circle at 80% 20%,#0b7c51 0,#07130e 42%,#030907 100%);display:grid;place-items:center;padding:18px}.authbox{width:min(520px,100%);background:#fff;border-radius:28px;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.35)}.authbrand{display:flex;align-items:center;gap:12px;margin-bottom:20px}.authbrand .brandmark{width:45px;height:45px}.authbox h1{margin:0 0 6px}.switch{text-align:center;color:var(--muted);margin-top:15px}.link{color:#008a52;font-weight:850;cursor:pointer}.notice{padding:12px 14px;border-radius:13px;background:#eef8f3;color:#17603f;font-size:13px;margin:12px 0}.error{background:#fff0f1;color:#b82e36}.search{display:flex;gap:9px;margin-bottom:15px}.search input{flex:1}.camera{background:#07130e;border-radius:18px;min-height:250px;overflow:hidden;position:relative}.camera video{width:100%;height:300px;object-fit:cover}.camera .scan{position:absolute;inset:25px;border:2px solid #55f0aa;border-radius:45%;box-shadow:0 0 0 999px rgba(0,0,0,.3)}.stat{font-size:25px;font-weight:950}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}.mobile-nav{display:none}.empty{text-align:center;padding:40px 15px;color:var(--muted)}.footer-note{text-align:center;color:#84918b;font-size:12px;padding:30px}.danger-text{color:var(--danger)}.lookup-card{margin-top:8px;padding:13px 14px;border:1px solid #bfead5;background:#f0fbf6;border-radius:14px;display:flex;flex-direction:column;gap:5px}.lookup-card b{font-size:15px}.lookup-card .tag{width:max-content}.profile-card{display:flex;align-items:center;gap:16px}.avatar{width:64px;height:64px;border-radius:50%;background:#e8faf1;color:#078c55;display:grid;place-items:center;font-size:25px;font-weight:950}
@media(max-width:1000px){.grid4{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.side{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:50;justify-content:space-around;padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.mobile-nav button{background:none;color:#6a7870;font-size:10px;font-weight:800}.mobile-nav button.active{color:#008b55}.mobile-nav span{display:block;font-size:20px;margin-bottom:2px}.main{padding:17px;padding-bottom:90px}.hero-row{display:block}.topbar{padding:0 13px}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.grid4,.grid3,.grid2{grid-template-columns:1fr 1fr}.balance{font-size:31px}.hero{padding:20px}.card{padding:16px}.grid3 .card:last-child{grid-column:span 2}.top-actions .hide-mobile{display:none}.title{font-size:21px}.service{min-height:105px}.quick .btn{flex:1}.authbox{padding:21px}.table th:nth-child(3),.table td:nth-child(3){display:none}}

op:4px}.v-arr{font-size:23px;color:#777d79}.v-bank{display:flex;align-items:center;gap:12px;padding:14px;background:#292b2a;color:#fff;border-bottom:1px solid #3b3d3c;width:100%;text-align:left}.v-bank-logo{width:45px;height:45px;border-radius:50%;background:#f4f4f4;color:#111;display:grid;place-items:center;font-size:9px;font-weight:950}.v-bank .rb{flex:1}.v-bank:last-child{border-bottom:0}.v-tier{background:linear-gradient(135deg,#123d30,#1c2925);border:1px solid #3c6d5c;border-radius:20px;padding:16px;margin-top:12px}.v-tier.active{box-shadow:0 0 0 2px var(--vg) inset}.v-stat{font-size:22px;font-weight:950}.v-atm{background:#0b0d0c;border:1px solid #414744;border-radius:22px;padding:20px}.v-atm-screen{background:#073b2b;border:5px solid #272b29;border-radius:9px;min-height:135px;display:grid;place-items:center;text-align:center;font-family:monospace;padding:15px}.v-atm-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.v-atm-key{background:#303432;color:#fff;padding:14px;border-radius:10px}.v-profile-photo{width:88px;height:88px;border-radius:50%;overflow:hidden;background:#3b3d3c;display:grid;place-items:center;font-size:28px}.v-profile-photo img{width:100%;height:100%;object-fit:cover}.v-notice{padding:12px;border-radius:13px;background:#173d31;color:#9ce6cc;font-size:12px;margin-top:10px}.v-bank-note{padding:12px;border-radius:13px;background:#332b18;color:#f4d47b;font-size:11px;margin-top:10px}

<script>
'use strict';

/*
  VEYRA shared-wallet frontend
  IMPORTANT: set API_BASE to the public URL where backend/src/server.ts is deployed.
  Example: https://your-veyra-api.example.com
*/
const API_BASE = 'https://veyra-api-etnq.onrender.com';
const TOKEN_KEY='veyra_access_token';
const REFRESH_KEY='veyra_refresh_token';
const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const now=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let state={user:null,tx:[],notifications:[]};
let lookupTimer=null;

function token(){return localStorage.getItem(TOKEN_KEY)||''}
function setTokens(access,refresh){if(access)localStorage.setItem(TOKEN_KEY,access);if(refresh)localStorage.setItem(REFRESH_KEY,refresh)}
function clearTokens(){localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(REFRESH_KEY)}
function apiUrl(path){return API_BASE+path}
async function api(path,options={},retry=true){
  const headers={'Content-Type':'application/json',...(options.headers||{})};
  if(token())headers.Authorization='Bearer '+token();
  let r;
  try{r=await fetch(apiUrl(path),{...options,headers})}
  catch(e){throw new Error('Veyra is temporarily unavailable. Please try again in a moment.')}
  if(r.status===401&&retry&&localStorage.getItem(REFRESH_KEY)){
    const rr=await fetch(apiUrl('/api/auth/refresh'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refreshToken:localStorage.getItem(REFRESH_KEY)})});
    if(rr.ok){const d=await rr.json();setTokens(d.accessToken,null);return api(path,options,false)}
    clearTokens();state={user:null,tx:[],notifications:[]};authView('login');throw new Error('Session expired. Please sign in again.')
  }
  let data={};try{data=await r.json()}catch{}
  if(!r.ok)throw new Error(data.message||data.code||('Request failed ('+r.status+')'));
  return data;
}

const root=document.getElementById('root');
function authView(mode='login',notice=''){
  root.innerHTML=`<div class="auth"><div class="authbox"><div class="authbrand"><div class="brandmark">V</div><div><b>Veyra</b><div class="muted">Secure internal payments</div></div></div><h1>${mode==='login'?'Welcome back':'Create your account'}</h1><p class="muted">${mode==='login'?'Sign in to continue.':'Set up your personal wallet account.'}</p><div id="authmsg">${notice?`<div class="notice error">${esc(notice)}</div>`:''}</div><form id="authform">${mode==='register'?`<div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Username</label><input name="username" pattern="[A-Za-z0-9_]{3,30}" required></div><div class="field"><label>Phone / transaction number</label><input name="phone" inputmode="tel" placeholder="08012345678" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>NIN</label><input name="nin" inputmode="numeric" minlength="11" maxlength="11"></div><div class="field"><label>Password</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>Transaction PIN</label><input name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div>`:`<div class="field"><label>Username, email or phone</label><input name="identity" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div>`}<button class="btn primary" style="width:100%">${mode==='login'?'Sign in':'Create account'}</button></form><div class="switch">${mode==='login'?`New here? <span class="link" id="reg">Create account</span><br><span class="link" id="forgot">Forgot password?</span>`:`Already have an account? <span class="link" id="login">Sign in</span>`}</div><div class="notice" style="margin-top:18px">Veyra transfers are internal simulated wallet transfers. No real bank money is moved.</div></div></div>`;
  document.getElementById('authform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(mode==='register')register(f);else login(f)};
  document.getElementById(mode==='login'?'reg':'login')?.addEventListener('click',()=>authView(mode==='login'?'register':'login'));
  document.getElementById('forgot')?.addEventListener('click',forgot);
}
function msg(t,err=false){const x=document.getElementById('authmsg');if(x)x.innerHTML=`<div class="notice ${err?'error':''}">${esc(t)}</div>`}
function splitName(name){const p=String(name||'').trim().split(/\s+/);return {firstName:p.shift()||'User',lastName:p.join(' ')||'User'}}
async function register(f){
  const name=String(f.get('name')).trim(), n=splitName(name);
  try{
    const d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({firstName:n.firstName,lastName:n.lastName,username:String(f.get('username')).trim().toLowerCase(),phone:String(f.get('phone')).trim(),email:String(f.get('email')).trim().toLowerCase(),password:String(f.get('password')),pin:String(f.get('pin')),nin:String(f.get('nin')||'').trim()})},false);
    setTokens(d.accessToken,d.refreshToken);await app();
  }catch(e){msg(e.message,true)}
}
async function login(f){
  try{
    const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({identifier:String(f.get('identity')).trim(),password:String(f.get('password'))})},false);
    setTokens(d.accessToken,d.refreshToken);await app();
  }catch(e){msg(e.message,true)}
}
function forgot(){
  openModal(`<div class="modalhead"><h2>Recover your account</h2><button class="close" onclick="closeModal()">×</button></div>
  <p class="muted">Use your username, email or phone. You can recover with a one-time code or your enrolled face.</p>
  <div class="field"><label>Username, email or phone</label><input id="resetIdentity" autocomplete="username"></div>
  <div class="actions"><button class="btn primary" onclick="requestResetCode()">Get reset code</button><button class="btn soft" onclick="openFaceReset()">Recover with face</button></div>
  <div id="resetBox"></div>`);
}
async function requestResetCode(){
  const identifier=document.getElementById('resetIdentity').value.trim(); if(!identifier)return alert('Enter your username, email or phone.');
  try{const d=await api('/api/auth/reset/request',{method:'POST',body:JSON.stringify({identifier})},false);document.getElementById('resetBox').innerHTML=`<div class="notice">Your one-time reset code is <b>${esc(d.devCode||'Sent')}</b>. It expires in 10 minutes.</div><div class="field"><label>6-digit code</label><input id="resetCode" inputmode="numeric" maxlength="6"></div><div class="field"><label>New password</label><input id="resetPassword" type="password" minlength="8"></div><button class="btn primary" onclick="confirmReset()">Set new password</button>`}catch(e){document.getElementById('resetBox').innerHTML=`<div class="notice error">${esc(e.message)}</div>`}
}
async function confirmReset(){
  const identifier=document.getElementById('resetIdentity').value.trim(),code=document.getElementById('resetCode').value.trim(),newPassword=document.getElementById('resetPassword').value;
  try{const d=await api('/api/auth/reset/confirm',{method:'POST',body:JSON.stringify({identifier,code,newPassword})},false);closeModal();authView('login',d.message)}catch(e){alert(e.message)}
}
async function openFaceReset(){
  const identifier=document.getElementById('resetIdentity').value.trim(); if(!identifier)return alert('Enter your username, email or phone first.');
  openCameraModal('Verify your enrolled face', async template=>{
    try{const d=await api('/api/auth/reset/face',{method:'POST',body:JSON.stringify({identifier,template})},false);document.getElementById('resetBox').innerHTML=`<div class="notice">Face matched. Set a new password below.</div><div class="field"><label>New password</label><input id="resetPassword" type="password" minlength="8"></div><button class="btn primary" onclick="confirmFaceReset('${d.faceToken}')">Set new password</button>`}catch(e){alert(e.message)}
  });
}
async function confirmFaceReset(faceToken){const identifier=document.getElementById('resetIdentity').value.trim(),newPassword=document.getElementById('resetPassword').value;try{const d=await api('/api/auth/reset/confirm',{method:'POST',body:JSON.stringify({identifier,faceToken,newPassword})},false);closeModal();authView('login',d.message)}catch(e){alert(e.message)}}

async function loadState(){
  const [m,t,n,sv,cd,lo]=await Promise.all([api('/api/me'),api('/api/transactions'),api('/api/notifications'),api('/api/savings'),api('/api/cards'),api('/api/loans')]);
  const u=m.user;
  state.user={...u,name:`${u.firstName} ${u.lastName}`,account:u.accountNumber,balance:Number(u.balance),showBalance:true,savings:(sv.savings||[]).reduce((a,x)=>a+Number(x.balance||0),0),savingsAccounts:sv.savings||[],cards:cd.cards||[],loans:lo.loans||[],loan:(lo.loans||[]).filter(x=>x.status==='ACTIVE'||x.status==='APPROVED').reduce((a,x)=>a+Number(x.totalRepayable||0),0),notifications:n.notifications||[],tx:normalizeTx(t.transactions||[]),beneficiaries:[],role:'user'};state.user.beneficiaries=JSON.parse(localStorage.getItem('veyra_beneficiaries_'+u.id)||'[]');
  state.tx=state.user.tx;state.notifications=state.user.notifications;
}
function normalizeTx(rows){return rows.map(t=>{const credit=t.receiverId===state.user?.id;return {id:t.id,date:t.createdAt,title:credit?`Transfer from ${t.sender?.firstName||'User'} ${t.sender?.lastName||''}`:`Transfer to ${t.recipientName||'User'}`,amount:Number(t.amount),kind:credit?'credit':'debit',recipient:t.recipientAccount,note:t.narration,reference:t.reference,status:t.status}})}
function current(){return state.user}
async function app(){try{await loadState();renderShell();go('home');setTimeout(ensureFaceEnrollment,500)}catch(e){clearTokens();authView('login',e.message)}}
function renderShell(){const u=current();root.innerHTML=`<div class="app"><header class="topbar"><div class="brand"><div class="brandmark">V</div>Veyra</div><div class="top-actions"><button class="iconbtn" id="searchBtn">⌕</button><button class="iconbtn" id="notifBtn" style="position:relative">♢<span class="badge" id="nb">${state.notifications.filter(n=>!n.read).length||''}</span></button><button class="iconbtn" id="profileBtn">◉</button></div></header><div class="layout"><aside class="side">${navHtml()}<div style="position:absolute;bottom:20px;left:13px;right:13px"><button class="navbtn" id="logout">⇥ Sign out</button></div></aside><main class="main"><div id="pages"></div><div class="footer-note">Veyra · Internal transactions only</div></main></div><nav class="mobile-nav">${[['home','⌂','Home'],['send','↗','Send'],['history','◷','History'],['services','▦','Services'],['profile','◉','Profile']].map(x=>`<button data-nav="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav></div><div id="modal" class="modal"></div>`;
 document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));document.getElementById('logout').onclick=logout;document.getElementById('searchBtn').onclick=searchModal;document.getElementById('notifBtn').onclick=notifications;document.getElementById('profileBtn').onclick=()=>go('profile')}

function templateFromVideo(video){
  const canvas=document.createElement('canvas'); canvas.width=32; canvas.height=32; const ctx=canvas.getContext('2d',{willReadFrequently:true});
  const size=Math.min(video.videoWidth||320,video.videoHeight||240); const sx=((video.videoWidth||320)-size)/2, sy=((video.videoHeight||240)-size)/2;
  ctx.drawImage(video,sx,sy,size,size,0,0,32,32); const px=ctx.getImageData(0,0,32,32).data; const v=[];
  for(let i=0;i<px.length;i+=4)v.push((0.299*px[i]+0.587*px[i+1]+0.114*px[i+2])/255);
  const mean=v.reduce((a,b)=>a+b,0)/v.length; const sd=Math.sqrt(v.reduce((a,b)=>a+(b-mean)**2,0)/v.length)||1; return v.map(x=>(x-mean)/sd);
}
async function openCameraModal(title,onCapture){
  openModal(`<div class="modalhead"><h2>${esc(title)}</h2><button class="close" id="cameraCancel">×</button></div><p class="muted">Center your face inside the frame, keep your face visible and look at the camera.</p><div class="camera"><video id="faceVideo" autoplay muted playsinline></video><div class="scan"></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="captureFaceBtn">Capture and continue</button><button class="btn outline" id="cameraCancel2">Cancel</button></div><p id="faceMsg" class="muted"></p>`);
  let stream; try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});const v=document.getElementById('faceVideo');v.srcObject=stream;await v.play()}catch(e){document.getElementById('faceMsg').textContent='Camera permission is required for this feature.';return false}
  const close=()=>{stream?.getTracks().forEach(t=>t.stop());closeModal()}; document.getElementById('cameraCancel').onclick=close;document.getElementById('cameraCancel2').onclick=close;
  document.getElementById('captureFaceBtn').onclick=async()=>{const v=document.getElementById('faceVideo');if(!v.videoWidth){document.getElementById('faceMsg').textContent='Camera is not ready yet.';return}const template=templateFromVideo(v);stream?.getTracks().forEach(t=>t.stop());await onCapture(template);};
  return true;
}

async function beginTransfer(recipient,amount,note){
  if(!recipient||!Number.isFinite(amount)||amount<=0)return alert('Enter a valid recipient and amount.');
  const box=document.getElementById('recipientLookup');let recipientId=box?.dataset.recipientId;
  if(!recipientId){try{const d=await api('/api/users/lookup?q='+encodeURIComponent(recipient));recipientId=d.recipient.id}catch(e){return alert('Recipient account was not found in the shared Veyra database.')}}
  if(amount>current().balance)return alert('Insufficient balance.');
  if(isNight()){const ok=await faceVerify();if(!ok)return}
  const pin=prompt('Enter your 4-digit transaction PIN');if(pin===null)return;if(!/^\d{4}$/.test(pin))return alert('PIN must be exactly 4 digits.');
  try{
    const d=await api('/api/transfers/internal',{method:'POST',headers:{'Idempotency-Key':uid()},body:JSON.stringify({recipientId,amount,narration:note||undefined,pin})});
    await loadState();alert(`Transfer successful.\n${money(amount)} sent.\nThe recipient's Veyra wallet has been credited.`);go('home');
  }catch(e){alert(e.message)}
}

const V_BANKS=['Access Bank','Citibank Nigeria','Ecobank Nigeria','Fidelity Bank','First Bank of Nigeria','First City Monument Bank (FCMB)','Globus Bank','Guaranty Trust Bank (GTBank)','Jaiz Bank','Keystone Bank','Kuda','Lotus Bank','Moniepoint MFB','Optimus Bank','Parallex Bank','Polaris Bank','PremiumTrust Bank','Providus Bank','Stanbic IBTC Bank','Standard Chartered Bank Nigeria','Sterling Bank','SunTrust Bank','TajBank','Union Bank of Nigeria','United Bank for Africa (UBA)','Unity Bank','Wema Bank','Zenith Bank','Veyra Bank'];
const V_NAMES=['CHUKWUEMEKA OKAFOR','AMAKA NWACHUKWU','DAVID IKECHUKWU','GRACE EZE','NNAMDI OBI','CHIOMA UDEH','MICHAEL NWANKWO','BLESSING ONYEKACHI','JOHN EZE','ESTHER NWABUEZE','VICTOR NNAMANI','RITA OKORO','EMEKA NWABUNIKE','IFEOMA OKOYE','DANIEL EZEAGU'];
let vTier=JSON.parse(localStorage.getItem('veyra_account_tiers')||'{}');
let vPhotos=JSON.parse(localStorage.getItem('veyra_profile_photos')||'{}');
function vTierNo(){return Number(vTier[current()?.id]||1)}
function vTierInfo(){const n=vTierNo();return n===1?{name:'Basic',balance:500000000,transfer:50000000}:{name:n===2?'Verified':'Premium',balance:n===2?2000000000:Infinity,transfer:n===2?500000000:40000000000}}
function vTodaySent(){return state.tx.filter(x=>x.kind==='debit'&&new Date(x.date).toDateString()===new Date().toDateString()&&/transfer/i.test(x.title)).reduce((a,x)=>a+Number(x.amount),0)}
function vBankInitials(b){return b.split(/\s+/).filter(Boolean).slice(0,3).map(x=>x[0]).join('')}
function vFakeName(bank,acct){let n=0;for(const c of bank+acct)n=(n+c.charCodeAt(0))%V_NAMES.length;return V_NAMES[n]}
function vPhoto(u){const p=vPhotos[u.id];return p?`<div class="v-profile-photo"><img src="${p}" alt="Profile"></div>`:`<div class="v-profile-photo">${esc((u.firstName||u.name||'U')[0])}</div>`}
function vSaveTier(n){vTier[current().id]=n;localStorage.setItem('veyra_account_tiers',JSON.stringify(vTier));alert('Account upgraded to '+(n===1?'Basic':n===2?'Verified':'Premium'));go('profile')}
function navHtml(){return [['home','⌂','Home'],['send','↗','Transfer'],['history','◷','History'],['services','▦','Services'],['savings','⌁','Finance'],['cards','▭','Cards'],['loans','₦','Loan'],['profile','●','Me'],['settings','⚙','Settings']].map(x=>`<button class="navbtn" data-nav="${x[0]}">${x[1]} &nbsp; ${x[2]}</button>`).join('')}
function pageHtml(page){if(page==='bank')return vBankPage();if(page==='upgrade')return vUpgradePage();if(page==='atm')return vAtmPage();if(page==='account')return vAccountPage();if(page==='fingerprint')return vFingerprintPage();const u=current();if(page==='home')return homeHtml(u);if(page==='send')return sendHtml(u);if(page==='history')return historyHtml(u);if(page==='services')return vServicesPage();if(page==='savings')return savingsHtml(u);if(page==='cards')return cardsHtml(u);if(page==='loans')return loansHtml(u);if(page==='beneficiaries')return beneficiariesHtml(u);if(page==='profile')return vProfilePage(u);if(page==='settings')return vSettingsPage(u);return ''}
function homeHtml(u){const ti=vTierInfo(),bal=u.showBalance?money(u.balance):'••••••••',tx=state.tx.slice().reverse().slice(0,4);return `<section class="page active" id="page-home"><div class="greet" style="display:flex;align-items:center;gap:11px;margin-bottom:13px">${vPhoto(u)}<div><b>${esc(u.firstName||u.name)}</b><div><span class="tag">${ti.name} Account</span></div></div><button class="iconbtn" style="margin-left:auto" onclick="go('settings')">⚙</button></div><div class="hero"><div class="eyebrow">Available Balance</div><div class="balance">${bal}</div><div class="muted">Account ${esc(u.account)} · Daily transfer ${money(ti.transfer)}</div><div class="quick"><button class="btn light" onclick="go('send')">To Veyra</button><button class="btn" style="background:#164f3a;color:#fff" onclick="go('bank')">To Bank</button><button class="btn" style="background:#164f3a;color:#fff" onclick="go('atm')">ATM</button></div></div><div class="v-opay-grid" style="margin-top:13px">${[['↗','Transfer','send'],['＋','Add money','account'],['◈','Limits','account'],['✓','Security','settings']].map(x=>`<button class="v-opay-action" onclick="go('${x[2]}')"><div class="ico">${x[0]}</div><span>${x[1]}</span></button>`).join('')}</div><div class="section"><div class="row"><h2 class="title">Quick services</h2><button class="btn soft" onclick="go('services')">See all</button></div><div class="grid grid4">${[['☎','Airtime'],['◉','Data'],['♢','Betting'],['▣','TV'],['ϟ','Electricity'],['▤','Education'],['₦','Loan'],['⬆','Upgrade']].map(x=>`<div class="card service" onclick="${x[1]==='Loan'?'go(\'loans\')':x[1]==='Upgrade'?'go(\'upgrade\')':`serviceModal('${x[1]}')`}"><div class="service-icon">${x[0]}</div><b>${x[1]}</b><div class="muted" style="font-size:11px">Open</div></div>`).join('')}</div></div><div class="v-list" style="margin-top:13px"><button class="v-row" onclick="go('loans')"><div class="ri">♧</div><div class="rb"><b>My Loan</b><div class="rs">Request and repay a Veyra loan</div></div><span class="v-arr">›</span></button><button class="v-row" onclick="go('upgrade')"><div class="ri">⬆</div><div class="rb"><b>Account Upgrade</b><div class="rs">${ti.name} · ${ti.balance===Infinity?'Unlimited balance':money(ti.balance)}</div></div><span class="v-arr">›</span></button><button class="v-row" onclick="go('account')"><div class="ri">●</div><div class="rb"><b>Account View</b><div class="rs">Profile, account number, NIN and limits</div></div><span class="v-arr">›</span></button></div><div class="card" style="margin-top:13px"><div class="row"><h3>Recent transactions</h3><button class="btn soft" onclick="go('history')">See all</button></div>${tx.length?tx.map(txHtml).join(''):'<div class="empty">No transactions yet.</div>'}</div></section>`}
function sendHtml(u){return `<section class="page active" id="page-send"><h1 class="title">Transfer</h1><p class="subtitle">Search a Veyra account or choose a Nigerian bank.</p><div class="grid grid2"><div class="card"><h3>Veyra account</h3><p class="muted">Search for a Veyra account by account number, phone or username.</p><div class="field"><label>Search for Veyra account</label><input id="vSearch2" placeholder="Account / phone / @username"></div><div id="vResult2"></div></div><div class="card"><h3>Other banks</h3><p class="muted">Search all supported Nigerian banks. Name enquiry is simulated because no live bank API is connected.</p><button class="btn primary" onclick="go('bank')">See all banks</button></div></div><div class="v-notice">After a successful Veyra-to-Veyra transfer, the sender balance is debited, the recipient wallet is credited, and the recipient gets a notification from the shared backend.</div></section>`}
function vServicesPage(){return `<section class="page active" id="page-services"><h1 class="title">All Services</h1><p class="subtitle">A Veyra version of the familiar Nigerian wallet service layout.</p><div class="v-list">${[['☎','Airtime','Buy airtime'],['◉','Data','Buy data'],['♢','Betting','Fund betting account'],['▣','TV','Pay TV'],['ϟ','Electricity','Pay electricity'],['▤','Education','Education payment'],['₦','Loan','Loan center'],['⌁','Savings','Savings'],['▭','Cards','Virtual card'],['⬆','Upgrade','Account upgrade'],['▣','ATM','Visual ATM'],['⚙','Settings','Security and preferences']].map(x=>`<button class="v-row" onclick="${x[1]==='Loan'?'go(\'loans\')':x[1]==='Savings'?'go(\'savings\')':x[1]==='Cards'?'go(\'cards\')':x[1]==='Upgrade'?'go(\'upgrade\')':x[1]==='ATM'?'go(\'atm\')':x[1]==='Settings'?'go(\'settings\')':`serviceModal('${x[1]}')`}"><div class="ri">${x[0]}</div><div class="rb"><b>${x[1]}</b><div class="rs">${x[2]}</div></div><span class="v-arr">›</span></button>`).join('')}</div></section>`}
function vProfilePage(u){const ti=vTierInfo();return `<section class="page active" id="page-profile"><h1 class="title">Profile</h1><p class="subtitle">Account identity and controls.</p><div class="card"><div style="display:flex;align-items:center;gap:14px">${vPhoto(u)}<div><b style="font-size:18px">@${esc(u.username)}</b><div class="muted">${esc(u.name)}</div><span class="tag">${ti.name}</span></div><button class="iconbtn" style="margin-left:auto" onclick="vPhotoMenu()">✎</button></div></div><div class="v-list" style="margin-top:13px"><button class="v-row" onclick="go('account')"><div class="ri">◈</div><div class="rb"><b>Account information</b><div class="rs">Account number, phone, email, NIN</div></div><span class="v-arr">›</span></button><button class="v-row" onclick="go('upgrade')"><div class="ri">⬆</div><div class="rb"><b>Upgrade account</b><div class="rs">${ti.name} · transfer ${money(ti.transfer)}</div></div><span class="v-arr">›</span></button><button class="v-row" onclick="enrollFace()"><div class="ri">◉</div><div class="rb"><b>Face verification</b><div class="rs">Capture or update your Veyra face template</div></div><span class="v-arr">›</span></button><button class="v-row" onclick="go('fingerprint')"><div class="ri">☝</div><div class="rb"><b>Fingerprint / device biometric</b><div class="rs">Android device authentication when supported</div></div><span class="v-arr">›</span></button><button class="v-row" onclick="go('settings')"><div class="ri">⚙</div><div class="rb"><b>Settings</b><div class="rs">Password, PIN, privacy and security</div></div><span class="v-arr">›</span></button></div></section>`}
function vSettingsPage(u){return `<section class="page active" id="page-settings"><h1 class="title">Settings</h1><p class="subtitle">Manage your Veyra account.</p><div class="v-list"><button class="v-row" onclick="changePassword()"><div class="ri">🔒</div><div class="rb"><b>Change password</b></div><span class="v-arr">›</span></button><button class="v-row" onclick="changePin()"><div class="ri">⌘</div><div class="rb"><b>Change transaction PIN</b></div><span class="v-arr">›</span></button><button class="v-row" onclick="go('fingerprint')"><div class="ri">☝</div><div class="rb"><b>Fingerprint / device biometric</b><div class="rs">Use the phone's secure authenticator</div></div><span class="v-arr">›</span></button><button class="v-row" onclick="enrollFace()"><div class="ri">◉</div><div class="rb"><b>Face verification</b></div><span class="v-arr">›</span></button><button class="v-row" onclick="toggleBalance()"><div class="ri">◌</div><div class="rb"><b>Private balance mode</b><div class="rs">${u.showBalance?'Balance is visible':'Balance is hidden'}</div></div><span class="v-arr">›</span></button><button class="v-row" onclick="go('upgrade')"><div class="ri">⬆</div><div class="rb"><b>Account upgrade</b></div><span class="v-arr">›</span></button></div><button class="btn danger" style="width:100%;margin-top:13px" onclick="logout()">Sign out</button></section>`}
function vUpgradePage(){const cur=vTierNo(),plans=[{n:1,name:'Basic',bal:'₦500,000,000',lim:'₦50,000,000',d:'Starting account'},{n:2,name:'Verified',bal:'₦2,000,000,000',lim:'₦500,000,000',d:'Higher wallet and transfer capacity'},{n:3,name:'Premium',bal:'Unlimited',lim:'₦40,000,000,000',d:'Maximum simulated level'}];return `<section class="page active" id="page-upgrade"><h1 class="title">Account Upgrade</h1><p class="subtitle">Choose your simulated account level.</p>${plans.map(p=>`<div class="v-tier ${cur===p.n?'active':''}"><div class="row"><b>${p.name}</b>${cur===p.n?'<span class="tag">CURRENT</span>':''}</div><p class="small">${p.d}</p><div class="row"><span class="small">Maximum balance</span><b>${p.bal}</b></div><div class="row" style="margin-top:10px"><span class="small">Daily outgoing transfer</span><b>${p.lim}</b></div>${cur<p.n?`<button class="btn primary" style="width:100%;margin-top:12px" onclick="vSaveTier(${p.n})">Upgrade to ${p.name}</button>`:''}</div>`).join('')}<div class="v-notice">The level is stored in this browser for the UI. The current Render backend does not yet persist account-tier limits, so this HTML also checks the transfer ceiling before sending a Veyra transfer.</div></section>`}
function vAccountPage(){const u=current(),ti=vTierInfo();return `<section class="page active" id="page-account"><h1 class="title">Account View</h1><p class="subtitle">Your Veyra account at a glance.</p><div class="card"><div class="row"><span class="muted">Available balance</span><b>${u.showBalance?money(u.balance):'••••••••'}</b></div><div class="row" style="margin-top:15px"><span class="muted">Account number</span><b>${esc(u.account)}</b></div><div class="row" style="margin-top:15px"><span class="muted">Username</span><b>@${esc(u.username)}</b></div><div class="row" style="margin-top:15px"><span class="muted">Account level</span><b>${ti.name}</b></div></div><div class="grid grid2" style="margin-top:13px"><div class="card"><div class="muted">Maximum balance</div><div class="stat">${ti.balance===Infinity?'Unlimited':money(ti.balance)}</div></div><div class="card"><div class="muted">Daily transfer</div><div class="stat">${money(ti.transfer)}</div></div></div><div class="card"><b>Identity</b><div class="row" style="margin-top:14px"><span class="muted">Full name</span><b>${esc(u.name)}</b></div><div class="row" style="margin-top:14px"><span class="muted">Phone</span><b>${esc(u.phone)}</b></div><div class="row" style="margin-top:14px"><span class="muted">Email</span><b>${esc(u.email)}</b></div><div class="row" style="margin-top:14px"><span class="muted">NIN</span><b>${u.nin?'Supplied':'Not supplied'}</b></div></div><button class="btn primary" style="width:100%;margin-top:13px" onclick="go('upgrade')">Upgrade account</button></section>`}
function vBankPage(){return `<section class="page active" id="page-bank"><h1 class="title">To Bank</h1><p class="subtitle">Search for a Nigerian bank, then enter an account number.</p><div class="card"><div class="field"><label>Search banks</label><input id="vBankQ" placeholder="Access, GTBank, Zenith..." oninput="vRenderBanks(this.value)"></div><div id="vBanks"></div><div class="v-bank-note">Bank-name enquiry is simulated. Veyra is not connected to live NIBSS/bank APIs, so the displayed name is generated deterministically from the bank and account number.</div></div></section>`}
function vRenderBanks(q){const out=document.getElementById('vBanks');if(!out)return;const a=V_BANKS.filter(b=>b.toLowerCase().includes((q||'').toLowerCase()));out.innerHTML=a.map(b=>`<button class="v-bank" onclick="vChooseBank('${esc(b)}')"><div class="v-bank-logo">${esc(vBankInitials(b))}</div><div class="rb"><b>${esc(b)}</b><div class="small">Search account</div></div><span class="v-arr">›</span></button>`).join('')}
function vChooseBank(bank){openModal(`<div class="modalbox"><div class="modalhead"><h2>${esc(bank)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Account number</label><input id="extAcct2" class="fieldinput" inputmode="numeric" maxlength="10" oninput="vFakeLookup('${esc(bank)}',this.value)"></div><div id="vFakeOut"></div><div class="field"><label>Amount</label><input id="extAmt2" type="number" min="1"></div><button class="btn primary" style="width:100%" onclick="vExternalSend('${esc(bank)}')">Continue</button></div>`)}
function vFakeLookup(bank,a){const o=document.getElementById('vFakeOut');if(!o)return;if(a.length<10){o.innerHTML='';return}o.innerHTML=`<div class="lookup-card"><b>${esc(vFakeName(bank,a))}</b><div class="muted">${esc(bank)} · ${esc(a)}</div><span class="tag">✓ Simulated name enquiry</span></div>`}
function vExternalSend(bank){const a=Number(document.getElementById('extAmt2').value),acct=document.getElementById('extAcct2').value;if(acct.length!==10||!a)return alert('Enter a 10-digit account number and amount.');if(a>current().balance)return alert('Insufficient balance.');alert('External bank transfer is not connected. No real bank account was credited.');closeModal()}
function vAtmPage(){return `<section class="page active" id="page-atm"><h1 class="title">Veyra ATM</h1><p class="subtitle">Visual ATM experience for the internal simulation.</p><div class="v-atm"><div class="v-atm-screen"><div><div>VEYRA ATM</div><div style="font-size:24px;margin-top:8px">${current().showBalance?money(current().balance):'••••••••'}</div><small>READY</small></div></div><div class="v-atm-grid"><button class="v-atm-key" onclick="alert('Cash withdrawal is visual-only in this HTML. The wallet backend has no ATM cash endpoint.')">Cash withdrawal</button><button class="v-atm-key" onclick="alert('Balance: '+money(current().balance))">Balance</button><button class="v-atm-key" onclick="go('send')">Transfer</button><button class="v-atm-key" onclick="go('cards')">Card menu</button></div></div><div class="v-notice">The ATM is visual/simulation only. It does not dispense physical cash.</div></section>`}
function vFingerprintPage(){return `<section class="page active" id="page-fingerprint"><h1 class="title">Fingerprint & Device Biometric</h1><p class="subtitle">Use the Android device's secure biometric authenticator when supported.</p><div class="card"><div style="font-size:54px;text-align:center;margin:10px">☝</div><h3 style="text-align:center">Device authentication</h3><p class="muted" style="text-align:center">This uses WebAuthn/platform authentication where the browser and phone support it. A normal web page cannot directly read or store your fingerprint.</p><button class="btn primary" style="width:100%" onclick="vEnrollBio()">Set up device biometric</button><button class="btn soft" style="width:100%;margin-top:9px" onclick="vTestBio()">Test biometric</button></div></section>`}
async function vEnrollBio(){if(!window.PublicKeyCredential)return alert('WebAuthn is not supported in this browser.');try{if(!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()))return alert('No platform biometric authenticator is available.');const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Veyra Bank',id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:current().username,displayName:current().name},pubKeyCredParams:[{type:'public-key',alg:-7}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});if(cred){localStorage.setItem('veyra_bio_'+current().id,'1');alert('Device biometric enrolled on this device.')}}catch(e){alert('Biometric setup was cancelled or unavailable.')}}
async function vTestBio(){if(!localStorage.getItem('veyra_bio_'+current().id))return alert('Set up device biometric first.');alert('This browser-level enrollment is active. Server-side biometric enforcement requires a WebAuthn credential endpoint in the backend.')}
function vPhotoMenu(){openModal(`<div class="modalbox"><div class="modalhead"><h2>Profile photo</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Choose a photo from your phone. The photo is stored in this browser for the prototype.</p><input type="file" accept="image/*" class="fieldinput" onchange="vSavePhoto(this.files[0])"><button class="btn soft" style="width:100%;margin-top:10px" onclick="vCameraPhoto()">Take photo with camera</button><button class="btn danger" style="width:100%;margin-top:10px" onclick="vDeletePhoto()">Remove photo</button></div>`)}
function vSavePhoto(file){if(!file)return;const r=new FileReader();r.onload=()=>{vPhotos[current().id]=r.result;localStorage.setItem('veyra_profile_photos',JSON.stringify(vPhotos));closeModal();go('profile')};r.readAsDataURL(file)}
function vDeletePhoto(){delete vPhotos[current().id];localStorage.setItem('veyra_profile_photos',JSON.stringify(vPhotos));closeModal();go('profile')}
async function vCameraPhoto(){openModal(`<div class="modalbox"><div class="modalhead"><h2>Take photo</h2><button class="close" id="vpclose">×</button></div><div class="camera"><video id="vpvideo" autoplay muted playsinline></video></div><button class="btn primary" id="vpcap" style="width:100%;margin-top:10px">Capture</button></div>`);let s;try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});const v=document.getElementById('vpvideo');v.srcObject=s;await v.play();document.getElementById('vpclose').onclick=()=>{s.getTracks().forEach(t=>t.stop());closeModal()};document.getElementById('vpcap').onclick=()=>{const c=document.createElement('canvas');c.width=480;c.height=480;const x=c.getContext('2d'),z=Math.min(v.videoWidth,v.videoHeight);x.drawImage(v,(v.videoWidth-z)/2,(v.videoHeight-z)/2,z,z,0,0,480,480);vPhotos[current().id]=c.toDataURL('image/jpeg',.85);localStorage.setItem('veyra_profile_photos',JSON.stringify(vPhotos));s.getTracks().forEach(t=>t.stop());closeModal();go('profile')}}catch(e){alert('Camera permission is required.')}}
</script>
</body>
</html>
